name: Whakapapa Causality V2

on:
  push:
    branches:
      - experiment/whakapapa-causality-v2-admissible
    paths:
      - 'experiments/whakapapa_causality_v2.py'
      - 'protocols/WHAKAPAPA_CAUSALITY_V2_PRECOMMIT.md'
      - '.github/workflows/whakapapa-causality-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: whakapapa-causality-v2
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/whakapapa-causality-v2-admissible

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify prospective precommit ancestry
        run: |
          git merge-base --is-ancestor 6331b2eb8bf4e1fcb015d019c11176e230af5cff HEAD
          test -f protocols/WHAKAPAPA_CAUSALITY_V2_PRECOMMIT.md
          test -f experiments/whakapapa_causality_v1.py
          test -f experiments/cross_world_nucleus_invariance_v1.py

      - name: Run frozen V2
        run: |
          python experiments/whakapapa_causality_v2.py             | tee /tmp/whakapapa-causality-v2.log

      - name: Validate scientific result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(
              Path('results/whakapapa_causality_v2/result.json').read_text()
          )

          assert p['protocol'] == 'WHAKAPAPA_CAUSALITY_V2'
          assert p['precommit_commit'] == '6331b2eb8bf4e1fcb015d019c11176e230af5cff'
          assert p['verdict'] in {
              'PASS_WHAKAPAPA_CAUSALITY_AND_BOUNDED_IRREDUCIBLE_NUCLEUS_V2',
              'PASS_WHAKAPAPA_CAUSALITY_REDUCED_NUCLEUS_V2',
              'NUCLEUS_PASS_WHAKAPAPA_NEGATIVE_V2',
              'WHAKAPAPA_PASS_NUCLEUS_PARTIAL_V2',
              'PARTIAL_WHAKAPAPA_CAUSALITY_V2',
              'VALID_NEGATIVE_WHAKAPAPA_CAUSALITY_V2',
          }
          assert set(p['headline']) == {
              'binary', 'ternary', 'symbolic', 'temporal', 'graph'
          }
          assert p['sweep']['worlds'] == 125
          assert len(p['headline_nucleus_gates']) == 9
          assert len(p['headline_whakapapa_gates']) == 10

          print('SCIENTIFIC_VERDICT=' + p['verdict'])
          print(json.dumps(p['headline_nucleus_gates'], indent=2, sort_keys=True))
          print(json.dumps(p['headline_whakapapa_gates'], indent=2, sort_keys=True))
          print(json.dumps(p['sweep'], indent=2, sort_keys=True))
          PY

      - name: Commit authoritative V2 result
        run: |
          git config user.name 'mathgraph-bot'
          git config user.email '32909488+heathsanchez@users.noreply.github.com'
          git add             results/whakapapa_causality_v2/result.json             results/whakapapa_causality_v2/sweep.json
          git commit -m 'Record whakapapa causality V2 result' || exit 0
          git push origin HEAD:experiment/whakapapa-causality-v2-admissible

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whakapapa-causality-v2-evidence
          path: |
            results/whakapapa_causality_v2/result.json
            results/whakapapa_causality_v2/sweep.json
            /tmp/whakapapa-causality-v2.log
          if-no-files-found: warn
