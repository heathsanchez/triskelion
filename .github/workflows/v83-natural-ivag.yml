name: V83 Natural IVAG QuixBugs
on:
  push:
    branches: [ v83-natural-ivag ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  natural-ivag:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verifier
        run: python -m pip install -q pytest pytest-timeout
      - name: Fetch frozen external corpus
        run: |
          git clone -q https://github.com/jkoppel/QuixBugs.git /tmp/QuixBugs
          cd /tmp/QuixBugs
          git checkout -q 4257f44b0ff1181dedaedee6a447e133219fcebf
          test "$(git rev-parse HEAD)" = "4257f44b0ff1181dedaedee6a447e133219fcebf"
      - name: Run V83
        env:
          QUIXBUGS_DIR: /tmp/QuixBugs
        run: python experiments/V83_QUIXBUGS_NATURAL_IVAG.py
      - name: Collect artifact
        run: |
          mkdir -p artifact
          cp /tmp/v83_result.json artifact/RESULT.json
      - uses: actions/upload-artifact@v4
        with:
          name: v83-natural-ivag
          path: artifact/RESULT.json
