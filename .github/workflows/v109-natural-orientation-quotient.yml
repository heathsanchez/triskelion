name: V109 Natural Orientation Quotient Induction
on:
  push:
    paths:
      - 'protocols/V109_NATURAL_ORIENTATION_QUOTIENT_INDUCTION_PRECOMMIT.md'
      - 'experiments/V109_NATURAL_ORIENTATION_QUOTIENT_INDUCTION.py'
      - '.github/workflows/v109-natural-orientation-quotient.yml'
  workflow_dispatch:
jobs:
  v109:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pytest-timeout
      - run: python experiments/V109_NATURAL_ORIENTATION_QUOTIENT_INDUCTION.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v109-natural-orientation-quotient
          path: artifacts/v109_natural_orientation_quotient/
