name: V86 Patch-Induced Constructor
on:
  push:
    branches: [v86-patch-induced-constructor]
  workflow_dispatch:
jobs:
  v86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q pytest pytest-timeout
      - name: Fetch frozen QuixBugs
        run: |
          git clone -q https://github.com/jkoppel/QuixBugs /tmp/QuixBugs
          cd /tmp/QuixBugs
          git checkout -q 4257f44b0ff1181dedaedee6a447e133219fcebf
      - name: Run V86
        run: QUIXBUGS_DIR=/tmp/QuixBugs OUT_DIR=$GITHUB_WORKSPACE/results/v86 python experiments/METALOGIC_V86_PATCH_INDUCED_CONSTRUCTOR.py
      - uses: actions/upload-artifact@v4
        with:
          name: v86-patch-induced-constructor
          path: results/v86/RESULT.json
