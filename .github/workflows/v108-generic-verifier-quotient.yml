name: V108 Generic Verifier Quotient Induction
on:
  push:
    paths:
      - 'protocols/V108_GENERIC_VERIFIER_QUOTIENT_INDUCTION_PRECOMMIT.md'
      - 'experiments/V108_GENERIC_VERIFIER_QUOTIENT_INDUCTION.py'
      - '.github/workflows/v108-generic-verifier-quotient.yml'
  workflow_dispatch:
jobs:
  v108:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pytest-timeout
      - run: python experiments/V108_GENERIC_VERIFIER_QUOTIENT_INDUCTION.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v108-generic-verifier-quotient
          path: artifacts/v108_generic_verifier_quotient/
