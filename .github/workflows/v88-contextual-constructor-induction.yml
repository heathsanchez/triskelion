name: V88 Contextual Constructor Induction
on:
  push:
    branches: [v88-contextual-constructor-induction]
  workflow_dispatch:
jobs:
  v88:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q pytest pytest-timeout
      - name: Fetch frozen QuixBugs
        run: |
          git clone -q https://github.com/jkoppel/QuixBugs /tmp/QuixBugs
          cd /tmp/QuixBugs
          git checkout -q 4257f44b0ff1181dedaedee6a447e133219fcebf
      - name: Run V88
        run: QUIXBUGS_DIR=/tmp/QuixBugs OUT_DIR=$GITHUB_WORKSPACE/results/v88 python experiments/METALOGIC_V88_CONTEXTUAL_CONSTRUCTOR_INDUCTION.py
      - uses: actions/upload-artifact@v4
        with:
          name: v88-contextual-constructor-induction
          path: results/v88/RESULT.json
