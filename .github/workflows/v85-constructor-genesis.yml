name: V85 Natural Constructor Genesis
on:
  push:
    branches: [v85-constructor-genesis]
  workflow_dispatch:
jobs:
  constructor-genesis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pytest pytest-timeout
      - name: Fetch frozen QuixBugs
        run: |
          git clone -q https://github.com/jkoppel/QuixBugs.git /tmp/QuixBugs
          cd /tmp/QuixBugs
          git checkout -q 4257f44b0ff1181dedaedee6a447e133219fcebf
      - name: Run V85
        env:
          QUIXBUGS_DIR: /tmp/QuixBugs
          V85_RESULT: /tmp/v85_result.json
        run: python experiments/V85_QUIXBUGS_CONSTRUCTOR_GENESIS.py
      - uses: actions/upload-artifact@v4
        with:
          name: v85-constructor-genesis
          path: /tmp/v85_result.json
