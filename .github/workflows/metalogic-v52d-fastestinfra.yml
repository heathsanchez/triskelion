name: Metalogic V52d Historical Bounded-Infra Ratchet
on:
  push:
    paths:
      - '.github/workflows/metalogic-v52d-fastestinfra.yml'
  workflow_dispatch:
jobs:
  v52d:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen corpus
        run: |
          python -m pip install -q uv
          git clone -q https://github.com/soarsmu/BugsInPy.git /tmp/BugsInPy
          cd /tmp/BugsInPy && git checkout -q 11c5f1eea954a42132cfd06bf257766a7963e0fd
          chmod +x /tmp/BugsInPy/framework/bin/*
      - name: Bound infrastructure only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('experiments/METALOGIC_V52_HISTORICAL_BUG_RATCHET.py')
          s=p.read_text()
          s=s.replace("rc,out=run(f'uv python install {pyver} && uv venv --python {pyver} .v52env',cwd=repo,timeout=240)","pyline='.'.join(pyver.split('.')[:2]); rc,out=run(f'uv python install {pyline} && uv venv --seed --python {pyline} .v52env',cwd=repo,timeout=60)")
          s=s.replace("return 124,(e.stdout or '')+(e.stderr or '')","\n        def _txt(x): return x.decode(errors='replace') if isinstance(x,(bytes,bytearray)) else (x or '')\n        return 124,_txt(e.stdout)+_txt(e.stderr)")
          s=s.replace("cwd=repo,timeout=300); chunks.append(o)","cwd=repo,timeout=45); chunks.append(o)")
          s=s.replace("run('bash bugsinpy_setup.sh',cwd=repo,timeout=180,env=env)","run('bash bugsinpy_setup.sh',cwd=repo,timeout=30,env=env)")
          p.write_text(s)
          PY
      - name: Historical discovery protocol
        run: python experiments/METALOGIC_V52_HISTORICAL_BUG_RATCHET.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-v52d-historical
          path: artifacts/v52/
