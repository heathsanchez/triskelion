name: V158 experiential map rescue
on:
  push:
    branches: [v158-experiential-map-rescue]
    paths:
      - 'experiments/V158_EXPERIENTIAL_MAP_RESCUE.py'
      - '.github/workflows/v158-experiential-map-rescue.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RIVER_API_KEY: ${{ secrets.RIVER_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze provenance before outcomes
        run: |
          mkdir -p artifacts/v158_experiential_map_rescue
          printf '%s\n' '${{ github.sha }}' > artifacts/v158_experiential_map_rescue/GITHUB_SHA.txt
      - name: Install
        run: python -m pip install 'river-client==0.6.1' 'protobuf>=6.31.1,<7'
      - name: Require River secret
        run: test -n "$RIVER_API_KEY"
      - name: Run experiential map rescue
        run: python experiments/V158_EXPERIENTIAL_MAP_RESCUE.py
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v158-experiential-map-rescue
          path: artifacts/v158_experiential_map_rescue/
