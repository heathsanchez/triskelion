name: V90b Protected Function Audit
on:
  push:
    branches: [v90b-protected-function-audit]
jobs:
  v90b:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pytest pytest-timeout
      - name: Fetch frozen QuixBugs
        run: |
          git clone -q https://github.com/jkoppel/QuixBugs /tmp/QuixBugs
          cd /tmp/QuixBugs
          git checkout -q 4257f44b0ff1181dedaedee6a447e133219fcebf
      - name: Run V90b
        env:
          QUIXBUGS_DIR: /tmp/QuixBugs
          OUT_DIR: results/v90b
        run: python experiments/METALOGIC_V90B_PROTECTED_FUNCTION_AUDIT.py
      - uses: actions/upload-artifact@v4
        with:
          name: v90b-protected-function-audit
          path: results/v90b/RESULT.json
