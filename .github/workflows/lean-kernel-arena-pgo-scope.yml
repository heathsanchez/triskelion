name: Lean Kernel Arena PGO scope

on:
  workflow_dispatch:
  push:
    branches: [agent/lean-kernel-arena-growth]

jobs:
  pgo-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare Arena PGO profile with representative profile
        shell: bash
        run: |
          set -euo pipefail
          SOKO_REV=0fab8874080e379a774a9a27f7538d8a1ddd786b
          ARENA_ARTIFACT=8931227426
          OUT=results/pgo-scope
          rm -rf "$OUT" soko arena-tests artifact
          mkdir -p "$OUT" arena-tests artifact
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/${ARENA_ARTIFACT}/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
          git clone https://github.com/intgrah/sokonanoda.git soko
          git -C soko checkout "$SOKO_REV"
          cat > soko/config.json <<'JSON'
          {
            "use_stdin": true,
            "nat_extension": true,
            "string_extension": true,
            "unpermitted_axiom_hard_error": false,
            "unsafe_permit_all_axioms": true,
            "num_threads": 4
          }
          JSON

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('arena-tests')
          fs=list((root/'good').rglob('*.ndjson'))+list((root/'bad').rglob('*.ndjson'))
          largest=sorted(fs,key=lambda p:p.stat().st_size,reverse=True)[:24]
          largest=sorted(largest,key=lambda p:hashlib.sha256(str(p.relative_to(root)).encode()).hexdigest())
          Path('results/pgo-scope/diverse.txt').write_text('\n'.join(str(p) for p in largest)+'\n')
          init=list(root.rglob('init-prelude.ndjson'))
          if len(init)!=1: raise SystemExit(f'expected one init-prelude, got {init}')
          Path('results/pgo-scope/arena.txt').write_text(str(init[0])+'\n')
          Path('results/pgo-scope/hybrid.txt').write_text(str(init[0])+'\n'+'\n'.join(str(p) for p in largest)+'\n')
          PY

          rustup component add llvm-tools-preview
          PROF="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-profdata"
          rm -rf soko/pgo-gen soko/profiles soko/use-arena soko/use-diverse soko/use-hybrid
          mkdir -p soko/profiles
          (cd soko && CARGO_TARGET_DIR=pgo-gen RUSTFLAGS="-C target-cpu=native -C profile-generate=$PWD/profiles" cargo build --release)

          make_profile() {
            local name=$1 list=$2 target=$3
            rm -f soko/profiles/*.profraw soko/profiles/*.profdata
            while read -r f; do soko/pgo-gen/release/sokonanoda soko/config.json < "$f" >/dev/null 2>/dev/null || true; done < "$list"
            "$PROF" merge -o "soko/profiles/${name}.profdata" soko/profiles/*.profraw
            cp "soko/profiles/${name}.profdata" "/tmp/${name}.profdata"
            (cd soko && CARGO_TARGET_DIR="$target" RUSTFLAGS="-C target-cpu=native -C profile-use=/tmp/${name}.profdata" cargo build --release)
          }
          make_profile arena "$OUT/arena.txt" use-arena
          make_profile diverse "$OUT/diverse.txt" use-diverse
          make_profile hybrid "$OUT/hybrid.txt" use-hybrid

          python3 - <<'PY'
          from pathlib import Path
          import subprocess,time,json,statistics
          root=Path.cwd(); out=root/'results/pgo-scope'
          cfg=root/'soko/config.json'
          bins={
            'arena_profile':root/'soko/use-arena/release/sokonanoda',
            'diverse_profile':root/'soko/use-diverse/release/sokonanoda',
            'hybrid_profile':root/'soko/use-hybrid/release/sokonanoda',
          }
          workload=[Path(x) for x in (out/'diverse.txt').read_text().splitlines()]
          def status(rc): return 'accept' if rc==0 else ('decline' if rc==2 else 'reject')
          cases=[]
          for kind,exp in [('good','accept'),('bad','reject')]:
            for p in (root/'arena-tests'/kind).rglob('*.ndjson'): cases.append((p,exp))
          corr={}
          for name,exe in bins.items():
            bad=[]
            for p,exp in cases:
              with p.open('rb') as f: rc=subprocess.run([str(exe),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
              if status(rc)!=exp: bad.append({'file':str(p.relative_to(root/'arena-tests')),'expected':exp,'got':status(rc),'rc':rc})
            corr[name]={'correct':len(cases)-len(bad),'total':len(cases),'failures':bad}
          samples={k:[] for k in bins}
          orders=[['arena_profile','diverse_profile','hybrid_profile'],['hybrid_profile','diverse_profile','arena_profile'],['diverse_profile','arena_profile','hybrid_profile'],['hybrid_profile','arena_profile','diverse_profile'],['diverse_profile','hybrid_profile','arena_profile'],['arena_profile','hybrid_profile','diverse_profile']]
          for order in orders:
            for name in order:
              t=time.perf_counter(); exe=bins[name]
              for p in workload:
                with p.open('rb') as f: subprocess.run([str(exe),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              samples[name].append(time.perf_counter()-t)
          med={k:statistics.median(v) for k,v in samples.items()}; a=med['arena_profile']
          summary={'correctness':corr,'median_seconds':med,'samples_seconds':samples,'speedup_vs_arena_profile':{k:a/v for k,v in med.items()},'winner':min(med,key=med.get)}
          (out/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)); print(json.dumps(summary,indent=2,sort_keys=True))
          if any(v['correct']!=v['total'] for v in corr.values()): raise SystemExit('correctness regression')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-kernel-arena-pgo-scope
          path: results/pgo-scope/
