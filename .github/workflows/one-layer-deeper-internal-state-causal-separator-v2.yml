name: One Layer Deeper Internal State Causal Separator V2

on:
  push:
    paths:
      - '.github/workflows/one-layer-deeper-internal-state-causal-separator-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2]
        arm: [flat, structure_only, true_internal, sham_internal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU torch
        run: python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run frozen leakage-free cell
        env:
          SEED: ${{ matrix.seed }}
          ARM: ${{ matrix.arm }}
        shell: bash
        run: |
          cat > /tmp/internal_state_v2.py <<'PY'
          import os, json, random, pathlib
          import torch, torch.nn as nn, torch.nn.functional as F

          seed=int(os.environ['SEED']); arm=os.environ['ARM']
          SEEDS=(0,1,2); assert seed in SEEDS
          assert arm in ('flat','structure_only','true_internal','sham_internal')
          STEPS=500; BATCH=256; D=128; MAX_TERMS=4; MAXTOK=12; VOC=512
          torch.set_num_threads(2)

          # Same oracle-product aggregation world across every arm.
          # Crucially, no arm ever receives the final/root total.
          def make_rows(split_seed,n):
              rr=random.Random(split_seed); rows=[]
              for _ in range(n):
                  k=rr.randint(1,MAX_TERMS)
                  vals=[rr.randint(0,81) for _ in range(k)]
                  total=sum(vals)
                  # Balanced-tree NON-ROOT internal states only.
                  # k=4 -> two pair sums; k=3 -> one pair sum; k<=2 -> none.
                  internal=[]
                  if k>=3: internal.append(vals[0]+vals[1])
                  if k==4: internal.append(vals[2]+vals[3])
                  rows.append({'vals':vals,'k':k,'digit':total%10,'carry':total//10,'internal':internal})
              return rows

          train=make_rows(10000+seed,20000)
          test=make_rows(20000+seed,6000)

          # Frozen sham: deterministically permute internal-state vectors among examples
          # with the SAME term count. This preserves annotation count/distribution while
          # breaking alignment with the current operands.
          def donor_map(rows, map_seed):
              out={}; rr=random.Random(map_seed)
              for k in range(1,MAX_TERMS+1):
                  ids=[i for i,r in enumerate(rows) if r['k']==k]
                  donors=ids[:]; rr.shuffle(donors)
                  if len(ids)>1 and all(a==b for a,b in zip(ids,donors)):
                      donors=donors[1:]+donors[:1]
                  for i,d in zip(ids,donors): out[i]=d
              return out
          train_donor=donor_map(train,30000+seed); test_donor=donor_map(test,40000+seed)

          PAD=0; START=1; VAL=2; ANN_SLOT=3; NULL_ANN=4; STRUCT=5
          VAL_OFF=16       # 0..81 -> 16..97
          SUM_OFF=128      # 0..162 -> 128..290
          K_OFF=300        # k 1..4

          def enc(rows, idx, donor):
              r=rows[idx]; vals=r['vals']; k=r['k']
              seq=[START, K_OFF+k]
              for v in vals: seq += [VAL, VAL_OFF+v]
              # Fixed two annotation slots for all arms: identical token budget.
              true=r['internal']
              sham=rows[donor[idx]]['internal']
              for j in range(2):
                  seq += [ANN_SLOT]
                  if arm=='flat':
                      seq += [NULL_ANN]
                  elif arm=='structure_only':
                      seq += [STRUCT if j < len(true) else NULL_ANN]
                  elif arm=='true_internal':
                      seq += [SUM_OFF+true[j] if j < len(true) else NULL_ANN]
                  else:
                      seq += [SUM_OFF+sham[j] if j < len(sham) else NULL_ANN]
              seq=seq[:MAXTOK]+[PAD]*max(0,MAXTOK-len(seq))
              return seq,r['digit'],r['carry'],k

          class M(nn.Module):
              def __init__(self):
                  super().__init__(); self.e=nn.Embedding(VOC,D,padding_idx=PAD); self.p=nn.Embedding(MAXTOK,D)
                  layer=nn.TransformerEncoderLayer(D,4,4*D,batch_first=True,norm_first=True,activation='gelu')
                  self.t=nn.TransformerEncoder(layer,2); self.ld=nn.Linear(D,10); self.lc=nn.Linear(D,40)
              def forward(self,x):
                  pos=torch.arange(x.size(1)).unsqueeze(0)
                  h=self.t(self.e(x)+self.p(pos),src_key_padding_mask=(x==PAD)); z=h[:,0]
                  return self.ld(z),self.lc(z)

          random.seed(seed); torch.manual_seed(seed)
          m=M(); opt=torch.optim.AdamW(m.parameters(),lr=3e-4,weight_decay=.01); rr=random.Random(50000+seed)
          for _ in range(STEPS):
              ids=[rr.randrange(len(train)) for _ in range(BATCH)]
              z=[enc(train,i,train_donor) for i in ids]
              x=torch.tensor([a[0] for a in z]); yd=torch.tensor([a[1] for a in z]); yc=torch.tensor([a[2] for a in z])
              od,oc=m(x); loss=F.cross_entropy(od,yd)+F.cross_entropy(oc,yc)
              opt.zero_grad(set_to_none=True); loss.backward(); nn.utils.clip_grad_norm_(m.parameters(),1.0); opt.step()

          m.eval(); by={k:[0,0] for k in range(1,5)}; joint=0
          with torch.no_grad():
              for st in range(0,len(test),512):
                  ids=list(range(st,min(st+512,len(test)))); z=[enc(test,i,test_donor) for i in ids]
                  x=torch.tensor([a[0] for a in z]); yd=torch.tensor([a[1] for a in z]); yc=torch.tensor([a[2] for a in z]); ks=[a[3] for a in z]
                  pd,pc=m(x); ok=(pd.argmax(1)==yd)&(pc.argmax(1)==yc); joint+=int(ok.sum())
                  for i,k in enumerate(ks): by[k][1]+=1; by[k][0]+=int(ok[i])
          res={'protocol':'INTERNAL_STATE_CAUSAL_SEPARATOR_V2','seed':seed,'arm':arm,'steps':STEPS,
               'joint':joint/len(test),'by_terms':{str(k):a/max(1,b) for k,(a,b) in by.items()},
               'no_root_total':True,'same_flat_products_all_arms':True,'fixed_annotation_slots':2,
               'sham':'same-k deterministic donor internal states'}
          out=pathlib.Path('results/one_layer_deeper/internal_state_causal_separator_v2/parts'); out.mkdir(parents=True,exist_ok=True)
          (out/f'{arm}_seed{seed}.json').write_text(json.dumps(res,indent=2,sort_keys=True)+'\n')
          print(json.dumps(res,indent=2,sort_keys=True))
          PY
          python /tmp/internal_state_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: v2-${{ matrix.arm }}-${{ matrix.seed }}
          path: results/one_layer_deeper/internal_state_causal_separator_v2/parts/*.json

  collect:
    needs: cell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v2-*
          path: /tmp/v2parts
          merge-multiple: true
      - name: Freeze V2 verdict
        run: |
          python - <<'PY'
          import json,pathlib,statistics
          rows=[json.loads(p.read_text()) for p in sorted(pathlib.Path('/tmp/v2parts').glob('*.json'))]
          arms={a:[r for r in rows if r['arm']==a] for a in ('flat','structure_only','true_internal','sham_internal')}
          assert all(len(v)==3 for v in arms.values()), {k:len(v) for k,v in arms.items()}
          def m4(a): return statistics.mean(r['by_terms']['4'] for r in arms[a])
          means={a:m4(a) for a in arms}
          true=means['true_internal']; control=max(means['flat'],means['structure_only'],means['sham_internal'])
          seed_hits=0; per_seed=[]
          for s in (0,1,2):
              x={a:next(r for r in arms[a] if r['seed']==s)['by_terms']['4'] for a in arms}
              gain=x['true_internal']-max(x['flat'],x['structure_only'],x['sham_internal'])
              hit=gain>=.15; seed_hits+=int(hit); per_seed.append({'seed':s,'term4':x,'true_gain_vs_best_control':gain,'hit':hit})
          if seed_hits>=2 and true-control>=.15:
              verdict='PASS_NONROOT_INTERNAL_STATE_CAUSAL_RESCUE'
          elif means['structure_only']-means['flat']>=.15:
              verdict='STRUCTURE_ONLY_RESCUE'
          else:
              verdict='NEGATIVE_NONROOT_INTERNAL_STATE_NO_REPLICATED_RESCUE'
          out={'protocol':'INTERNAL_STATE_CAUSAL_SEPARATOR_V2','threshold':.15,'required_seed_hits':2,
               'term4_mean':means,'true_gain_vs_best_control':true-control,'per_seed':per_seed,'rows':rows,'verdict':verdict,
               'claim_boundary':'bounded oracle-product aggregation micro-world; root/final total excluded from every intervention'}
          d=pathlib.Path('results/one_layer_deeper/internal_state_causal_separator_v2'); d.mkdir(parents=True,exist_ok=True)
          (d/'result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          (d/'README.md').write_text('# INTERNAL_STATE_CAUSAL_SEPARATOR_V2\n\n```json\n'+json.dumps(out,indent=2,sort_keys=True)+'\n```\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
          git config user.name 'mathgraph-bot'
          git config user.email '32909488+heathsanchez@users.noreply.github.com'
          git add results/one_layer_deeper/internal_state_causal_separator_v2
          git commit -m 'Record leakage-free internal-state causal separator V2' || exit 0
          git push
