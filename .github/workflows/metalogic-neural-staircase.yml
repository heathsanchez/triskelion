name: Metalogic River Instrumented Smoke

on:
  push:
    paths:
      - 'experiments/RIVER_INSTRUMENTED_SMOKE_V1.py'
      - '.github/workflows/metalogic-neural-staircase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  river-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RIVER_API_KEY: ${{ secrets.RIVER_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'river-client==0.6.1' 'protobuf>=6.31.1,<7' transformers

      - name: Require River secret
        run: |
          test -n "$RIVER_API_KEY"

      - name: Run instrumented River smoke
        run: python experiments/RIVER_INSTRUMENTED_SMOKE_V1.py

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: river-instrumented-smoke-v1
          path: artifacts/
          if-no-files-found: warn
