name: River Checkpoint 1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-four-arm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RIVER_API_KEY: ${{ secrets.RIVER_API_KEY }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen runtime dependencies
        run: pip install "river-client"
      - name: Runtime tests
        run: python -B -m unittest discover -s tests -v
      - name: Run frozen River protocol
        run: python -B experiments/river_checkpoint_1/run.py --out river_checkpoint_1_result
      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TRISKELION_RIVER_CHECKPOINT_1_RESULT
          path: river_checkpoint_1_result/
          if-no-files-found: error

