name: Metalogic V2 Checkpoint Diagnostic

on:
  push:
    paths:
      - 'experiments/DIAG_A_CHECKPOINT_V2.py'
      - '.github/workflows/metalogic-neural-staircase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag-a-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RIVER_API_KEY: ${{ secrets.RIVER_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install River
        run: python -m pip install 'river-client==0.6.1' 'protobuf>=6.31.1,<7'
      - name: Require River secret
        run: test -n "$RIVER_API_KEY"
      - name: Inspect saved A checkpoint output
        run: python experiments/DIAG_A_CHECKPOINT_V2.py
