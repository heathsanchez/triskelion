name: One Layer Deeper Reduction Coverage Separator V1

on:
  push:
    paths:
      - '.github/workflows/one-layer-deeper-reduction-coverage-separator-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  separator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Clone public frontier
        run: git clone --depth 1 https://github.com/benjaminW2025/one-layer-deeper.git /tmp/old
      - name: Install CPU torch
        run: python -m pip install --quiet torch numpy --index-url https://download.pytorch.org/whl/cpu
      - name: Run matched-coverage separator
        working-directory: /tmp/old
        run: |
          rm -f explorations/results/results_exp4.csv
          python explorations/exp4_subtasks.py --tasks square --bits 14 --depths 2 --widths 128 --n-train 5000 --n-eval 500 --budget-mode steps --budget 500 --batch-size 256 --device cpu
          python explorations/exp4_subtasks.py --tasks reduce --bits 7 --depths 2 --widths 128 --n-train 5000 --n-eval 500 --budget-mode steps --budget 500 --batch-size 256 --device cpu
          python explorations/exp4_subtasks.py --tasks squaremod --bits 14 --depths 2 --widths 128 --n-train 5000 --n-eval 500 --budget-mode steps --budget 500 --batch-size 256 --device cpu
      - name: Build map summary
        run: |
          mkdir -p results/one_layer_deeper/reduction_coverage_separator_v1
          cp /tmp/old/explorations/results/results_exp4.csv results/one_layer_deeper/reduction_coverage_separator_v1/results_exp4.csv
          python - <<'PY'
          import csv, pathlib
          p=pathlib.Path('results/one_layer_deeper/reduction_coverage_separator_v1/results_exp4.csv')
          rows=list(csv.DictReader(p.open()))
          out=['# REDUCTION_COVERAGE_SEPARATOR_V1','', 'Tests whether the apparent reduction wall was merely a training-coverage artifact.', '', '| task | bits | coverage | cohort | exact | chance | excess | digit | digit chance |', '|---|---:|---:|---|---:|---:|---:|---:|---:|']
          fresh={}
          for r in rows:
              exact=float(r['exact_acc']); chance=float(r['chance_exact']); digit=float(r['digit_acc']); dchance=float(r['chance_digit']); cov=float(r['x_coverage'])
              out.append(f"| {r['task']} | {r['bits']} | {cov:.3%} | {r['cohort']} | {exact:.5f} | {chance:.5f} | {exact-chance:+.5f} | {digit:.5f} | {dchance:.5f} |")
              if r['cohort']=='test_fresh': fresh[r['task']]={'exact_excess':exact-chance,'digit_excess':digit-dchance,'coverage':cov}
          out += ['', '## Separator readout','']
          for k,v in fresh.items(): out.append(f"- {k}: coverage={v['coverage']:.3%}, exact_excess={v['exact_excess']:+.5f}, digit_excess={v['digit_excess']:+.5f}")
          if 'reduce' in fresh and fresh['reduce']['digit_excess'] > 0.15:
              out += ['', '**Coverage rival survives / reduction becomes learnable at matched coverage.** The previous reduction wall was at least partly a data-support artifact; next map must hold coverage constant while increasing quotient/reduction complexity.']
          else:
              out += ['', '**Reduction wall survives matched-coverage probe.** This strengthens reduction/representation as an upstream residual rather than simple sparse-support failure.']
          out += ['', '## Claim boundary','', 'Cheap matched CPU diagnostic only. Different modulus bit-widths are intentionally used to equalize input-space coverage, so this localizes the support-vs-operation rival but is not a competition-performance comparison.']
          pathlib.Path('results/one_layer_deeper/reduction_coverage_separator_v1/README.md').write_text('\n'.join(out))
          PY
          cat results/one_layer_deeper/reduction_coverage_separator_v1/README.md
      - name: Commit map artifact
        run: |
          git config user.name 'mathgraph-bot'
          git config user.email '32909488+heathsanchez@users.noreply.github.com'
          git add results/one_layer_deeper/reduction_coverage_separator_v1
          git commit -m 'Record reduction coverage separator map' || exit 0
          git push
