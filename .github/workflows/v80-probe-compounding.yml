name: V80 External O1 to O2 Compounding

on:
  push:
    branches: [v80-probe-compounding]
  workflow_dispatch:

jobs:
  probe-compounding:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -q numpy mpmath
      - name: Run V80
        run: python experiments/V80_PROBE_TO_SURROGATE_COMPOUNDING.py
      - name: Collect artifact
        run: |
          mkdir -p artifact
          cp /tmp/v80_result.json artifact/RESULT.json
      - uses: actions/upload-artifact@v4
        with:
          name: v80-probe-compounding
          path: artifact/RESULT.json
