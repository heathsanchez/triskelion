name: Metalogic Protected Consolidation V7
on:
  push:
    paths:
      - 'experiments/METALOGIC_PROTECTED_CONSOLIDATION_V7.py'
      - '.github/workflows/metalogic-protected-consolidation-v7.yml'
  workflow_dispatch:
jobs:
  protected-consolidation-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RIVER_API_KEY: ${{ secrets.RIVER_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: python -m pip install 'river-client==0.6.1' 'protobuf>=6.31.1,<7' transformers
      - name: Require River secret
        run: test -n "$RIVER_API_KEY"
      - name: Run protected consolidation V7
        run: python experiments/METALOGIC_PROTECTED_CONSOLIDATION_V7.py
      - name: Upload scientific artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-protected-consolidation-v7
          path: artifacts/protected_consolidation_v7/
