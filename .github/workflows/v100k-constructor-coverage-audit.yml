name: V100K Constructor Coverage Audit NONCLAIM
on:
  push:
    branches: [v100k-constructor-coverage-audit]
jobs:
  v100k:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch frozen QuixBugs
        run: |
          git clone -q https://github.com/jkoppel/QuixBugs /tmp/QuixBugs
          cd /tmp/QuixBugs
          git checkout -q 4257f44b0ff1181dedaedee6a447e133219fcebf
      - name: Run V100K
        run: QUIXBUGS_DIR=/tmp/QuixBugs OUT_DIR=results/v100k python experiments/METALOGIC_V100K_CONSTRUCTOR_COVERAGE_AUDIT.py
      - uses: actions/upload-artifact@v4
        with:
          name: v100k-constructor-coverage-audit-nonclaim
          path: results/v100k/RESULT.json
