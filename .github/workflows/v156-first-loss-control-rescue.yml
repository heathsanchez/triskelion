name: V156 first-loss control rescue
on:
  push:
    branches: [v156-first-loss-control-rescue]
    paths:
      - 'experiments/V156_FIRST_LOSS_CONTROL_RESCUE.py'
      - '.github/workflows/v156-first-loss-control-rescue.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RIVER_API_KEY: ${{ secrets.RIVER_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze provenance before outcomes
        run: |
          mkdir -p artifacts/v156_first_loss_control_rescue
          printf '%s\n' '${{ github.sha }}' > artifacts/v156_first_loss_control_rescue/GITHUB_SHA.txt
      - name: Install
        run: python -m pip install 'river-client==0.6.1' 'protobuf>=6.31.1,<7'
      - name: Require River secret
        run: test -n "$RIVER_API_KEY"
      - name: Run rescue
        run: python experiments/V156_FIRST_LOSS_CONTROL_RESCUE.py
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v156-first-loss-control-rescue
          path: artifacts/v156_first_loss_control_rescue/
