name: Lean Kernel Arena thread search

on:
  push:
    branches: [agent/lean-kernel-arena-thread-search]
  workflow_dispatch:

jobs:
  thread-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Sweep checker thread count
        shell: bash
        run: |
          set -euo pipefail
          SOKO_REV=0fab8874080e379a774a9a27f7538d8a1ddd786b
          ARENA_ARTIFACT=8931227426
          OUT=results/thread-search
          rm -rf "$OUT" soko arena-tests artifact tests.zip
          mkdir -p "$OUT" arena-tests artifact

          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/${ARENA_ARTIFACT}/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
          git clone https://github.com/intgrah/sokonanoda.git soko
          git -C soko checkout "$SOKO_REV"
          (cd soko && RUSTFLAGS='-C target-cpu=native' cargo build --release)

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('arena-tests')
          fs=list((root/'good').rglob('*.ndjson'))+list((root/'bad').rglob('*.ndjson'))
          largest=sorted(fs,key=lambda p:p.stat().st_size,reverse=True)[:24]
          largest=sorted(largest,key=lambda p:hashlib.sha256(str(p.relative_to(root)).encode()).hexdigest())
          Path('results/thread-search/workload.txt').write_text('\n'.join(str(p) for p in largest)+'\n')
          Path('results/thread-search/runner.json').write_text(json.dumps({'cpu_count':__import__('os').cpu_count()},indent=2))
          PY

          python3 - <<'PY'
          from pathlib import Path
          import subprocess,time,json,statistics,random,os
          root=Path.cwd(); out=root/'results/thread-search'; exe=root/'soko/target/release/sokonanoda'
          workload=[Path(x) for x in (out/'workload.txt').read_text().splitlines()]
          variants=[1,2,3,4,5,6,8]
          def cfg(n):
              p=out/f'config-{n}.json'
              p.write_text(json.dumps({
                  'use_stdin':True,'nat_extension':True,'string_extension':True,
                  'unpermitted_axiom_hard_error':False,'unsafe_permit_all_axioms':True,
                  'num_threads':n},indent=2))
              return p
          cfgs={n:cfg(n) for n in variants}
          def status(rc): return 'accept' if rc==0 else ('decline' if rc==2 else 'reject')
          cases=[]
          for kind,exp in [('good','accept'),('bad','reject')]:
              for p in (root/'arena-tests'/kind).rglob('*.ndjson'): cases.append((p,exp))
          correctness={}
          for n in variants:
              bad=[]
              for p,exp in cases:
                  with p.open('rb') as f:
                      rc=subprocess.run([str(exe),str(cfgs[n])],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
                  if status(rc)!=exp: bad.append({'file':str(p.relative_to(root/'arena-tests')),'expected':exp,'got':status(rc),'rc':rc})
              correctness[str(n)]={'correct':len(cases)-len(bad),'total':len(cases),'failures':bad}
          samples={str(n):[] for n in variants}
          for seed in range(10):
              order=variants.copy(); random.Random(seed).shuffle(order)
              for n in order:
                  t=time.perf_counter()
                  for p in workload:
                      with p.open('rb') as f:
                          subprocess.run([str(exe),str(cfgs[n])],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,check=False)
                  samples[str(n)].append(time.perf_counter()-t)
          med={n:statistics.median(v) for n,v in samples.items()}
          base=med['4']; winner=min(med,key=med.get)
          summary={'cpu_count':os.cpu_count(),'correctness':correctness,'samples_seconds':samples,'median_seconds':med,
                   'speedup_vs_threads4':{n:base/v for n,v in med.items()},'winner':winner,
                   'winner_speedup_vs_threads4':base/med[winner]}
          (out/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)); print(json.dumps(summary,indent=2,sort_keys=True))
          if any(v['correct']!=v['total'] for v in correctness.values()): raise SystemExit('correctness regression')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-kernel-arena-thread-search
          path: results/thread-search/
