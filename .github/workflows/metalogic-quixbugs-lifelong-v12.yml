name: Metalogic QuixBugs Lifelong V12
on:
  push:
    paths:
      - '.github/workflows/metalogic-quixbugs-lifelong-v12.yml'
      - 'experiments/METALOGIC_QUIXBUGS_LIFELONG_V12.py'
  workflow_dispatch:
jobs:
  quixbugs-v12:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RIVER_API_KEY: ${{ secrets.RIVER_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: python -m pip install 'river-client==0.6.1' 'protobuf>=6.31.1,<7' transformers
      - name: Require River secret
        run: test -n "$RIVER_API_KEY"
      - name: Run external coding accumulation V12
        run: python experiments/METALOGIC_QUIXBUGS_LIFELONG_V12.py
      - name: Upload scientific artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-quixbugs-lifelong-v12
          path: artifacts/quixbugs_lifelong_v12/
