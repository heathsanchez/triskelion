name: Autogenous Developmental Language V1

on:
  push:
    branches:
      - experiment/autogenous-developmental-language-v1
    paths:
      - 'experiments/autogenous_developmental_language_v1.py'
      - 'protocols/AUTOGENOUS_DEVELOPMENTAL_LANGUAGE_V1_PRECOMMIT.md'
      - '.github/workflows/autogenous-developmental-language-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autogenous-developmental-language-v1
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/autogenous-developmental-language-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify prospective freeze ancestry
        run: |
          git merge-base --is-ancestor 6976c3d4a5aa43e9420a43a533374435abc754e1 HEAD
          test -f protocols/AUTOGENOUS_DEVELOPMENTAL_LANGUAGE_V1_PRECOMMIT.md
          test -f experiments/autogenous_developmental_language_v1.py
      - name: Run capstone
        run: |
          set -o pipefail
          PYTHONPATH=. python experiments/autogenous_developmental_language_v1.py | tee /tmp/autogenous-developmental-language-v1.log
      - name: Validate result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('results/autogenous_developmental_language_v1/result.json').read_text())
          assert p['protocol']=='AUTOGENOUS_DEVELOPMENTAL_LANGUAGE_V1'
          assert p['precommit_commit']=='6976c3d4a5aa43e9420a43a533374435abc754e1'
          assert p['episodes']==12000
          assert len(p['gates'])==24
          assert p['verdict'] in {'PASS_AUTOGENOUS_DEVELOPMENTAL_LANGUAGE_V1','PARTIAL_AUTOGENOUS_DEVELOPMENTAL_LANGUAGE_V1','VALID_NEGATIVE_AUTOGENOUS_DEVELOPMENTAL_LANGUAGE_V1'}
          print('SCIENTIFIC_VERDICT='+p['verdict'])
          print(json.dumps(p['costs'],indent=2,sort_keys=True))
          print(json.dumps(p['metrics'],indent=2,sort_keys=True))
          print(json.dumps(p['revocation'],indent=2,sort_keys=True))
          print(json.dumps(p['gates'],indent=2,sort_keys=True))
          PY
      - name: Commit authoritative result
        run: |
          git config user.name 'mathgraph-bot'
          git config user.email '32909488+heathsanchez@users.noreply.github.com'
          git add results/autogenous_developmental_language_v1/result.json results/autogenous_developmental_language_v1/summary.json
          git commit -m 'Record autogenous developmental language V1 result' || exit 0
          git push origin HEAD:experiment/autogenous-developmental-language-v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autogenous-developmental-language-v1-evidence
          path: |
            results/autogenous_developmental_language_v1/result.json
            results/autogenous_developmental_language_v1/summary.json
            /tmp/autogenous-developmental-language-v1.log
          if-no-files-found: warn
