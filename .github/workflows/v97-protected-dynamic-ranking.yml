name: V97 Protected Dynamic Ranking
on:
  push:
    branches: [v97-protected-dynamic-ranking]
jobs:
  v97:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pytest pytest-timeout
      - name: Fetch frozen QuixBugs
        run: |
          git clone -q https://github.com/jkoppel/QuixBugs.git /tmp/QuixBugs
          cd /tmp/QuixBugs
          git checkout -q 4257f44b0ff1181dedaedee6a447e133219fcebf
      - name: Run V97
        env:
          QUIXBUGS_DIR: /tmp/QuixBugs
          OUT_DIR: results/v97
        run: python experiments/METALOGIC_V97_PROTECTED_DYNAMIC_RANKING.py
      - uses: actions/upload-artifact@v4
        with:
          name: v97-protected-dynamic-ranking
          path: results/v97/RESULT.json
