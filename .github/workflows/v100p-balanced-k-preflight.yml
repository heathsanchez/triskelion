name: V100P Balanced-K Preflight NONCLAIM
on:
  push:
    branches: [v100p-balanced-k-preflight]
jobs:
  v100p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pytest pytest-timeout
      - name: Fetch frozen QuixBugs
        run: |
          git clone -q https://github.com/jkoppel/QuixBugs /tmp/QuixBugs
          cd /tmp/QuixBugs
          git checkout -q 4257f44b0ff1181dedaedee6a447e133219fcebf
      - name: Run NONCLAIM V100P
        run: QUIXBUGS_DIR=/tmp/QuixBugs OUT_DIR=results/v100p python experiments/METALOGIC_V100P_BALANCED_K_PREFLIGHT.py
      - uses: actions/upload-artifact@v4
        with:
          name: v100p-balanced-k-preflight-nonclaim
          path: results/v100p/RESULT.json
