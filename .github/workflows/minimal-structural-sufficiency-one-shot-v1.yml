name: Minimal Structural Sufficiency One-Shot V1

on:
  push:
    branches:
      - experiment/minimal-structural-sufficiency-one-shot-v1
    paths:
      - 'experiments/minimal_structural_sufficiency_one_shot_v1.py'
      - 'protocols/MINIMAL_STRUCTURAL_SUFFICIENCY_ONE_SHOT_V1_PRECOMMIT.md'
      - '.github/workflows/minimal-structural-sufficiency-one-shot-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  one-shot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/minimal-structural-sufficiency-one-shot-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify prospective freeze and inputs
        run: |
          git merge-base --is-ancestor 932d475629fe85d2b1841a33972cea3bf7e988b1 HEAD
          test -f results/ternary_developmental_nucleus_census_v1/result.json

      - name: Run minimal structural sufficiency one-shot
        run: |
          set -o pipefail
          python experiments/minimal_structural_sufficiency_one_shot_v1.py \
            results/ternary_developmental_nucleus_census_v1/result.json \
            results/minimal_structural_sufficiency_one_shot_v1 \
            | tee /tmp/minimal-structural-sufficiency-one-shot-v1.log

      - name: Validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('results/minimal_structural_sufficiency_one_shot_v1/result.json').read_text())
          assert p['protocol']=='MINIMAL_STRUCTURAL_SUFFICIENCY_ONE_SHOT_V1'
          assert p['precommit_commit']=='932d475629fe85d2b1841a33972cea3bf7e988b1'
          assert p['audit']['total']==256
          assert len(p['representations'])==6
          assert len(p['headline_gates'])==16
          print('SCIENTIFIC_VERDICT='+p['verdict'])
          print('STRENGTH='+p['strength'])
          print('SUFFICIENT='+','.join(p['sufficient_views']))
          print('MINIMAL='+','.join(p['minimal_sufficient_views']))
          print(json.dumps({
            'representations':p['representations'],
            'audit':p['audit'],
            'gates':p['headline_gates'],
          },indent=2,sort_keys=True))
          PY

      - name: Commit authoritative result
        run: |
          git config user.name mathgraph-bot
          git config user.email 32909488+heathsanchez@users.noreply.github.com
          git add results/minimal_structural_sufficiency_one_shot_v1
          git commit -m 'Record minimal structural sufficiency one-shot V1 result' || exit 0
          git push origin HEAD:experiment/minimal-structural-sufficiency-one-shot-v1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimal-structural-sufficiency-one-shot-v1-evidence
          path: |
            results/minimal_structural_sufficiency_one_shot_v1
            /tmp/minimal-structural-sufficiency-one-shot-v1.log
          if-no-files-found: warn
