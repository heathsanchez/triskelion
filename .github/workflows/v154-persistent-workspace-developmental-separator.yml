name: V154 persistent-workspace developmental separator

on:
  push:
    branches: ["v154-persistent-workspace-developmental-separator"]
    paths:
      - 'protocols/V154_PERSISTENT_WORKSPACE_DEVELOPMENTAL_SEPARATOR_PRECOMMIT.md'
      - 'cp3/v154_persistent_workspace_developmental_separator.py'
      - '.github/workflows/v154-persistent-workspace-developmental-separator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  separator:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      RIVER_API_KEY: ${{ secrets.RIVER_API_KEY }}
      PYTHONDONTWRITEBYTECODE: "1"
      V145_TEMPLATE_ROOT: /tmp/v154_precompiled_templates
    steps:
      - uses: actions/checkout@v6

      - name: Freeze provenance before outcomes
        run: |
          python -m py_compile cp3/v154_persistent_workspace_developmental_separator.py
          sha256sum protocols/V154_PERSISTENT_WORKSPACE_DEVELOPMENTAL_SEPARATOR_PRECOMMIT.md cp3/v154_persistent_workspace_developmental_separator.py

      - name: Clone official BugsInPy
        run: git clone --depth 1 https://github.com/soarsmu/BugsInPy.git BugsInPy

      - name: Pull exact historical runtimes
        run: |
          docker pull 'python:3.7.3@sha256:9e0b4f32487ca1863b45383420b8db77990debae748e2e875d2f86fa9510d4a5'
          docker pull 'python:3.7.4@sha256:fc0a398e1987fb1e58909053c11630e06adb3df265fe693391779020b9253f5e'

      - name: Install frozen provider dependency
        run: python -m pip install --quiet 'river-client==0.6.1'

      - name: Run V154 persistent-workspace separator
        run: |
          mkdir -p artifacts
          PYTHONPATH="$PWD/cp3:$PWD/cp3/vendor/cp1" python -B cp3/v154_persistent_workspace_developmental_separator.py \
            --bugsinpy "$PWD/BugsInPy" \
            --out "$PWD/artifacts/v154"

      - name: Show V154 verdict
        if: always()
        run: |
          if [ -f artifacts/v154/V154_RESULT.json ]; then
            python - <<'PY'
          import json
          r=json.load(open('artifacts/v154/V154_RESULT.json'))
          print('V154 VERDICT',r.get('verdict'))
          print('COMPILED',r.get('compiled_o1_advantage'),'RAW',r.get('raw_t1_advantage'))
          print(json.dumps(r.get('summary'),indent=2,sort_keys=True))
          print(json.dumps(r.get('persistent_state_audit'),indent=2,sort_keys=True))
          PY
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v154-persistent-workspace-developmental-separator
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
