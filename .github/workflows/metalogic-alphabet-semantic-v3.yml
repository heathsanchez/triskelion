name: Metalogic Alphabet Semantic V3
on:
  push:
    paths:
      - '.github/workflows/metalogic-alphabet-semantic-v3.yml'
      - 'experiments/METALOGIC_ALPHABET_SEMANTIC_V3.py'
      - 'experiments/METALOGIC_ALPHABET_FALSIFICATION_V2.py'
  workflow_dispatch:
jobs:
  alphabet-semantic-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      RIVER_API_KEY: ${{ secrets.RIVER_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: python -m pip install 'river-client==0.6.1' 'protobuf>=6.31.1,<7' 'scikit-learn==1.7.1' 'numpy>=2,<3'
      - name: Require River secret
        run: test -n "$RIVER_API_KEY"
      - name: Run semantic alphabet test
        run: python experiments/METALOGIC_ALPHABET_SEMANTIC_V3.py
      - name: Upload scientific artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-alphabet-semantic-v3
          path: artifacts/alphabet_semantic_v3/
