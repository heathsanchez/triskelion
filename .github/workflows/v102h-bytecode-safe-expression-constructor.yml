name: V102H Bytecode-Safe Expression Constructor
on:
  push:
    branches: [v102h-bytecode-safe-expression-constructor]
jobs:
  v102h:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pytest pytest-timeout
      - name: Fetch frozen QuixBugs
        run: |
          git clone -q https://github.com/jkoppel/QuixBugs.git /tmp/QuixBugs
          cd /tmp/QuixBugs && git checkout -q 4257f44b0ff1181dedaedee6a447e133219fcebf
      - name: Run V102H
        env:
          QUIXBUGS_ROOT: /tmp/QuixBugs
          OUT_DIR: results/v102h
        run: python experiments/METALOGIC_V102H_BYTECODE_SAFE_EXPRESSION_CONSTRUCTOR.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v102h-bytecode-safe-expression-constructor
          path: results/v102h
