name: Metalogic V52e Historical Coverage Ratchet
on:
  push:
    paths:
      - '.github/workflows/metalogic-v52e-coverage.yml'
      - 'experiments/METALOGIC_V52E_HISTORICAL_COVERAGE_RATCHET.py'
  workflow_dispatch:
jobs:
  v52e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze BugsInPy corpus
        run: |
          python -m pip install -q uv
          git clone -q https://github.com/soarsmu/BugsInPy.git /tmp/BugsInPy
          cd /tmp/BugsInPy && git checkout -q 11c5f1eea954a42132cfd06bf257766a7963e0fd
          chmod +x /tmp/BugsInPy/framework/bin/*
      - name: Run V52e historical coverage ratchet
        run: python experiments/METALOGIC_V52E_HISTORICAL_COVERAGE_RATCHET.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-v52e-historical-coverage
          path: artifacts/v52e/
