name: V83P Natural IVAG Preflight
on:
  push:
    branches: [ v83p-natural-preflight ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest pytest-timeout
      - name: Fetch frozen QuixBugs
        run: |
          git clone -q https://github.com/jkoppel/QuixBugs.git /tmp/QuixBugs
          cd /tmp/QuixBugs && git checkout -q 4257f44b0ff1181dedaedee6a447e133219fcebf
      - name: Shrink exploratory prefix only
        run: |
          sed -i 's/STREAM_N=12/STREAM_N=4/' experiments/V83_QUIXBUGS_NATURAL_IVAG.py
          sed -i 's/PROBE_N=10/PROBE_N=4/' experiments/V83_QUIXBUGS_NATURAL_IVAG.py
      - name: Run exploratory preflight
        env:
          QUIXBUGS_DIR: /tmp/QuixBugs
          V83_RESULT: /tmp/v83p_result.json
        run: python experiments/V83_QUIXBUGS_NATURAL_IVAG.py
      - uses: actions/upload-artifact@v4
        with:
          name: v83p-natural-preflight-nonclaim
          path: /tmp/v83p_result.json
