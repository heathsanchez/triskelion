name: One Layer Deeper Internal State Learning V1

on:
  push:
    paths:
      - '.github/workflows/one-layer-deeper-internal-state-learning-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seed: [0,1,2]
        arm: [baseline, true_aux, sham_aux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU torch
        run: python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run frozen learning cell
        env:
          SEED: ${{ matrix.seed }}
          ARM: ${{ matrix.arm }}
        shell: bash
        run: |
          cat > /tmp/internal_learning.py <<'PY'
          import os,json,random,pathlib
          import torch, torch.nn as nn, torch.nn.functional as F
          seed=int(os.environ['SEED']); arm=os.environ['ARM']; assert arm in ('baseline','true_aux','sham_aux')
          random.seed(seed); torch.manual_seed(seed); torch.set_num_threads(2)
          STEPS=500; BATCH=256; D=128; MAX_TERMS=4; MAXTOK=6

          # Same flat oracle-product input at TRAIN AND INFERENCE for all arms.
          # Auxiliary supervision may shape hidden state during training only.
          def make_rows(s,n):
              rr=random.Random(s); rows=[]
              for _ in range(n):
                  k=rr.randint(1,4); vals=[rr.randint(0,81) for _ in range(k)]; total=sum(vals)
                  aux=[-1,-1]
                  if k>=3: aux[0]=vals[0]+vals[1]
                  if k==4: aux[1]=vals[2]+vals[3]
                  rows.append({'vals':vals,'k':k,'digit':total%10,'carry':total//10,'aux':aux})
              return rows
          train=make_rows(5000+seed,20000); test=make_rows(6000+seed,6000)

          # Same-k deterministic donor labels for sham auxiliary supervision.
          donor={}; rr=random.Random(7000+seed)
          for k in range(1,5):
              ids=[i for i,r in enumerate(train) if r['k']==k]; ds=ids[:]; rr.shuffle(ds)
              if len(ids)>1 and all(i==d for i,d in zip(ids,ds)): ds=ds[1:]+ds[:1]
              for i,d in zip(ids,ds): donor[i]=d

          PAD=0; START=1; VOFF=8; KOFF=100; VOC=128; AUXCLS=2
          def enc(r):
              seq=[START,KOFF+r['k']]+[VOFF+v for v in r['vals']]
              seq=seq[:MAXTOK]+[PAD]*max(0,MAXTOK-len(seq)); return seq

          class M(nn.Module):
              def __init__(self):
                  super().__init__(); self.e=nn.Embedding(VOC,D,padding_idx=PAD); self.p=nn.Embedding(MAXTOK,D)
                  layer=nn.TransformerEncoderLayer(D,4,4*D,batch_first=True,norm_first=True,activation='gelu')
                  self.t=nn.TransformerEncoder(layer,2); self.ld=nn.Linear(D,10); self.lc=nn.Linear(D,40)
                  self.a1=nn.Linear(D,163); self.a2=nn.Linear(D,163)
              def forward(self,x):
                  pos=torch.arange(x.size(1)).unsqueeze(0); h=self.t(self.e(x)+self.p(pos),src_key_padding_mask=(x==PAD)); z=h[:,0]
                  return self.ld(z),self.lc(z),self.a1(z),self.a2(z)
          m=M(); opt=torch.optim.AdamW(m.parameters(),lr=3e-4,weight_decay=.01); rng=random.Random(8000+seed)
          for _ in range(STEPS):
              ids=[rng.randrange(len(train)) for _ in range(BATCH)]; rs=[train[i] for i in ids]
              x=torch.tensor([enc(r) for r in rs]); yd=torch.tensor([r['digit'] for r in rs]); yc=torch.tensor([r['carry'] for r in rs])
              od,oc,a1,a2=m(x); loss=F.cross_entropy(od,yd)+F.cross_entropy(oc,yc)
              if arm!='baseline':
                  labs=[]
                  for i,r in zip(ids,rs): labs.append(r['aux'] if arm=='true_aux' else train[donor[i]]['aux'])
                  l1=torch.tensor([a[0] for a in labs]); l2=torch.tensor([a[1] for a in labs]); mask1=l1>=0; mask2=l2>=0
                  if mask1.any(): loss=loss+0.5*F.cross_entropy(a1[mask1],l1[mask1])
                  if mask2.any(): loss=loss+0.5*F.cross_entropy(a2[mask2],l2[mask2])
              opt.zero_grad(set_to_none=True); loss.backward(); nn.utils.clip_grad_norm_(m.parameters(),1.0); opt.step()

          m.eval(); by={k:[0,0] for k in range(1,5)}; joint=0
          with torch.no_grad():
              for st in range(0,len(test),512):
                  rs=test[st:st+512]; x=torch.tensor([enc(r) for r in rs]); yd=torch.tensor([r['digit'] for r in rs]); yc=torch.tensor([r['carry'] for r in rs])
                  od,oc,_,_=m(x); ok=(od.argmax(1)==yd)&(oc.argmax(1)==yc); joint+=int(ok.sum())
                  for i,r in enumerate(rs): by[r['k']][1]+=1; by[r['k']][0]+=int(ok[i])
          res={'protocol':'INTERNAL_STATE_LEARNING_V1','seed':seed,'arm':arm,'steps':STEPS,'joint':joint/len(test),
               'by_terms':{str(k):a/max(1,b) for k,(a,b) in by.items()},
               'inference_input':'identical flat oracle products for all arms','auxiliary_weight':0.5}
          out=pathlib.Path('results/one_layer_deeper/internal_state_learning_v1/parts'); out.mkdir(parents=True,exist_ok=True)
          (out/f'{arm}_seed{seed}.json').write_text(json.dumps(res,indent=2,sort_keys=True)+'\n'); print(json.dumps(res,indent=2))
          PY
          python /tmp/internal_learning.py
      - uses: actions/upload-artifact@v4
        with:
          name: learn-${{ matrix.arm }}-${{ matrix.seed }}
          path: results/one_layer_deeper/internal_state_learning_v1/parts/*.json

  collect:
    needs: cell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: learn-*
          path: /tmp/learn
          merge-multiple: true
      - name: Freeze learning verdict
        run: |
          python - <<'PY'
          import json,pathlib,statistics
          rows=[json.loads(p.read_text()) for p in sorted(pathlib.Path('/tmp/learn').glob('*.json'))]
          arms={a:[r for r in rows if r['arm']==a] for a in ('baseline','true_aux','sham_aux')}; assert all(len(v)==3 for v in arms.values())
          means={a:statistics.mean(r['by_terms']['4'] for r in arms[a]) for a in arms}
          gain=means['true_aux']-max(means['baseline'],means['sham_aux']); hits=0; per=[]
          for s in (0,1,2):
              x={a:next(r for r in arms[a] if r['seed']==s)['by_terms']['4'] for a in arms}; g=x['true_aux']-max(x['baseline'],x['sham_aux']); h=g>=.15; hits+=int(h); per.append({'seed':s,'term4':x,'true_gain_vs_best_control':g,'hit':h})
          verdict='PASS_INTERNAL_STATE_LEARNING_RESCUE' if gain>=.15 and hits>=2 else 'NEGATIVE_INTERNAL_STATE_LEARNING_NO_REPLICATED_RESCUE'
          out={'protocol':'INTERNAL_STATE_LEARNING_V1','threshold':.15,'required_seed_hits':2,'term4_mean':means,'true_gain_vs_best_control':gain,'per_seed':per,'rows':rows,'verdict':verdict,
               'claim_boundary':'bounded oracle-product aggregation micro-world; no intermediate state is provided at inference'}
          d=pathlib.Path('results/one_layer_deeper/internal_state_learning_v1'); d.mkdir(parents=True,exist_ok=True); (d/'result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,indent=2))
          PY
          git config user.name 'mathgraph-bot'; git config user.email '32909488+heathsanchez@users.noreply.github.com'
          git add results/one_layer_deeper/internal_state_learning_v1
          git commit -m 'Record internal-state learning causal test V1' || exit 0
          git push
