name: Metalogic Alphabet Falsification V2
on:
  push:
    paths:
      - '.github/workflows/metalogic-alphabet-falsification-v2.yml'
      - 'experiments/METALOGIC_ALPHABET_FALSIFICATION_V2.py'
      - 'experiments/METALOGIC_MULTISCALE_MOTIF_DISCOVERY_V70.py'
      - 'experiments/METALOGIC_SCALE_HOLDOUT_GRAMMAR_V71.py'
      - 'experiments/METALOGIC_MDL_MOTIF_BASIS_V72.py'
  workflow_dispatch:
jobs:
  alphabet-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: python -m pip install 'scikit-learn==1.7.1' 'numpy>=2,<3'
      - name: Run alphabet falsification
        run: python experiments/METALOGIC_ALPHABET_FALSIFICATION_V2.py
      - name: Upload scientific artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-alphabet-falsification-v2
          path: artifacts/alphabet_falsification_v2/
  multiscale-motif-v70:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V70 motif discovery
        run: python experiments/METALOGIC_MULTISCALE_MOTIF_DISCOVERY_V70.py
      - name: Upload V70 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-multiscale-motif-v70
          path: artifacts/multiscale_motif_discovery_v70/
  scale-holdout-v71:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V71 whole-scale transfer
        run: python experiments/METALOGIC_SCALE_HOLDOUT_GRAMMAR_V71.py
      - name: Upload V71 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-scale-holdout-v71
          path: artifacts/scale_holdout_grammar_v71/
  mdl-motif-v72:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V72 MDL motif basis
        run: python experiments/METALOGIC_MDL_MOTIF_BASIS_V72.py
      - name: Upload V72 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-mdl-motif-v72
          path: artifacts/mdl_motif_basis_v72/
