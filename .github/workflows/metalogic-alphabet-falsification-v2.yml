name: Metalogic Alphabet Falsification V2
on:
  push:
    paths:
      - '.github/workflows/metalogic-alphabet-falsification-v2.yml'
      - 'experiments/METALOGIC_ALPHABET_FALSIFICATION_V2.py'
      - 'experiments/METALOGIC_MULTISCALE_MOTIF_DISCOVERY_V70.py'
      - 'experiments/METALOGIC_SCALE_HOLDOUT_GRAMMAR_V71.py'
      - 'experiments/METALOGIC_MDL_MOTIF_BASIS_V72.py'
      - 'experiments/METALOGIC_HIERARCHICAL_MOTIF_REIFICATION_V73.py'
      - 'experiments/METALOGIC_MATH_GRAMMAR_TRANSFER_V74.py'
      - 'experiments/METALOGIC_EXECUTABLE_MATH_CONTROL_V75.py'
      - 'experiments/METALOGIC_EXECUTABLE_MATH_CONTROL_V75_FAST.py'
  workflow_dispatch:
jobs:
  alphabet-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: python -m pip install 'scikit-learn==1.7.1' 'numpy>=2,<3'
      - name: Run alphabet falsification
        run: python experiments/METALOGIC_ALPHABET_FALSIFICATION_V2.py
      - name: Upload scientific artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-alphabet-falsification-v2
          path: artifacts/alphabet_falsification_v2/
  multiscale-motif-v70:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V70 motif discovery
        run: python experiments/METALOGIC_MULTISCALE_MOTIF_DISCOVERY_V70.py
      - name: Upload V70 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-multiscale-motif-v70
          path: artifacts/multiscale_motif_discovery_v70/
  scale-holdout-v71:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V71 whole-scale transfer
        run: python experiments/METALOGIC_SCALE_HOLDOUT_GRAMMAR_V71.py
      - name: Upload V71 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-scale-holdout-v71
          path: artifacts/scale_holdout_grammar_v71/
  mdl-motif-v72:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V72 MDL motif basis
        run: python experiments/METALOGIC_MDL_MOTIF_BASIS_V72.py
      - name: Upload V72 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-mdl-motif-v72
          path: artifacts/mdl_motif_basis_v72/
  hierarchical-motif-v73:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V73 hierarchical motif reification
        run: python experiments/METALOGIC_HIERARCHICAL_MOTIF_REIFICATION_V73.py
      - name: Upload V73 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-hierarchical-motif-v73
          path: artifacts/hierarchical_motif_reification_v73/
  math-grammar-v74:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V74 held-out mathematical grammar transfer
        run: python experiments/METALOGIC_MATH_GRAMMAR_TRANSFER_V74.py
      - name: Upload V74 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-math-grammar-v74
          path: artifacts/math_grammar_transfer_v74/
  executable-math-v75:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V75 executable math control
        run: python experiments/METALOGIC_EXECUTABLE_MATH_CONTROL_V75_FAST.py
      - name: Upload V75 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-executable-math-v75
          path: artifacts/executable_math_control_v75/
