name: Metalogic A Calibration V3
on:
  push:
    paths:
      - 'experiments/CALIBRATE_A_V3.py'
      - '.github/workflows/metalogic-a-calibration-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibrate-a:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RIVER_API_KEY: ${{ secrets.RIVER_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install 'river-client==0.6.1' 'protobuf>=6.31.1,<7' transformers
      - name: Require River secret
        run: test -n "$RIVER_API_KEY"
      - name: Calibrate A
        run: python experiments/CALIBRATE_A_V3.py
