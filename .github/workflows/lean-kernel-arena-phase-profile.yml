name: Lean Kernel Arena phase profile

on:
  push:
    branches: [agent/lean-kernel-arena-phase-profile]
  workflow_dispatch:

jobs:
  phase-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Instrument parse and check phases
        shell: bash
        run: |
          set -euo pipefail
          SOKO_REV=0fab8874080e379a774a9a27f7538d8a1ddd786b
          ARENA_ARTIFACT=8931227426
          OUT=results/phase-profile
          rm -rf "$OUT" soko arena-tests artifact tests.zip
          mkdir -p "$OUT" arena-tests artifact
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/${ARENA_ARTIFACT}/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
          git clone https://github.com/intgrah/sokonanoda.git soko
          git -C soko checkout "$SOKO_REV"
          cat > soko/config.json <<'JSON'
          {
            "use_stdin": true,
            "nat_extension": true,
            "string_extension": true,
            "unpermitted_axiom_hard_error": false,
            "unsafe_permit_all_axioms": true,
            "num_threads": 4
          }
          JSON

          python3 - <<'PY'
          from pathlib import Path
          p=Path('soko/src/main.rs'); s=p.read_text()
          old='''    let global_arena = Arena::new();\n    let (export_file, skipped_axioms) = cfg.to_export_file(global_arena.as_arena_ref())?;\n    if export_file.config.parse_only {'''
          new='''    let global_arena = Arena::new();\n    let phase_start = std::time::Instant::now();\n    let (export_file, skipped_axioms) = cfg.to_export_file(global_arena.as_arena_ref())?;\n    let parse_s = phase_start.elapsed().as_secs_f64();\n    if export_file.config.parse_only {'''
          assert old in s
          s=s.replace(old,new,1)
          old='''    // Check the environment\n    export_file.check_all_declars();\n    // Pretty print as necessary'''
          new='''    // Check the environment\n    let check_start = std::time::Instant::now();\n    export_file.check_all_declars();\n    let check_s = check_start.elapsed().as_secs_f64();\n    eprintln!("PHASE_PROFILE parse_s={:.9} check_s={:.9} decls={}", parse_s, check_s, export_file.declars.len());\n    // Pretty print as necessary'''
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          (cd soko && RUSTFLAGS='-C target-cpu=native' cargo build --release)

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('arena-tests')
          fs=list((root/'good').rglob('*.ndjson'))
          chosen=sorted(fs,key=lambda p:p.stat().st_size,reverse=True)[:24]
          chosen=sorted(chosen,key=lambda p:hashlib.sha256(str(p.relative_to(root)).encode()).hexdigest())
          Path('results/phase-profile/cases.txt').write_text('\n'.join(str(p) for p in chosen)+'\n')
          PY
          : > "$OUT/raw.txt"
          while read -r f; do
            echo "CASE $f" >> "$OUT/raw.txt"
            soko/target/release/sokonanoda soko/config.json < "$f" >/dev/null 2>> "$OUT/raw.txt"
          done < "$OUT/cases.txt"
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          rows=[]; current=None
          for line in Path('results/phase-profile/raw.txt').read_text().splitlines():
              if line.startswith('CASE '): current=line[5:]
              m=re.search(r'PHASE_PROFILE parse_s=([0-9.]+) check_s=([0-9.]+) decls=(\d+)',line)
              if m: rows.append({'file':current,'parse_s':float(m.group(1)),'check_s':float(m.group(2)),'decls':int(m.group(3))})
          ps=sum(r['parse_s'] for r in rows); cs=sum(r['check_s'] for r in rows); total=ps+cs
          summary={'cases':rows,'parse_seconds':ps,'check_seconds':cs,'measured_seconds':total,
                   'parse_fraction':ps/total if total else None,'check_fraction':cs/total if total else None}
          Path('results/phase-profile/summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)); print(json.dumps(summary,indent=2,sort_keys=True))
          if len(rows)!=24: raise SystemExit(f'expected 24 profiles, got {len(rows)}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-kernel-arena-phase-profile
          path: results/phase-profile/
