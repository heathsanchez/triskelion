name: CP3 frozen protected four-arm evaluation

on:
  push:
    branches: [cp3-recovery-20260815]
    paths:
      - '.github/workflows/cp3-protected-four-arm.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cp3-protected-four-arm-frozen-v1
  cancel-in-progress: false

env:
  RIVER_API_KEY: ${{ secrets.RIVER_API_KEY }}
  PYTHONDONTWRITEBYTECODE: "1"
  CAP_SHA: d550b49d855681b3ec68944249265fabb8d4da59b160af15f98a6ed96b2e0380
  RAW_SHA: f0852bd16fc45f0080be8d0ba9391d4c14746f3126b66a1d448413117313b212
  ARTIFACT_SHA: 82c91b5a067309afe50db2ab0697b7620549de4e213e727bfd29fb6c53270c59

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen bytes, matrix and unopened boundary
        run: |
          test "$(sha256sum cp3_frozen/acquisition/CAPABILITY.json | awk '{print $1}')" = "$CAP_SHA"
          test "$(sha256sum cp3_frozen/acquisition/RAW_MEMORY.txt | awk '{print $1}')" = "$RAW_SHA"
          mkdir -p cp3_out/preflight
          python -B cp3_frozen/protected_preflight.py \
            --acquisition-dir cp3_frozen/acquisition \
            --expected-capability-sha256 "$CAP_SHA" \
            --expected-raw-memory-sha256 "$RAW_SHA" \
            --out cp3_out/preflight/PROTECTED_PREFLIGHT.json
          python - <<'PY'
          import hashlib,json
          c=json.load(open('cp3_frozen/acquisition/CAPABILITY.json'))
          blob=json.dumps(c['artifact'],sort_keys=True,separators=(',',':')).encode()
          assert hashlib.sha256(blob).hexdigest() == '82c91b5a067309afe50db2ab0697b7620549de4e213e727bfd29fb6c53270c59'
          m=json.load(open('cp3_frozen/PROTECTED_EVAL_MATRIX.json'))
          assert m['cases']==['thefuck/32','keras/32','spacy/2','fastapi/5','black/18']
          assert m['arms']==['COLD','RAW MEMORY','ALWAYS-ON','VERIFIED']
          assert m['cell_count']==20 and m['max_calls_per_cell']==2 and m['max_tokens_per_call']==2048
          assert m['post_hoc_exclusions'] is False and m['post_hoc_tuning'] is False
          print('FROZEN PROTECTED GATE VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cp3-protected-preflight-final
          path: cp3_out/preflight/PROTECTED_PREFLIGHT.json
          retention-days: 90

  sanitize:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Clone official BugsInPy
        run: git clone --depth 1 https://github.com/soarsmu/BugsInPy.git BugsInPy
      - name: Pull exact protected runtimes
        run: |
          docker pull 'python:3.7.0@sha256:10608fb357a18383f792efbf7472ec6d2e166dad62efc0d7c409ef2777aaafd0'
          docker pull 'python:3.7.3@sha256:9e0b4f32487ca1863b45383420b8db77990debae748e2e875d2f86fa9510d4a5'
          docker pull 'python:3.7.7@sha256:c1e36afba1c3c230a6846801fb284cf4383a8a0080fcf32c2ec625c066c56361'
          docker pull 'python:3.8.3@sha256:dd6cd8191ccbced2a6af5d0ddb51e6057c1444df14e14bcfd5c7b3ef78738050'
      - name: Freeze one sanitized bundle per protected case
        run: |
          export PATH="$PWD/BugsInPy/framework/bin:$PATH"
          mkdir -p cp3_out/bundles
          python -B cp3/prepare_protected_bundle_v2.py --bugsinpy "$PWD/BugsInPy" --project thefuck --bug-id 32 --out cp3_out/bundles/thefuck_32.json
          python -B cp3/prepare_protected_bundle_v2.py --bugsinpy "$PWD/BugsInPy" --project keras --bug-id 32 --out cp3_out/bundles/keras_32.json
          python -B cp3/prepare_protected_bundle_v2.py --bugsinpy "$PWD/BugsInPy" --project spacy --bug-id 2 --out cp3_out/bundles/spacy_2.json
          python -B cp3/prepare_protected_bundle_v2.py --bugsinpy "$PWD/BugsInPy" --project fastapi --bug-id 5 --out cp3_out/bundles/fastapi_5.json
          python -B cp3/prepare_protected_bundle_v2.py --bugsinpy "$PWD/BugsInPy" --project black --bug-id 18 --out cp3_out/bundles/black_18.json
          python - <<'PY'
          import json,glob
          xs=[json.load(open(p)) for p in sorted(glob.glob('cp3_out/bundles/*.json'))]
          assert len(xs)==5 and all(x['fixed_information_accessed'] is False for x in xs)
          assert sum(x['sanitizer_native_evaluations'] for x in xs)==5
          print('BUNDLES FROZEN',[(x['case'],x['bundle_sha256'],x['python_version']) for x in xs])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cp3-protected-bundles
          path: cp3_out/bundles/*.json
          retention-days: 90

  evaluate:
    needs: sanitize
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        case: [thefuck_32, keras_32, spacy_2, fastapi_5, black_18]
        arm: [cold, raw_memory, always_on, verified]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cp3-protected-bundles
          path: cp3_in/bundles
      - name: Clone official BugsInPy
        run: git clone --depth 1 https://github.com/soarsmu/BugsInPy.git BugsInPy
      - name: Install pinned provider
        run: python -m pip install --quiet 'river-client==0.6.1' 'transformers==5.15.0'
      - name: Resolve case index and verify frozen bundle
        id: meta
        shell: bash
        run: |
          case '${{ matrix.case }}' in
            thefuck_32) echo 'idx=0' >> "$GITHUB_OUTPUT" ;;
            keras_32)   echo 'idx=1' >> "$GITHUB_OUTPUT" ;;
            spacy_2)    echo 'idx=2' >> "$GITHUB_OUTPUT" ;;
            fastapi_5)  echo 'idx=3' >> "$GITHUB_OUTPUT" ;;
            black_18)   echo 'idx=4' >> "$GITHUB_OUTPUT" ;;
            *) exit 2 ;;
          esac
          test -f 'cp3_in/bundles/${{ matrix.case }}.json'
      - name: Run exactly one frozen protected cell
        id: cell
        continue-on-error: true
        run: |
          mkdir -p cp3_out/cells
          export PATH="$PWD/BugsInPy/framework/bin:$PATH"
          python -B cp3/protected_four_arm_cell_v2.py \
            --bugsinpy "$PWD/BugsInPy" \
            --bundle 'cp3_in/bundles/${{ matrix.case }}.json' \
            --arm '${{ matrix.arm }}' \
            --case-index '${{ steps.meta.outputs.idx }}' \
            --capability cp3_frozen/acquisition/CAPABILITY.json \
            --raw-memory cp3_frozen/acquisition/RAW_MEMORY.txt \
            --out 'cp3_out/cells/${{ matrix.case }}__${{ matrix.arm }}.json'
      - name: Preserve infrastructure abort without semantic reclassification
        if: always()
        run: |
          mkdir -p cp3_out/cells
          p='cp3_out/cells/${{ matrix.case }}__${{ matrix.arm }}.json'
          if [ ! -f "$p" ]; then
            python - <<'PY'
          import json
          p='cp3_out/cells/${{ matrix.case }}__${{ matrix.arm }}.json'
          json.dump({
            'protocol':'TRISKELION_CP3_FOUR_ARM_V2',
            'case':'${{ matrix.case }}'.replace('_','/',1),
            'arm':'${{ matrix.arm }}',
            'infrastructure_status':'HARNESS_ABORT',
            'verifier_decision':None,
            'protected_native_evaluations':0,
          },open(p,'w'),indent=2,sort_keys=True)
          open(p,'a').write('\n')
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp3-cell-${{ matrix.case }}-${{ matrix.arm }}
          path: cp3_out/cells/*.json
          retention-days: 90

  aggregate:
    needs: evaluate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cp3-cell-*
          path: cp3_in/cells
          merge-multiple: true
      - name: Aggregate without exclusions or tuning
        run: |
          mkdir -p cp3_out
          python - <<'PY'
          import glob,json
          paths=sorted(glob.glob('cp3_in/cells/*.json'))
          rows=[json.load(open(p)) for p in paths]
          expected_cases={'thefuck/32','keras/32','spacy/2','fastapi/5','black/18'}
          expected_arms={'cold','raw_memory','always_on','verified'}
          semantic=[r for r in rows if r.get('infrastructure_status')=='OK']
          by_arm={a:{'cells':0,'native_pass':0,'invoked':0,'infra':0} for a in expected_arms}
          for r in rows:
            a=r['arm']; d=by_arm[a]; d['cells']+=1
            if r.get('infrastructure_status')!='OK': d['infra']+=1
            if r.get('verifier_decision') is True: d['native_pass']+=1
            if r.get('capability_invoked') is True: d['invoked']+=1
          pairs={(r.get('case'),r.get('arm')) for r in rows}
          complete=all((c,a) in pairs for c in expected_cases for a in expected_arms)
          result={
            'protocol':'TRISKELION_CP3_FOUR_ARM_V2',
            'expected_cell_count':20,'observed_cell_count':len(rows),'matrix_complete':complete,
            'capability_sha256':'d550b49d855681b3ec68944249265fabb8d4da59b160af15f98a6ed96b2e0380',
            'raw_memory_sha256':'f0852bd16fc45f0080be8d0ba9391d4c14746f3126b66a1d448413117313b212',
            'by_arm':by_arm,
            'cells':rows,
            'interpretation_frozen_in':'cp3_frozen/SUCCESS_CRITERIA.md',
            'post_hoc_exclusions':False,'post_hoc_tuning':False,
          }
          json.dump(result,open('cp3_out/CP3_PROTECTED_AGGREGATE.json','w'),indent=2,sort_keys=True)
          open('cp3_out/CP3_PROTECTED_AGGREGATE.json','a').write('\n')
          print(json.dumps({k:result[k] for k in ['observed_cell_count','matrix_complete','by_arm']},indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cp3-protected-aggregate
          path: cp3_out/CP3_PROTECTED_AGGREGATE.json
          retention-days: 90
