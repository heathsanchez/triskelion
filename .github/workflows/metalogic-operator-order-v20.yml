name: Metalogic Operator Order V20
on:
  push:
    paths:
      - '.github/workflows/metalogic-operator-order-v20.yml'
      - 'experiments/METALOGIC_OPERATOR_ORDER_V20.py'
  workflow_dispatch:
jobs:
  order-v20:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy scikit-learn
      - name: Run operator order test
        run: python experiments/METALOGIC_OPERATOR_ORDER_V20.py
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-operator-order-v20
          path: artifacts/operator_order_v20/
