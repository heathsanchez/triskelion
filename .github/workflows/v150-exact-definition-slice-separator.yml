name: V150 exact-definition slice separator

on:
  push:
    branches: ["v150-exact-definition-slice-separator"]
    paths:
      - '.github/workflows/v150-exact-definition-slice-separator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v150-exact-definition-slice-separator
  cancel-in-progress: false

jobs:
  separator:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      RIVER_API_KEY: ${{ secrets.RIVER_API_KEY }}
      PYTHONDONTWRITEBYTECODE: "1"
      V145_TEMPLATE_ROOT: /tmp/v150_precompiled_templates
    steps:
      - uses: actions/checkout@v6

      - name: Freeze V150 provenance before outcomes
        run: |
          python - <<'PY'
          import hashlib,pathlib
          paths=[
            'protocols/V145_NATURAL_THIRD_RUNG_CAUSAL_PRECOMMIT.md',
            'protocols/V145A_PRECOMPILED_CHECKOUT_APPARATUS_ADDENDUM.md',
            'protocols/V149_CONTEXT_ADAPTER_REPAIR_PRECOMMIT.md',
            'protocols/V150_EXACT_DEFINITION_SLICE_SEPARATOR_PRECOMMIT.md',
            'cp3/v145_natural_third_rung_causal.py',
            'cp3/v145_precompiled_runner.py',
            'cp3/v149_context_resolver.py',
            'cp3/v150_exact_definition_slice.py',
            'cp3/v150_preflight.py',
            'cp3/v150_natural_third_rung_causal.py',
            'cp3/bugsinpy_exact_runtime.py','cp3/river_qwen35_provider.py']
          for p in paths:
            b=pathlib.Path(p).read_bytes(); print(p,hashlib.sha256(b).hexdigest())
          PY

      - name: Clone official BugsInPy
        run: git clone --depth 1 https://github.com/soarsmu/BugsInPy.git BugsInPy

      - name: Pull frozen exact CPython images
        run: |
          for image in \
            'python:3.7.3@sha256:9e0b4f32487ca1863b45383420b8db77990debae748e2e875d2f86fa9510d4a5' \
            'python:3.7.4@sha256:fc0a398e1987fb1e58909053c11630e06adb3df265fe693391779020b9253f5e' \
            'python:3.8.3@sha256:dd6cd8191ccbced2a6af5d0ddb51e6057c1444df14e14bcfd5c7b3ef78738050'; do docker pull "$image"; done

      - name: Install proven CP3 provider dependency
        run: python -m pip install --quiet 'river-client==0.6.1'

      - name: V150 exact-slice eligibility gate
        run: |
          mkdir -p artifacts
          PYTHONPATH="$PWD/cp3:$PWD/cp3/vendor/cp1" python -B cp3/v150_preflight.py \
            --bugsinpy "$PWD/BugsInPy" \
            --out "$PWD/artifacts/V150_PREFLIGHT.json"

      - name: Run unchanged developmental controller through V150 representation
        run: |
          PYTHONPATH="$PWD/cp3:$PWD/cp3/vendor/cp1" python -B cp3/v150_natural_third_rung_causal.py \
            --bugsinpy "$PWD/BugsInPy" \
            --out "$PWD/artifacts/v150"

      - name: Show V150 verdict
        if: always()
        run: |
          cat artifacts/V150_PREFLIGHT.json || true
          if [ -f artifacts/v150/V145_RESULT.json ]; then
            python - <<'PY'
          import json
          r=json.load(open('artifacts/v150/V145_RESULT.json'))
          print('V150 SCIENTIFIC VERDICT',r.get('verdict'))
          if 'T2' in r:
            print('T2',r['T2'].get('advantage'),json.dumps(r['T2'].get('summary'),indent=2,sort_keys=True))
          if 'T3' in r:
            print('T3',r['T3'].get('advantage'),json.dumps(r['T3'].get('summary'),indent=2,sort_keys=True))
          print('GATES',json.dumps(r.get('gates'),indent=2,sort_keys=True))
          PY
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v150-exact-definition-slice
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
