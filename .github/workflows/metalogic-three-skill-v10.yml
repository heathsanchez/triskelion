name: Metalogic Three Skill Replication V10
on:
  push:
    paths:
      - '.github/workflows/metalogic-three-skill-v10.yml'
      - 'experiments/METALOGIC_THREE_SKILL_REPLICATION_V10.py'
  workflow_dispatch:
jobs:
  replication-v10:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RIVER_API_KEY: ${{ secrets.RIVER_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: python -m pip install 'river-client==0.6.1' 'protobuf>=6.31.1,<7' transformers
      - name: Require River secret
        run: test -n "$RIVER_API_KEY"
      - name: Run independent replication V10
        run: python experiments/METALOGIC_THREE_SKILL_REPLICATION_V10.py
      - name: Upload scientific artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-three-skill-v10
          path: artifacts/three_skill_v10/
