name: V163 Semantic Capability Confirmation

on:
  push:
    branches:
      - v158-unified-developmental-runtime
    paths:
      - 'protocols/V163_SEMANTIC_CAPABILITY_QUALIFICATION_CONFIRMATION_PRECOMMIT.md'
      - 'cp3/v163_semantic_capability_confirmation.py'
      - '.github/workflows/v163-semantic-capability-confirmation.yml'

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RIVER_API_KEY: ${{ secrets.RIVER_API_KEY }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6

      - name: Freeze V163 provenance before outcomes
        run: |
          git rev-parse HEAD
          python -m py_compile cp3/v163_semantic_capability_confirmation.py
          sha256sum \
            protocols/V163_SEMANTIC_CAPABILITY_QUALIFICATION_CONFIRMATION_PRECOMMIT.md \
            cp3/v163_semantic_capability_confirmation.py \
            cp3/v159_safe_persistent_runner.py \
            cp3/v159_natural_longitudinal_live.py \
            cp3/v160_routing_vs_content.py \
            cp3_frozen/acquisition/CAPABILITY.json \
            cp3_frozen/acquisition/RAW_MEMORY.txt

      - name: Install frozen provider dependency
        run: python -m pip install --quiet 'river-client==0.6.1'

      - name: Fail-fast River transport gate
        run: |
          test -n "$RIVER_API_KEY"
          timeout --signal=TERM --kill-after=5s 30s python - <<'PY'
          import os
          import river_client as river
          model='Qwen/Qwen3.5-9B'
          client=river.Client(api_key=os.environ['RIVER_API_KEY'])
          if not client.health_check():
              raise SystemExit('River health check failed before V163 preparation')
          enabled=list(client.get_capabilities())
          if model not in enabled:
              raise SystemExit(f'frozen model unavailable: {model}')
          print('river_health True')
          print('frozen_model_available True')
          PY

      - name: Clone frozen BugsInPy snapshot
        run: |
          git clone --depth 1 https://github.com/soarsmu/BugsInPy.git BugsInPy
          test "$(git -C BugsInPy rev-parse HEAD)" = "11c5f1eea954a42132cfd06bf257766a7963e0fd"

      - name: Pull exact thefuck historical runtime
        run: docker pull 'python:3.7.0@sha256:10608fb357a18383f792efbf7472ec6d2e166dad62efc0d7c409ef2777aaafd0'

      - name: Run V163
        run: |
          mkdir -p artifacts
          PYTHONPATH="$PWD:$PWD/cp3:$PWD/cp3/vendor/cp1" python -B cp3/v163_semantic_capability_confirmation.py \
            --bugsinpy "$PWD/BugsInPy" \
            --out "$PWD/artifacts/v163"

      - name: Show V163 verdict
        if: always()
        run: |
          if [ -f artifacts/v163/V163_RESULT.json ]; then
            python - <<'PY'
          import json
          r=json.load(open('artifacts/v163/V163_RESULT.json'))
          print('V163 VERDICT', r.get('verdict'))
          print(json.dumps(r.get('summary'), indent=2, sort_keys=True))
          print(json.dumps(r.get('mechanism'), indent=2, sort_keys=True))
          PY
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v163-semantic-capability-confirmation
          path: artifacts/v163/
          if-no-files-found: warn
          retention-days: 90
