name: V78 Alphabet Collider Calibration

on:
  push:
    branches: [v78-alphabet-collider]
  workflow_dispatch:

jobs:
  alphabet-collider:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run alphabet calibration
        run: python experiments/V78_ALPHABET_COLLIDER_CALIBRATION.py
      - name: Run grammar and organ calibration
        run: python experiments/V78B_GRAMMAR_ORGAN_CALIBRATION.py
      - name: Run hidden primitive recovery
        run: python experiments/V78C_HIDDEN_PRIMITIVE_RECOVERY.py
      - name: Preserve hidden primitive result
        run: |
          mkdir -p artifact
          cp /tmp/v78c_result.json artifact/RESULT_V78C_HIDDEN_RECOVERY.json
      - name: Run hardened RELATE and RECURSE classification
        run: python experiments/V78C_RELATE_RECURSE_CLASSIFICATION.py
      - name: Copy remaining results into artifact directory
        run: |
          cp /tmp/alphabet_collider_result.json artifact/RESULT_V78.json
          cp /tmp/v78b_result.json artifact/RESULT_V78B.json
          cp /tmp/v78c_result.json artifact/RESULT_V78D_RELATE_RECURSE.json
      - uses: actions/upload-artifact@v4
        with:
          name: v78-alphabet-collider-calibration
          path: artifact/*.json
