name: Lean Kernel Arena compose chunk and nostore

on:
  push:
    branches: [agent/lean-kernel-arena-compose-chunk-nostore]

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare robust and speculative candidates
        shell: bash
        run: |
          set -euo pipefail
          SOKO_REV=0fab8874080e379a774a9a27f7538d8a1ddd786b
          ARENA_ARTIFACT=8931227426
          OUT=results/mathgraph-candidates
          rm -rf "$OUT" base robust recnostore globalnostore arena-tests artifact tests.zip
          mkdir -p "$OUT/bin" arena-tests artifact
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/${ARENA_ARTIFACT}/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
          git clone https://github.com/intgrah/sokonanoda.git base
          git -C base checkout "$SOKO_REV"
          cp -a base robust; cp -a base recnostore; cp -a base globalnostore
          python3 - <<'PY'
          from pathlib import Path
          # Robust core: chunk 128 + constructor-major fast path.
          for d in ['robust','recnostore','globalnostore']:
              p=Path(d)/'src/tc.rs'; s=p.read_text(); assert 'const CHUNK_SIZE: usize = 64;' in s
              p.write_text(s.replace('const CHUNK_SIZE: usize = 64;','const CHUNK_SIZE: usize = 128;',1))
              p=Path(d)/'src/eval.rs'; s=p.read_text()
              old="        let major = self\n            .major_to_ctor(depth, major)\n            .or_else(|| self.try_k_reduce(depth, major, rec))\n            .or_else(|| self.try_struct_eta_reduce(depth, major, rec))\n            .unwrap_or(major);"
              new="        let major = if matches!(major, Value::Rigid { head: RigidHead::Ctor(..), .. }) {\n            major\n        } else {\n            self.major_to_ctor(depth, major)\n                .or_else(|| self.try_k_reduce(depth, major, rec))\n                .or_else(|| self.try_struct_eta_reduce(depth, major, rec))\n                .unwrap_or(major)\n        };"
              assert old in s; p.write_text(s.replace(old,new,1))
          # Speculative A: bypass global WHNF store only for recursor-major exposure.
          p=Path('recnostore/src/eval.rs'); s=p.read_text()
          marker="    pub(crate) fn whnf_head(&mut self, depth: u32, v: V<'t>) -> V<'t> {"
          helper="    fn whnf_head_nostore(&mut self, depth: u32, v: V<'t>) -> V<'t> {\n        let mut cur = v;\n        loop {\n            cur = self.force_thunk(depth, cur);\n            match cur {\n                Value::Unfold { .. } => { let next = self.unfold_value(depth, cur); if std::ptr::eq(next, cur) { return cur; } cur = next; }\n                Value::Rigid { head: RigidHead::Recursor(..) | RigidHead::QuotConst(..), .. } => match self.iota_value(depth, cur) { Some(next) => cur = next, None => return cur },\n                _ => return cur,\n            }\n        }\n    }\n\n"
          assert marker in s; s=s.replace(marker,helper+marker,1)
          old="        let major = self.whnf_head(depth, args[rec.major_idx()]);"; assert old in s
          p.write_text(s.replace(old,"        let major = self.whnf_head_nostore(depth, args[rec.major_idx()]);",1))
          # Speculative B: remove the global WHNF store from both normalizer entry points.
          p=Path('globalnostore/src/eval.rs'); s=p.read_text()
          lookup="        if let Some(r) = self.store_lookup(depth, v) {\n            return r;\n        }\n"
          note="        self.note_whnf(depth, v, result, steps);\n        result"
          assert s.count(lookup)>=2 and s.count(note)>=2
          s=s.replace(lookup,'',2).replace(note,'        result',2)
          p.write_text(s)
          PY
          for d in base robust recnostore globalnostore; do
            cat > "$d/config.json" <<'JSON'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":2}
          JSON
            (cd "$d" && RUSTFLAGS='-C target-cpu=native' cargo build --release)
            cp "$d/target/release/sokonanoda" "$OUT/bin/$d"
          done
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,time,json,statistics,random,hashlib
          root=Path.cwd(); out=root/'results/mathgraph-candidates'; vs=['base','robust','recnostore','globalnostore']
          bins={v:out/'bin'/v for v in vs}; cfgs={v:root/v/'config.json' for v in vs}
          def status(rc): return 'accept' if rc==0 else ('decline' if rc==2 else 'reject')
          cases=[]
          for kind,exp in [('good','accept'),('bad','reject')]:
            for p in (root/'arena-tests'/kind).rglob('*.ndjson'): cases.append((p,exp))
          correctness={}
          for v in vs:
            bad=[]
            for p,exp in cases:
              with p.open('rb') as f: rc=subprocess.run([str(bins[v]),str(cfgs[v])],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
              if status(rc)!=exp: bad.append({'file':str(p.relative_to(root/'arena-tests')),'expected':exp,'got':status(rc),'rc':rc})
            correctness[v]={'correct':len(cases)-len(bad),'total':len(cases),'failures':bad}
          workload=sorted([p for p,_ in cases],key=lambda p:p.stat().st_size,reverse=True)[:24]
          workload=sorted(workload,key=lambda p:hashlib.sha256(str(p.relative_to(root/'arena-tests')).encode()).hexdigest())
          samples={v:[] for v in vs}
          for seed in range(20):
            order=vs.copy(); random.Random(seed).shuffle(order)
            for v in order:
              t=time.perf_counter()
              for p in workload:
                with p.open('rb') as f: subprocess.run([str(bins[v]),str(cfgs[v])],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,check=False)
              samples[v].append(time.perf_counter()-t)
          med={v:statistics.median(samples[v]) for v in vs}; b=med['base']
          summary={'correctness':correctness,'median_seconds':med,'speedup_vs_base':{v:b/med[v] for v in vs},'samples_seconds':samples}
          (out/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)); print(json.dumps(summary,indent=2,sort_keys=True))
          if any(x['correct']!=x['total'] for x in correctness.values()): raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-kernel-arena-mathgraph-candidates
          path: results/mathgraph-candidates/
