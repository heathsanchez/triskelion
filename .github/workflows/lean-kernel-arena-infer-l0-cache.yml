name: Lean Kernel Arena infer-L0 cache

on:
  push:
    branches: [agent/lean-kernel-arena-infer-l0-cache]

jobs:
  infer-l0:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare canonical-only and raw-L0 inference caches
        shell: bash
        run: |
          set -euo pipefail
          SOKO_REV=0fab8874080e379a774a9a27f7538d8a1ddd786b
          ARENA_ARTIFACT=8931227426
          OUT=results/infer-l0
          rm -rf "$OUT" base l0 arena-tests artifact tests.zip
          mkdir -p "$OUT" arena-tests artifact
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/${ARENA_ARTIFACT}/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
          git clone https://github.com/intgrah/sokonanoda.git base
          git -C base checkout "$SOKO_REV"
          cp -a base l0
          python3 - <<'PY'
          from pathlib import Path
          p=Path('l0/src/util.rs'); s=p.read_text()
          old="    pub(crate) type_cache: FxHashMap<(usize, ExprPtr<'t>), crate::infer::CachedType<'a>>,"
          new=old+"\n    pub(crate) type_cache_raw: FxHashMap<(usize, ExprPtr<'t>), crate::infer::CachedType<'a>>," 
          assert old in s; s=s.replace(old,new,1)
          old='            type_cache: session_fx_hash_map(),'
          new=old+'\n            type_cache_raw: session_fx_hash_map(),'
          assert old in s; s=s.replace(old,new,1)
          old='        shrink_map(&mut self.type_cache);'
          new=old+'\n        shrink_map(&mut self.type_cache_raw);'
          assert old in s; s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('l0/src/infer.rs'); s=p.read_text()
          old="""        let key = (self.key_env(env, e) as *const value::Env<'t> as usize, e);\n        let scope = self.uparam_scope();\n        if let Some(cached) = self.tc_cache.type_cache.get(&key).copied() {\n            if flag == InferOnly || cached.checked_under == scope {\n                return cached.result;\n            }\n        }\n"""
          new="""        let raw_key = (env as *const value::Env<'t> as usize, e);\n        let scope = self.uparam_scope();\n        if let Some(cached) = self.tc_cache.type_cache_raw.get(&raw_key).copied() {\n            if flag == InferOnly || cached.checked_under == scope {\n                return cached.result;\n            }\n        }\n        let key = (self.key_env(env, e) as *const value::Env<'t> as usize, e);\n        if let Some(cached) = self.tc_cache.type_cache.get(&key).copied() {\n            if flag == InferOnly || cached.checked_under == scope {\n                self.tc_cache.type_cache_raw.insert(raw_key, cached);\n                return cached.result;\n            }\n        }\n"""
          assert old in s; s=s.replace(old,new,1)
          old='        self.tc_cache.type_cache.insert(key, CachedType { result: r, checked_under });\n        r'
          new='        let cached = CachedType { result: r, checked_under };\n        self.tc_cache.type_cache.insert(key, cached);\n        self.tc_cache.type_cache_raw.insert(raw_key, cached);\n        r'
          assert old in s; s=s.replace(old,new,1)
          p.write_text(s)
          PY
          cat > base/config.json <<'JSON'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":2}
          JSON
          cp base/config.json l0/config.json
          (cd base && RUSTFLAGS='-C target-cpu=native' cargo build --release)
          (cd l0 && RUSTFLAGS='-C target-cpu=native' cargo build --release)
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,time,json,statistics,random,hashlib
          root=Path.cwd(); out=root/'results/infer-l0'
          bins={'base':root/'base/target/release/sokonanoda','l0':root/'l0/target/release/sokonanoda'}
          cfgs={'base':root/'base/config.json','l0':root/'l0/config.json'}
          def status(rc): return 'accept' if rc==0 else ('decline' if rc==2 else 'reject')
          cases=[]
          for kind,exp in [('good','accept'),('bad','reject')]:
              for p in (root/'arena-tests'/kind).rglob('*.ndjson'): cases.append((p,exp))
          correctness={}
          for v,e in bins.items():
              bad=[]
              for p,exp in cases:
                  with p.open('rb') as f: rc=subprocess.run([str(e),str(cfgs[v])],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
                  if status(rc)!=exp: bad.append({'file':str(p.relative_to(root/'arena-tests')),'expected':exp,'got':status(rc),'rc':rc})
              correctness[v]={'correct':len(cases)-len(bad),'total':len(cases),'failures':bad}
          fs=[p for p,_ in cases]
          workload=sorted(fs,key=lambda p:p.stat().st_size,reverse=True)[:24]
          workload=sorted(workload,key=lambda p:hashlib.sha256(str(p.relative_to(root/'arena-tests')).encode()).hexdigest())
          samples={v:[] for v in bins}
          for seed in range(14):
              order=list(bins); random.Random(seed).shuffle(order)
              for v in order:
                  t=time.perf_counter()
                  for p in workload:
                      with p.open('rb') as f: subprocess.run([str(bins[v]),str(cfgs[v])],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,check=False)
                  samples[v].append(time.perf_counter()-t)
          med={v:statistics.median(xs) for v,xs in samples.items()}
          summary={'correctness':correctness,'median_seconds':med,'samples_seconds':samples,'speedup_l0_vs_base':med['base']/med['l0']}
          (out/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)); print(json.dumps(summary,indent=2,sort_keys=True))
          if any(x['correct']!=x['total'] for x in correctness.values()): raise SystemExit('correctness regression')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-kernel-arena-infer-l0-cache
          path: results/infer-l0/
