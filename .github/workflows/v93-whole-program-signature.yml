name: V93 Whole Program Signature
on:
  push:
    branches: [v93-whole-program-signature]
jobs:
  v93:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pytest pytest-timeout
      - name: Fetch frozen QuixBugs
        run: |
          git clone -q https://github.com/jkoppel/QuixBugs /tmp/QuixBugs
          cd /tmp/QuixBugs
          git checkout -q 4257f44b0ff1181dedaedee6a447e133219fcebf
      - name: Run V93
        run: QUIXBUGS_DIR=/tmp/QuixBugs OUT_DIR=results/v93 python experiments/METALOGIC_V93_WHOLE_PROGRAM_SIGNATURE.py
      - uses: actions/upload-artifact@v4
        with:
          name: v93-whole-program-signature
          path: results/v93/RESULT.json
