name: Lean Kernel Arena mathlib A/B

on:
  push:
    branches: [agent/lean-kernel-arena-growth]

jobs:
  mathlib-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Arena-style and MathGraph-hybrid PGO binaries
        shell: bash
        run: |
          set -euo pipefail
          SOKO_REV=0fab8874080e379a774a9a27f7538d8a1ddd786b
          ARENA_ARTIFACT=8931227426
          rm -rf soko arena-small artifact mathlib-ab
          mkdir -p arena-small artifact mathlib-ab
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/${ARENA_ARTIFACT}/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-small
          git clone https://github.com/intgrah/sokonanoda.git soko
          git -C soko checkout "$SOKO_REV"
          cat > soko/config.json <<'JSON'
          {
            "use_stdin": true,
            "nat_extension": true,
            "string_extension": true,
            "unpermitted_axiom_hard_error": false,
            "unsafe_permit_all_axioms": true,
            "num_threads": 4
          }
          JSON
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('arena-small')
          fs=list((root/'good').rglob('*.ndjson'))+list((root/'bad').rglob('*.ndjson'))
          largest=sorted(fs,key=lambda p:p.stat().st_size,reverse=True)[:24]
          largest=sorted(largest,key=lambda p:hashlib.sha256(str(p.relative_to(root)).encode()).hexdigest())
          init=list(root.rglob('init-prelude.ndjson'))
          assert len(init)==1, init
          Path('mathlib-ab/arena-train.txt').write_text(str(init[0])+'\n')
          Path('mathlib-ab/hybrid-train.txt').write_text(str(init[0])+'\n'+'\n'.join(str(p) for p in largest)+'\n')
          PY
          rustup component add llvm-tools-preview
          PROF="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-profdata"
          rm -rf soko/gen soko/profiles soko/use-arena soko/use-hybrid
          mkdir -p soko/profiles
          (cd soko && CARGO_TARGET_DIR=gen RUSTFLAGS="-C target-cpu=native -C profile-generate=$PWD/profiles" cargo build --release)
          make_bin() {
            local name=$1 list=$2 target=$3
            rm -f soko/profiles/*.profraw soko/profiles/*.profdata
            while read -r f; do soko/gen/release/sokonanoda soko/config.json < "$f" >/dev/null 2>/dev/null || true; done < "$list"
            "$PROF" merge -o "/tmp/${name}.profdata" soko/profiles/*.profraw
            (cd soko && CARGO_TARGET_DIR="$target" RUSTFLAGS="-C target-cpu=native -C profile-use=/tmp/${name}.profdata" cargo build --release)
            cp "soko/${target}/release/sokonanoda" "mathlib-ab/${name}"
          }
          make_bin arena_profile mathlib-ab/arena-train.txt use-arena
          make_bin hybrid_profile mathlib-ab/hybrid-train.txt use-hybrid
          cp soko/config.json mathlib-ab/config.json
          sha256sum mathlib-ab/arena_profile mathlib-ab/hybrid_profile > mathlib-ab/binaries.sha256
          rm -rf soko arena-small artifact tests.zip
          df -h . | tee mathlib-ab/disk-before-mathlib.txt

      - name: Build exact Arena mathlib export
        shell: bash
        run: |
          set -euo pipefail
          rm -rf arena
          git clone https://github.com/leanprover/lean-kernel-arena.git arena
          git -C arena checkout e1553db0d9ad58b6d7e0ca7de839191187aff0cb
          # Arena needs elan/Lean for module export.
          if ! command -v elan >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
            export PATH="$HOME/.elan/bin:$PATH"
          fi
          python3 -m pip install --quiet jinja2 jsonschema markdown pyyaml
          (cd arena && python3 lka.py build-test mathlib)
          find arena/_build/tests -type f -name '*.ndjson' -printf '%s %p\n' | sort -nr | head -20 | tee mathlib-ab/built-tests.txt
          MATHLIB=$(find arena/_build/tests -type f -name '*mathlib*.ndjson' | head -n1)
          test -n "$MATHLIB"
          echo "$MATHLIB" > mathlib-ab/mathlib-path.txt
          sha256sum "$MATHLIB" | tee mathlib-ab/mathlib.sha256
          stat -c '%s bytes' "$MATHLIB" | tee mathlib-ab/mathlib-size.txt
          df -h . | tee mathlib-ab/disk-after-mathlib.txt

      - name: Paired mathlib benchmark
        shell: bash
        run: |
          set -euo pipefail
          MATHLIB=$(cat mathlib-ab/mathlib-path.txt)
          CFG="$PWD/mathlib-ab/config.json"
          A="$PWD/mathlib-ab/arena_profile"
          H="$PWD/mathlib-ab/hybrid_profile"
          chmod +x "$A" "$H"
          : > mathlib-ab/raw.tsv
          run_one() {
            local label=$1 exe=$2
            local tf
            tf=$(mktemp)
            set +e
            /usr/bin/time -f '%e\t%U\t%S\t%M' -o "$tf" "$exe" "$CFG" < "$MATHLIB" >/dev/null 2>"mathlib-ab/${label}.stderr"
            rc=$?
            set -e
            vals=$(cat "$tf"); rm -f "$tf"
            printf '%s\t%s\t%s\n' "$label" "$rc" "$vals" | tee -a mathlib-ab/raw.tsv
            test "$rc" -eq 0
          }
          # ABBA minimizes runner drift while keeping the exact same export.
          run_one arena_1 "$A"
          run_one hybrid_1 "$H"
          run_one hybrid_2 "$H"
          run_one arena_2 "$A"
          python3 - <<'PY'
          from pathlib import Path
          import json,statistics
          rows=[]
          for line in Path('mathlib-ab/raw.tsv').read_text().splitlines():
              label,rc,wall,user,sys,rss=line.split('\t')
              rows.append({'label':label,'rc':int(rc),'wall_s':float(wall),'user_s':float(user),'sys_s':float(sys),'max_rss_kb':int(rss)})
          arena=[r['wall_s'] for r in rows if r['label'].startswith('arena_')]
          hybrid=[r['wall_s'] for r in rows if r['label'].startswith('hybrid_')]
          a=statistics.median(arena); h=statistics.median(hybrid)
          summary={'rows':rows,'arena_median_s':a,'hybrid_median_s':h,'speedup_hybrid_vs_arena':a/h,'delta_percent':(h/a-1)*100,'all_accept':all(r['rc']==0 for r in rows)}
          Path('mathlib-ab/summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          print(json.dumps(summary,indent=2,sort_keys=True))
          if not summary['all_accept']: raise SystemExit('mathlib correctness failure')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-kernel-arena-mathlib-ab
          path: mathlib-ab/
