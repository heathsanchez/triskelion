name: CP3 River client interface probe

on:
  push:
    branches: [cp3-recovery-20260815]
    paths:
      - '.github/workflows/cp3-river-signature-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect river-client interface
        run: |
          python -m pip install --quiet river-client
          python - <<'PY'
          import inspect
          import river_client as river
          print('river module:', river.__file__)
          print('Client.sample signature:', inspect.signature(river.Client.sample))
          print('Client.sample source:')
          print(inspect.getsource(river.Client.sample))
          PY
