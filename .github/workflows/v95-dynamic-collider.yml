name: V95 Dynamic Collider
on:
  push:
    branches: [v95-dynamic-collider]
jobs:
  v95:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pytest pytest-timeout
      - name: Fetch frozen QuixBugs
        run: |
          git clone -q https://github.com/jkoppel/QuixBugs.git /tmp/QuixBugs
          cd /tmp/QuixBugs
          git checkout -q 4257f44b0ff1181dedaedee6a447e133219fcebf
      - name: Run V95
        env:
          QUIXBUGS_DIR: /tmp/QuixBugs
          OUT_DIR: results/v95
        run: python experiments/METALOGIC_V95_DYNAMIC_COLLIDER.py
      - uses: actions/upload-artifact@v4
        with:
          name: v95-dynamic-collider
          path: results/v95/RESULT.json
