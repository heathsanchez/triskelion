name: V96 Verifier Dynamic Collider
on:
  push:
    branches: [v96-verifier-dynamic-collider]
jobs:
  v96:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pytest pytest-timeout
      - name: Fetch frozen QuixBugs
        run: |
          git clone -q https://github.com/jkoppel/QuixBugs.git /tmp/QuixBugs
          cd /tmp/QuixBugs
          git checkout -q 4257f44b0ff1181dedaedee6a447e133219fcebf
      - name: Run V96
        env:
          QUIXBUGS_DIR: /tmp/QuixBugs
          OUT_DIR: results/v96
        run: python experiments/METALOGIC_V96_VERIFIER_DYNAMIC_COLLIDER.py
      - uses: actions/upload-artifact@v4
        with:
          name: v96-verifier-dynamic-collider
          path: results/v96/RESULT.json
