name: Width Normalization Representation Repair V4

on:
  push:
    paths:
      - '.github/workflows/width-normalization-repair-v4.yml'
  pull_request:
    paths:
      - '.github/workflows/width-normalization-repair-v4.yml'
      - 'precommits/WIDTH_NORMALIZATION_REPAIR_V4_PRECOMMIT_20260818.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Clone and verify frozen public substrate
        run: |
          git clone https://github.com/benjaminW2025/one-layer-deeper.git /tmp/old
          cd /tmp/old
          git checkout 697a78d4be579745f3b410c01c966c91e7094ad4
          test "$(git rev-parse HEAD)" = "697a78d4be579745f3b410c01c966c91e7094ad4"
      - name: Install CPU torch
        run: python -m pip install --quiet torch numpy --index-url https://download.pytorch.org/whl/cpu
      - name: Execute frozen representation intervention
        working-directory: /tmp/old
        run: |
          cat > /tmp/run_v4.py <<'PY'
          from __future__ import annotations
          import json, math, random, sys, time
          from pathlib import Path
          import torch

          sys.path.insert(0, '/tmp/old/explorations')
          sys.path.insert(0, '/tmp/old')
          from harness import EncoderModel, VOCAB_SIZE, gather_target_logits, sequence_loss, _chance_baselines
          from data.squaring_mod import TOKEN_IDS, number_tokens, digit_token, tokenize_squaring_mod_with_result

          CELLS=[(299,13,23),(323,17,19),(377,13,29)]
          ARMS=('ORIGINAL','PAD_X6')
          DATA_SEED=45
          MODEL_SEED=0
          COVERAGE=.50
          EPOCHS=20
          BATCH=256
          LR=3e-4
          WEIGHT_DECAY=.01
          WARMUP=50
          GRAD_CLIP=1.0
          D_MODEL=128
          N_LAYERS=2
          N_HEADS=2
          MAX_SEQ_LEN=13  # frozen across every N and both arms: identical parameterization
          DEVICE=torch.device('cpu')
          OUT=Path('/tmp/v4out'); OUT.mkdir(parents=True,exist_ok=True)

          def records_for(N,p,q):
              rng=random.Random(DATA_SEED+N)
              space=N*N
              n_train=int(math.floor(COVERAGE*space))
              n_eval=min(2000,space-n_train)
              vals=rng.sample(range(space),n_train+n_eval)
              rec=lambda ys:[(p,q,y,1,y%N) for y in ys]
              return n_train,n_eval,rec(vals[:n_train]),rec(vals[n_train:])

          def prompt_target(record, arm):
              p,q,x,t,result=record
              N=p*q
              if arm=='ORIGINAL':
                  return tokenize_squaring_mod_with_result(N,x,t,result,separate_input_output=True)
              if arm!='PAD_X6': raise ValueError(arm)
              sx=str(x).zfill(6)
              prompt=[TOKEN_IDS['N'], *number_tokens(N), TOKEN_IDS['X']]
              prompt.extend(digit_token(int(ch)) for ch in sx)
              prompt.extend([TOKEN_IDS['T'], *number_tokens(t)])
              target=number_tokens(result)
              return prompt,target

          def tensorize(records, arm):
              rows=[prompt_target(r,arm) for r in records]
              max_target_len=max(len(t) for _,t in rows)
              batch=len(rows)
              input_ids=torch.full((batch,MAX_SEQ_LEN),TOKEN_IDS['PAD'],dtype=torch.long)
              attention_mask=torch.zeros((batch,MAX_SEQ_LEN),dtype=torch.bool)
              labels=torch.full((batch,max_target_len),-100,dtype=torch.long)
              target_positions=torch.full((batch,max_target_len),-1,dtype=torch.long)
              for i,(prompt,target) in enumerate(rows):
                  plen=len(prompt); tlen=len(target)
                  if plen>MAX_SEQ_LEN: raise RuntimeError((arm,plen,prompt))
                  input_ids[i,:plen]=torch.tensor(prompt,dtype=torch.long)
                  attention_mask[i,:plen]=True
                  labels[i,:tlen]=torch.tensor(target,dtype=torch.long)
                  target_positions[i,:tlen]=torch.arange(plen-tlen,plen,dtype=torch.long)
              return {'input_ids':input_ids,'attention_mask':attention_mask,'labels':labels,'target_positions':target_positions}

          @torch.no_grad()
          def predict(model,tensors):
              model.eval(); ps=[]; ls=[]; n=tensors['input_ids'].size(0)
              for s in range(0,n,1024):
                  stop=min(s+1024,n)
                  b={k:v[s:stop].to(DEVICE) for k,v in tensors.items()}
                  logits=model(b['input_ids'],b['attention_mask']).float()
                  ps.append(gather_target_logits(logits,b['target_positions']).argmax(-1).cpu())
                  ls.append(b['labels'].cpu())
              model.train()
              return torch.cat(ps),torch.cat(ls)

          def run_cell(N,p,q,arm):
              n_train,n_eval,train_records,fresh_records=records_for(N,p,q)
              train=tensorize(train_records,arm); fresh=tensorize(fresh_records,arm)
              steps=math.ceil(EPOCHS*n_train/BATCH)
              torch.manual_seed(MODEL_SEED)
              model=EncoderModel(VOCAB_SIZE,MAX_SEQ_LEN,D_MODEL,N_LAYERS,N_HEADS).to(DEVICE)
              opt=torch.optim.AdamW(model.parameters(),lr=LR,weight_decay=WEIGHT_DECAY)
              sched=torch.optim.lr_scheduler.LambdaLR(opt,lambda s:min(1.0,(s+1)/WARMUP))
              gen=torch.Generator(device='cpu').manual_seed(MODEL_SEED)
              tr={k:v.to(DEVICE) for k,v in train.items()}
              losses=[]; diverged=False; t0=time.time()
              for step in range(steps):
                  idx=torch.randint(0,n_train,(BATCH,),generator=gen).to(DEVICE)
                  b={k:v[idx] for k,v in tr.items()}
                  logits=model(b['input_ids'],b['attention_mask']).float()
                  loss=sequence_loss(logits,b['labels'],b['target_positions'])
                  if not torch.isfinite(loss): diverged=True; break
                  opt.zero_grad(set_to_none=True); loss.backward()
                  torch.nn.utils.clip_grad_norm_(model.parameters(),GRAD_CLIP)
                  opt.step(); sched.step(); losses.append(float(loss.detach()))
              first=sum(losses[:10])/max(1,len(losses[:10])); final=sum(losses[-10:])/max(1,len(losses[-10:]))
              flat=(not diverged) and bool(losses) and final>.95*first
              preds,labels=predict(model,fresh)
              valid=labels!=-100; hits=(preds==labels)&valid; exact=(hits|~valid).all(1)
              digit=float(hits.sum()/valid.sum()); ex=float(exact.float().mean()); cd,ce=_chance_baselines(fresh_records)
              return {
                  'N':N,'arm':arm,'coverage':n_train/(N*N),'n_train':n_train,'n_eval':n_eval,'steps':len(losses),
                  'first_loss':first,'final_loss':final,'diverged':diverged,'flat':flat,
                  'digit':digit,'chance_digit':cd,'digit_excess':digit-cd,
                  'exact':ex,'chance_exact':ce,'exact_excess':ex-ce,
                  'max_seq_len':MAX_SEQ_LEN,'seconds':time.time()-t0,
              }

          cells=[]
          for N,p,q in CELLS:
              for arm in ARMS:
                  c=run_cell(N,p,q,arm); cells.append(c); print(json.dumps(c,sort_keys=True),flush=True)

          by={(c['N'],c['arm']):c for c in cells}
          E=lambda N,A: by[(N,A)]['digit_excess']
          imp=lambda N:E(N,'PAD_X6')-E(N,'ORIGINAL')
          valid=all((not c['diverged']) and (not c['flat']) for c in cells)
          gates={
              'G0_REPRODUCE_BOUNDARY': E(299,'ORIGINAL')-E(323,'ORIGINAL') >= .15,
              'G1_N323_REPAIR': imp(323) >= .10,
              'G2_N323_RESTORE_LEVEL': E(323,'PAD_X6') >= .75*E(299,'ORIGINAL'),
              'G3_N377_REPAIR': imp(377) >= .08,
              'G4_CONTROL_NOT_GLOBAL_MAGIC': imp(323)-imp(299) >= .05,
              'G5_TRAINING_VALID': valid,
          }
          if all(gates.values()): verdict='PASS_WIDTH_REPRESENTATION_REPAIR'
          elif gates['G0_REPRODUCE_BOUNDARY'] and gates['G1_N323_REPAIR'] and gates['G5_TRAINING_VALID']:
              verdict='PARTIAL_WIDTH_REPRESENTATION_REPAIR'
          elif gates['G0_REPRODUCE_BOUNDARY'] and gates['G5_TRAINING_VALID']:
              verdict='NO_WIDTH_REPRESENTATION_REPAIR'
          else:
              verdict='NULL_BOUNDARY_NOT_REPRODUCED'

          summary={
              'protocol':'WIDTH_NORMALIZATION_REPAIR_V4','frozen_external_sha':'697a78d4be579745f3b410c01c966c91e7094ad4',
              'verdict':verdict,'gates':gates,'cells':cells,
              'improvement':{str(N):imp(N) for N,_,_ in CELLS},
              'boundary_original_299_minus_323':E(299,'ORIGINAL')-E(323,'ORIGINAL'),
              'claim_boundary':'Matched causal representation intervention in one pinned decimal modular-reduction/small-encoder setting; not a universal arithmetic, architecture, or developmental-intelligence claim.'
          }
          (OUT/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          md=['# WIDTH_NORMALIZATION_REPAIR_V4 result','',f'**Verdict:** `{verdict}`','',
              '| N | arm | digit | chance | excess | exact | chance | excess | improvement vs original |',
              '|---:|---|---:|---:|---:|---:|---:|---:|---:|']
          for N,_,_ in CELLS:
              for A in ARMS:
                  c=by[(N,A)]; d=0.0 if A=='ORIGINAL' else imp(N)
                  md.append(f"| {N} | {A} | {c['digit']:.5f} | {c['chance_digit']:.5f} | {c['digit_excess']:+.5f} | {c['exact']:.5f} | {c['chance_exact']:.5f} | {c['exact_excess']:+.5f} | {d:+.5f} |")
          md += ['',f"- ORIGINAL N299-N323 boundary: `{summary['boundary_original_299_minus_323']:+.5f}`",'', '## Frozen gates']
          md += [f"- {k}: `{'PASS' if v else 'FAIL'}`" for k,v in gates.items()]
          md += ['', '## Claim boundary','',summary['claim_boundary']]
          (OUT/'README.md').write_text('\n'.join(md)+'\n')
          print('\n'.join(md),flush=True)
          PY
          python /tmp/run_v4.py
      - name: Stage results
        run: |
          mkdir -p results/one_layer_deeper/width_normalization_repair_v4
          cp /tmp/v4out/* results/one_layer_deeper/width_normalization_repair_v4/
          cat results/one_layer_deeper/width_normalization_repair_v4/README.md
      - name: Commit push-run artifacts
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'mathgraph-bot'
          git config user.email '32909488+heathsanchez@users.noreply.github.com'
          git add results/one_layer_deeper/width_normalization_repair_v4
          git commit -m 'Record width-normalization representation repair v4' || exit 0
          git push
