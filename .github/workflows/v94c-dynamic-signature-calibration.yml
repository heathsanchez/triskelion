name: V94C Dynamic Signature Calibration
on:
  push:
    branches: [v94c-dynamic-signature-calibration]
jobs:
  v94c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run V94C
        run: python experiments/METALOGIC_V94C_DYNAMIC_SIGNATURE_CALIBRATION.py
      - uses: actions/upload-artifact@v4
        with:
          name: v94c-dynamic-signature-calibration
          path: results/v94c/RESULT.json
