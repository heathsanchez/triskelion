name: V79 External PROBE Reconstruction

on:
  push:
    branches: [v79-external-probe]
  workflow_dispatch:

jobs:
  external-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install external numeric packages
        run: python -m pip install -q numpy scipy mpmath
      - name: Run external black-box PROBE reconstruction
        run: python experiments/V79_EXTERNAL_BLACKBOX_PROBE.py
      - name: Collect artifact
        run: |
          mkdir -p artifact
          cp /tmp/v79_result.json artifact/RESULT.json
      - uses: actions/upload-artifact@v4
        with:
          name: v79-external-probe
          path: artifact/RESULT.json
