name: Calibrate Joint AB V8
on:
  push:
    paths:
      - 'experiments/CALIBRATE_JOINT_AB_V8.py'
      - '.github/workflows/calibrate-joint-ab-v8.yml'
  workflow_dispatch:
jobs:
  calibrate-joint-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RIVER_API_KEY: ${{ secrets.RIVER_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install 'river-client==0.6.1' 'protobuf>=6.31.1,<7' transformers
      - name: Require River secret
        run: test -n "$RIVER_API_KEY"
      - name: Calibrate joint AB
        run: python experiments/CALIBRATE_JOINT_AB_V8.py
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joint-ab-v8
          path: artifacts/joint_ab_v8/
