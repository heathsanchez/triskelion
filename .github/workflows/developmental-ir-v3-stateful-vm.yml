name: Developmental IR V3 Stateful VM

on:
  push:
    branches:
      - experiment/developmental-ir-v3-stateful-vm
    paths:
      - 'experiments/developmental_ir_v3_stateful_vm.py'
      - 'protocols/DEVELOPMENTAL_IR_V3_STATEFUL_VM_PRECOMMIT.md'
      - 'protocols/DEVELOPMENTAL_IR_V3_STATEFUL_VM_ADDENDUM.md'
      - '.github/workflows/developmental-ir-v3-stateful-vm.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: developmental-ir-v3-stateful-vm
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/developmental-ir-v3-stateful-vm
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify prospective freeze ancestry
        run: |
          git merge-base --is-ancestor b81cc8338350a89651afadaad5e61af372ed2ae8 HEAD
          git merge-base --is-ancestor c09e0dcfb4f32aa05ebd9dc4b53fc666cb5d062f HEAD
          test -f protocols/DEVELOPMENTAL_IR_V3_STATEFUL_VM_PRECOMMIT.md
          test -f protocols/DEVELOPMENTAL_IR_V3_STATEFUL_VM_ADDENDUM.md
          test -f experiments/developmental_ir_v3_stateful_vm.py

      - name: Run exact stateful VM experiment
        run: |
          set -o pipefail
          PYTHONPATH=. python experiments/developmental_ir_v3_stateful_vm.py | tee /tmp/developmental-ir-v3-stateful-vm.log

      - name: Validate scientific result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('results/developmental_ir_v3_stateful_vm/result.json').read_text())
          assert p['protocol']=='DEVELOPMENTAL_IR_V3_STATEFUL_VM'
          assert p['precommit_commit']=='b81cc8338350a89651afadaad5e61af372ed2ae8'
          assert p['addendum_commit']=='c09e0dcfb4f32aa05ebd9dc4b53fc666cb5d062f'
          assert p['universe']['rows']==65536
          assert p['universe']['tasks']==1500
          assert p['universe']['step_horizon']==24
          assert len(p['headline_gates'])==20
          assert p['verdict'] in {
              'PASS_DEVELOPMENTAL_IR_V3_STATEFUL_VM',
              'PARTIAL_DEVELOPMENTAL_IR_V3_STATEFUL_VM',
              'VALID_NEGATIVE_DEVELOPMENTAL_IR_V3_STATEFUL_VM',
          }
          print('SCIENTIFIC_VERDICT='+p['verdict'])
          print(json.dumps(p['separators'],indent=2,sort_keys=True))
          print(json.dumps(p['totals'],indent=2,sort_keys=True))
          print(json.dumps(p['learning'],indent=2,sort_keys=True))
          print(json.dumps(p['archive'],indent=2,sort_keys=True))
          print(json.dumps(p['controls'],indent=2,sort_keys=True))
          print(json.dumps(p['headline_gates'],indent=2,sort_keys=True))
          PY

      - name: Commit authoritative result
        run: |
          git config user.name 'mathgraph-bot'
          git config user.email '32909488+heathsanchez@users.noreply.github.com'
          git add             results/developmental_ir_v3_stateful_vm/result.json             results/developmental_ir_v3_stateful_vm/summary.json
          git commit -m 'Record developmental IR V3 stateful VM result' || exit 0
          git push origin HEAD:experiment/developmental-ir-v3-stateful-vm

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: developmental-ir-v3-stateful-vm-evidence
          path: |
            results/developmental_ir_v3_stateful_vm/result.json
            results/developmental_ir_v3_stateful_vm/summary.json
            /tmp/developmental-ir-v3-stateful-vm.log
          if-no-files-found: warn
