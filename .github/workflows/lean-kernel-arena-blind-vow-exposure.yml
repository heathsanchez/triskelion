name: Lean Kernel Arena blind Vow exposure

on:
  push:
    branches: [agent/lean-kernel-arena-growth]
  workflow_dispatch:

jobs:
  expose-first-obstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      CHECKER_REV: 514ab33fc0262c491a0af1846cc3887f48411e36
      VOW_REV: 15c1b933f87eed2b23c176665730baea37706daa
      ARENA_RUN: 31005978773
      ARENA_ARTIFACT: 8931227426
      ARENA_REV: 8254ae7dc7d6c10dbea94b6761dcb1e4ccdfdee6
      ORDER_SALT: TRISKELION_BLIND_VOW_V1
    steps:
      - uses: actions/checkout@v4

      - name: Freeze corpus before revealing any obstruction
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/${ARENA_ARTIFACT}/zip" \
            -o arena-artifact.zip
          mkdir arena-artifact arena-tests blind-vow-results
          unzip -q arena-artifact.zip -d arena-artifact
          tar -xzf arena-artifact/lean-arena-tests.tar.gz -C arena-tests
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root=Path('arena-tests')
          salt=os.environ['ORDER_SALT']
          rows=[]
          for expected,sub in [('accept','good'),('reject','bad')]:
              for p in (root/sub).rglob('*.ndjson'):
                  rel=str(p.relative_to(root))
                  file_sha=hashlib.sha256(p.read_bytes()).hexdigest()
                  order=hashlib.sha256((salt+'\0'+rel+'\0'+file_sha).encode()).hexdigest()
                  rows.append({'order':order,'rel':rel,'expected':expected,'sha256':file_sha})
          rows.sort(key=lambda x:x['order'])
          canonical=json.dumps(rows,separators=(',',':'),sort_keys=True).encode()
          commitment=hashlib.sha256(canonical).hexdigest()
          Path('/tmp/blind_manifest.json').write_bytes(canonical)
          Path('blind-vow-results/precommit.json').write_text(json.dumps({
              'protocol':'TRISKELION_BLIND_VOW_V1',
              'arena_run':int(os.environ['ARENA_RUN']),
              'arena_artifact':int(os.environ['ARENA_ARTIFACT']),
              'arena_rev':os.environ['ARENA_REV'],
              'checker_rev':os.environ['CHECKER_REV'],
              'vow_rev':os.environ['VOW_REV'],
              'order_salt':salt,
              'case_count':len(rows),
              'ordered_manifest_sha256':commitment
          },indent=2,sort_keys=True))
          print('PRECOMMIT', commitment, 'CASES', len(rows))
          PY

      - name: Build frozen checker
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/pmatos/vow-lean-kernel checker
          git -C checker checkout "$CHECKER_REV"
          git clone https://github.com/vow-lang/vow checker/vow
          git -C checker/vow checkout "$VOW_REV"
          ROOT="$(pwd)/checker"
          ( cd checker/vow && cargo build --all )
          ( cd checker/vow && bash scripts/concat_vow.sh clif > "$ROOT/compiler_clif.vow" )
          ( cd checker/vow && ulimit -v 2000000 && ./target/debug/vow build --no-verify --no-cache "$ROOT/compiler_clif.vow" -o "$ROOT/vowc" )
          test -x checker/vowc
          ( cd checker && VOWC="$ROOT/vowc" bash scripts/build.sh )
          test -x checker/lean_checker

      - name: Reveal only first unresolved case
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess, hashlib
          rows=json.loads(Path('/tmp/blind_manifest.json').read_text())
          exe=Path('checker/lean_checker').resolve()
          exposed=None
          trace=[]
          for rank,m in enumerate(rows,1):
              p=Path('arena-tests')/m['rel']
              try:
                  cp=subprocess.run([str(exe),str(p.resolve())],capture_output=True,text=True,timeout=30)
                  rc=cp.returncode
              except subprocess.TimeoutExpired as e:
                  rc=124; cp=type('X',(),{'stdout':e.stdout or '', 'stderr':e.stderr or ''})()
              status='accept' if rc==0 else ('reject' if rc==1 else ('decline' if rc==2 else 'error'))
              correct=(status==m['expected'])
              trace.append({'rank':rank,'order':m['order'],'expected':m['expected'],'status':status,'correct':correct})
              if not correct:
                  exposed={**m,'rank':rank,'baseline_status':status,'baseline_rc':rc,
                           'stdout':cp.stdout[-12000:] if isinstance(cp.stdout,str) else '',
                           'stderr':cp.stderr[-12000:] if isinstance(cp.stderr,str) else ''}
                  Path('blind-vow-results/exposed.ndjson').write_bytes(p.read_bytes())
                  break
          if exposed is None:
              raise SystemExit('no unresolved case found in frozen corpus')
          # Do not persist filenames or contents of protected later cases. Publish only a hash-chain commitment.
          protected=rows[exposed['rank']:]
          chain=hashlib.sha256(json.dumps(protected,separators=(',',':'),sort_keys=True).encode()).hexdigest()
          public={k:v for k,v in exposed.items() if k not in ('stdout','stderr')}
          public['stdout']=exposed['stdout']; public['stderr']=exposed['stderr']
          public['protected_suffix_count']=len(protected)
          public['protected_suffix_sha256']=chain
          Path('blind-vow-results/exposed.json').write_text(json.dumps(public,indent=2,sort_keys=True))
          Path('blind-vow-results/prefix_trace.json').write_text(json.dumps(trace,indent=2))
          print(json.dumps(public,indent=2,sort_keys=True))
          PY

      - name: Upload blinded exposure
        uses: actions/upload-artifact@v4
        with:
          name: lean-kernel-arena-blind-vow-exposure
          path: blind-vow-results/
