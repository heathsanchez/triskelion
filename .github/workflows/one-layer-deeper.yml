name: One Layer Deeper

on:
  push:
    branches: [one-layer-deeper]
    paths:
      - 'experiments/one_layer_deeper/e0003_context_reinject.py'
      - 'experiments/one_layer_deeper/PROTOCOL.md'
      - '.github/workflows/one-layer-deeper.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Clone evaluator
        run: git clone --depth 1 https://github.com/tilde-research/one-layer-deeper.git /tmp/old
      - name: Install evaluator
        working-directory: /tmp/old
        run: uv sync
      - name: Stage canonical E0003 filename
        run: |
          set -euo pipefail
          mkdir -p /tmp/old-submissions/e0003
          cp experiments/one_layer_deeper/e0003_context_reinject.py /tmp/old-submissions/e0003/submission.py
      - name: Validate E0003
        working-directory: /tmp/old
        run: uv run one-layer validate /tmp/old-submissions/e0003/submission.py
      - name: CPU smoke E0003
        working-directory: /tmp/old
        run: uv run python -m benchmark.runner --manifest benchmark/manifests/smoke_cpu.json --submission-file /tmp/old-submissions/e0003/submission.py > "$GITHUB_WORKSPACE/experiments/one_layer_deeper/smoke_e0003.log"
      - uses: actions/upload-artifact@v4
        with:
          name: one-layer-deeper-smoke-e0003-${{ github.sha }}
          path: experiments/one_layer_deeper/smoke_e0003.log

  hosted-e1:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and One Layer Deeper CLI
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          "$HOME/.local/bin/uv" tool install git+https://github.com/tilde-research/one-layer-deeper.git
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Restore One Layer Deeper authentication
        env:
          ONE_LAYER_CONFIG_B64: ${{ secrets.ONE_LAYER_CONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "$ONE_LAYER_CONFIG_B64" || { echo 'ONE_LAYER_CONFIG_B64 is missing'; exit 2; }
          mkdir -p "$HOME/.config/one-layer"
          printf '%s' "$ONE_LAYER_CONFIG_B64" | base64 --decode > "$HOME/.config/one-layer/config.json"
          chmod 600 "$HOME/.config/one-layer/config.json"
      - name: Stage canonical hosted E0003 filename
        run: |
          set -euo pipefail
          mkdir -p /tmp/old-submissions/e0003
          cp experiments/one_layer_deeper/e0003_context_reinject.py /tmp/old-submissions/e0003/submission.py
      - name: Hosted H100 E0003 E1
        run: |
          set -o pipefail
          one-layer submit /tmp/old-submissions/e0003/submission.py --tier easy --dataset e1 --wait | tee experiments/one_layer_deeper/hosted_e0003_e1.log
      - uses: actions/upload-artifact@v4
        with:
          name: one-layer-deeper-hosted-e0003-e1-${{ github.sha }}
          path: experiments/one_layer_deeper/hosted_e0003_e1.log
