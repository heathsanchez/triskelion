name: V89 Contextual Constructor Confirmation
on:
  push:
    branches: [v89-contextual-constructor-confirmation]
jobs:
  v89:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pytest pytest-timeout
      - name: Fetch frozen QuixBugs
        run: |
          git clone -q https://github.com/jkoppel/QuixBugs /tmp/QuixBugs
          cd /tmp/QuixBugs
          git checkout -q 4257f44b0ff1181dedaedee6a447e133219fcebf
      - name: Run V89
        env:
          QUIXBUGS_DIR: /tmp/QuixBugs
          OUT_DIR: results/v89
        run: python experiments/METALOGIC_V89_CONTEXTUAL_CONSTRUCTOR_CONFIRMATION.py
      - uses: actions/upload-artifact@v4
        with:
          name: v89-contextual-constructor-confirmation
          path: results/v89/RESULT.json
