name: V91 Verifier-Induced Site Ontology
on:
  push:
    branches: [v91-verifier-induced-site-ontology]
jobs:
  v91:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pytest pytest-timeout
      - name: Fetch frozen QuixBugs
        run: |
          git clone -q https://github.com/jkoppel/QuixBugs /tmp/QuixBugs
          cd /tmp/QuixBugs
          git checkout -q 4257f44b0ff1181dedaedee6a447e133219fcebf
      - name: Run V91
        env:
          QUIXBUGS_DIR: /tmp/QuixBugs
          OUT_DIR: results/v91
        run: python experiments/METALOGIC_V91_VERIFIER_INDUCED_SITE_ONTOLOGY.py
      - uses: actions/upload-artifact@v4
        with:
          name: v91-verifier-induced-site-ontology
          path: results/v91/RESULT.json
