name: Lean Kernel Arena probe search

on:
  push:
    branches: [agent/lean-kernel-arena-probe-search]
  workflow_dispatch:

jobs:
  probe-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Sweep conversion probe cap
        shell: bash
        run: |
          set -euo pipefail
          SOKO_REV=0fab8874080e379a774a9a27f7538d8a1ddd786b
          ARENA_ARTIFACT=8931227426
          OUT=results/probe-search
          rm -rf "$OUT" soko arena-tests artifact tests.zip
          mkdir -p "$OUT" arena-tests artifact

          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/${ARENA_ARTIFACT}/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests

          git clone https://github.com/intgrah/sokonanoda.git soko
          git -C soko checkout "$SOKO_REV"
          cat > soko/config.json <<'JSON'
          {
            "use_stdin": true,
            "nat_extension": true,
            "string_extension": true,
            "unpermitted_axiom_hard_error": false,
            "unsafe_permit_all_axioms": true,
            "num_threads": 4
          }
          JSON

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('arena-tests')
          fs=list((root/'good').rglob('*.ndjson'))+list((root/'bad').rglob('*.ndjson'))
          largest=sorted(fs,key=lambda p:p.stat().st_size,reverse=True)[:24]
          largest=sorted(largest,key=lambda p:hashlib.sha256(str(p.relative_to(root)).encode()).hexdigest())
          Path('results/probe-search/workload.txt').write_text('\n'.join(str(p) for p in largest)+'\n')
          Path('results/probe-search/workload.json').write_text(json.dumps([
              {'path':str(p.relative_to(root)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
              for p in largest],indent=2))
          PY

          cp soko/src/conv.rs /tmp/conv.rs.orig
          mkdir -p "$OUT/bin"
          for n in 256 512 1024 2048 4096 8192; do
            cp /tmp/conv.rs.orig soko/src/conv.rs
            python3 - "$n" <<'PY'
          from pathlib import Path
          import sys
          n=sys.argv[1]
          p=Path('soko/src/conv.rs'); s=p.read_text()
          old='const PROBE_CAP: u32 = 2048;'
          assert old in s
          p.write_text(s.replace(old,f'const PROBE_CAP: u32 = {n};',1))
          PY
            (cd soko && RUSTFLAGS='-C target-cpu=native' cargo build --release)
            cp soko/target/release/sokonanoda "$OUT/bin/probe-${n}"
          done
          cp /tmp/conv.rs.orig soko/src/conv.rs

          python3 - <<'PY'
          from pathlib import Path
          import subprocess,time,json,statistics,random
          root=Path.cwd(); out=root/'results/probe-search'; cfg=root/'soko/config.json'
          variants=['256','512','1024','2048','4096','8192']
          bins={n:out/'bin'/f'probe-{n}' for n in variants}
          workload=[Path(x) for x in (out/'workload.txt').read_text().splitlines()]
          def status(rc): return 'accept' if rc==0 else ('decline' if rc==2 else 'reject')
          cases=[]
          for kind,exp in [('good','accept'),('bad','reject')]:
              for p in (root/'arena-tests'/kind).rglob('*.ndjson'): cases.append((p,exp))
          correctness={}
          for n,exe in bins.items():
              bad=[]
              for p,exp in cases:
                  with p.open('rb') as f:
                      rc=subprocess.run([str(exe),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
                  if status(rc)!=exp: bad.append({'file':str(p.relative_to(root/'arena-tests')),'expected':exp,'got':status(rc),'rc':rc})
              correctness[n]={'correct':len(cases)-len(bad),'total':len(cases),'failures':bad}
          samples={n:[] for n in variants}
          for seed in range(8):
              order=variants.copy(); random.Random(seed).shuffle(order)
              for n in order:
                  t=time.perf_counter()
                  for p in workload:
                      with p.open('rb') as f:
                          subprocess.run([str(bins[n]),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,check=False)
                  samples[n].append(time.perf_counter()-t)
          med={n:statistics.median(v) for n,v in samples.items()}
          base=med['2048']; winner=min(med,key=med.get)
          summary={
              'correctness':correctness,
              'samples_seconds':samples,
              'median_seconds':med,
              'speedup_vs_probe2048':{n:base/v for n,v in med.items()},
              'winner':winner,
              'winner_speedup_vs_probe2048':base/med[winner]
          }
          (out/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          print(json.dumps(summary,indent=2,sort_keys=True))
          if any(v['correct']!=v['total'] for v in correctness.values()): raise SystemExit('correctness regression')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-kernel-arena-probe-search
          path: results/probe-search/
