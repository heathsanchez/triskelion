name: Lean Kernel Arena lazy environment

on:
  push:
    branches: [agent/lean-kernel-arena-lazy-env]
  workflow_dispatch:

jobs:
  lazy-env:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare eager pruning with full environment capture
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
          SOKO_REV=0fab8874080e379a774a9a27f7538d8a1ddd786b
          ARENA_ARTIFACT=8931227426
          OUT=results/lazy-env
          rm -rf "$OUT" soko arena-tests artifact tests.zip
          mkdir -p "$OUT/bin" arena-tests artifact

          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/${ARENA_ARTIFACT}/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
          git clone https://github.com/intgrah/sokonanoda.git soko
          git -C soko checkout "$SOKO_REV"
          cat > soko/config.json <<'JSON'
          {
            "use_stdin": true,
            "nat_extension": true,
            "string_extension": true,
            "unpermitted_axiom_hard_error": false,
            "unsafe_permit_all_axioms": true,
            "num_threads": 4
          }
          JSON

          cp soko/src/eval.rs /tmp/eval.orig
          (cd soko && RUSTFLAGS='-C target-cpu=x86-64' cargo build --release)
          cp soko/target/release/sokonanoda "$OUT/bin/baseline"

          python3 - <<'PY'
          from pathlib import Path
          p=Path('soko/src/eval.rs'); s=p.read_text()
          old='''    #[inline]\n    pub(crate) fn key_env(&mut self, env: E<'t>, e: ExprPtr<'t>) -> E<'t> {\n        let k = e.num_loose_bvars();\n        if k == 0 {\n            return self.lsub_base(env.lsub());\n        }\n        if k > 64 {\n            return env;\n        }\n        self.prune_env(env, e.as_ref().fv_mask())\n    }'''
          new='''    #[inline]\n    pub(crate) fn key_env(&mut self, env: E<'t>, e: ExprPtr<'t>) -> E<'t> {\n        if e.num_loose_bvars() == 0 {\n            return self.lsub_base(env.lsub());\n        }\n        env\n    }'''
          assert old in s, 'key_env source drifted'
          p.write_text(s.replace(old,new,1))
          PY
          (cd soko && RUSTFLAGS='-C target-cpu=x86-64' cargo build --release)
          cp soko/target/release/sokonanoda "$OUT/bin/lazy"
          diff -u /tmp/eval.orig soko/src/eval.rs > "$OUT/lazy.patch" || true

          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,hashlib
          root=Path.cwd(); out=root/'results/lazy-env'; cfg=root/'soko/config.json'
          def status(rc): return 'accept' if rc==0 else ('decline' if rc==2 else 'reject')
          cases=[]
          for kind,exp in [('good','accept'),('bad','reject')]:
              for p in (root/'arena-tests'/kind).rglob('*.ndjson'): cases.append((p,exp))
          correctness={}
          for name in ['baseline','lazy']:
              exe=out/'bin'/name; bad=[]
              for p,exp in cases:
                  with p.open('rb') as f:
                      rc=subprocess.run([str(exe),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
                  got=status(rc)
                  if got!=exp: bad.append({'file':str(p.relative_to(root/'arena-tests')),'expected':exp,'got':got,'rc':rc})
              correctness[name]={'correct':len(cases)-len(bad),'total':len(cases),'failures':bad}
          (out/'correctness.json').write_text(json.dumps(correctness,indent=2,sort_keys=True)); print(json.dumps(correctness,indent=2,sort_keys=True))
          if any(v['correct']!=v['total'] for v in correctness.values()): raise SystemExit('correctness regression')

          fs=list((root/'arena-tests'/'good').rglob('*.ndjson'))
          chosen=sorted(fs,key=lambda p:p.stat().st_size,reverse=True)[:3]
          (out/'cases.txt').write_text('\n'.join(str(p) for p in chosen)+'\n')
          (out/'cases.json').write_text(json.dumps([{'path':str(p.relative_to(root/'arena-tests')),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in chosen],indent=2))
          PY

          : > "$OUT/raw.tsv"
          for variant in baseline lazy; do
            i=0
            while read -r f; do
              i=$((i+1))
              cg="$OUT/callgrind-${variant}-${i}.out"
              set +e
              valgrind --tool=callgrind --quiet --callgrind-out-file="$cg" "$OUT/bin/$variant" soko/config.json < "$f" >/dev/null 2>"$OUT/${variant}-${i}.stderr"
              rc=$?
              set -e
              test "$rc" -eq 0
              ir=$(awk '/^summary:/ {print $2; exit}' "$cg")
              printf '%s\t%s\t%s\t%s\n' "$variant" "$i" "$ir" "$f" | tee -a "$OUT/raw.tsv"
            done < "$OUT/cases.txt"
          done

          python3 - <<'PY'
          from pathlib import Path
          import json
          out=Path('results/lazy-env'); rows=[]
          for line in (out/'raw.tsv').read_text().splitlines():
              v,i,ir,f=line.split('\t',3); rows.append({'variant':v,'case':int(i),'instructions':int(ir),'file':f})
          totals={v:sum(r['instructions'] for r in rows if r['variant']==v) for v in ['baseline','lazy']}
          b=totals['baseline']; l=totals['lazy']
          summary={'rows':rows,'total_instructions':totals,'lazy_ratio':l/b,'instruction_reduction_percent':(1-l/b)*100}
          (out/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)); print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-kernel-arena-lazy-env
          path: results/lazy-env/
