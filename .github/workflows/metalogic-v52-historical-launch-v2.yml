name: Metalogic V52 Historical Ratchet V2
on:
  push:
    paths:
      - '.github/workflows/metalogic-v52-historical-launch-v2.yml'
  workflow_dispatch:
jobs:
  v52:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v52-historical-bugs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q uv
      - run: |
          git clone -q https://github.com/soarsmu/BugsInPy.git /tmp/BugsInPy
          cd /tmp/BugsInPy && git checkout -q 11c5f1eea954a42132cfd06bf257766a7963e0fd
          chmod +x /tmp/BugsInPy/framework/bin/*
      - name: Patch infrastructure adapters only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('experiments/METALOGIC_V52_HISTORICAL_BUG_RATCHET.py')
          s=p.read_text()
          a="rc,out=run(f'uv python install {pyver} && uv venv --python {pyver} .v52env',cwd=repo,timeout=240)"
          b="pyline='.'.join(pyver.split('.')[:2]); rc,out=run(f'uv python install {pyline} && uv venv --seed --python {pyline} .v52env',cwd=repo,timeout=240)"
          assert a in s; s=s.replace(a,b)
          a2="except subprocess.TimeoutExpired as e:\n        return 124,(e.stdout or '')+(e.stderr or '')"
          b2="except subprocess.TimeoutExpired as e:\n        a=e.stdout or b''; b=e.stderr or b''\n        if isinstance(a,str): a=a.encode()\n        if isinstance(b,str): b=b.encode()\n        return 124,(a+b).decode(errors='replace')"
          assert a2 in s; p.write_text(s.replace(a2,b2))
          PY
      - run: python experiments/METALOGIC_V52_HISTORICAL_BUG_RATCHET.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-v52-historical-v2
          path: artifacts/v52/
