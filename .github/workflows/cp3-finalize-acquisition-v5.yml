name: CP3 finalize acquisition capability v5

on:
  workflow_dispatch:
  push:
    branches:
      - cp3-canonical-demo-20260815
    paths:
      - cp3/finalize_acquisition_from_v4.py
      - .github/workflows/cp3-finalize-acquisition-v5.yml

permissions:
  contents: read
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout canonical demo branch
        uses: actions/checkout@v4

      - name: Checkout sealed CP1 source branch
        uses: actions/checkout@v4
        with:
          ref: private/verified-capability-runtime-cp1
          path: cp1source

      - name: Download the exact V4 diagnostic artifact
        uses: actions/download-artifact@v4
        with:
          name: cp3-acquisition-prevalidation-diagnostic-v4
          path: diag
          repository: heathsanchez/triskelion
          run-id: 31881546140
          github-token: ${{ github.token }}

      - name: Recover and hash exact sealed CP1 runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cp1runtime cp3_freeze
          unzip -q cp1source/private_runtime/TRISKELION_VERIFIED_CAPABILITY_RUNTIME_CHECKPOINT_1_READY.zip -d cp1runtime
          test -f cp1runtime/triskelion/runtime.py
          test -f cp1runtime/triskelion/registry.py
          test -f cp1runtime/triskelion/scope.py
          find cp1runtime/triskelion -maxdepth 1 -type f -name '*.py' -print0 \
            | sort -z | xargs -0 sha256sum > cp3_freeze/RUNTIME_SOURCE_SHA256SUMS.txt
          sha256sum cp3_freeze/RUNTIME_SOURCE_SHA256SUMS.txt | awk '{print $1}' \
            > cp3_freeze/RUNTIME_SOURCE_SHA256.txt

      - name: Hash-lock and finalize acquisition capability
        shell: bash
        run: |
          set -euo pipefail
          python cp3/finalize_acquisition_from_v4.py \
            diag/acquisition/MODEL_RESPONSE_RAW.txt \
            diag/acquisition/PREVALIDATION_PARSED_RESPONSE.json \
            cp3_freeze/acquisition
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('cp3_freeze')
          manifest = {
              'canonical_id': 'TRISKELION_CP3_FREEZE_MANIFEST_V1',
              'status': 'FROZEN',
              'protocol': 'TRISKELION_CP3_ACQUISITION_FREEZE_V1',
              'source_workflow_run_id': 31881546140,
              'source_artifact_id': 9246154368,
              'normalization': 'hash-locked same-response schema recovery only',
              'acquisition_cases': ['httpie/5', 'youtube-dl/32'],
              'protected_cases_opened': False,
              'capability_sha256': (root/'acquisition'/'CAPABILITY_SHA256.txt').read_text().strip(),
              'runtime_source_sha256': (root/'RUNTIME_SOURCE_SHA256.txt').read_text().strip(),
              'runtime_source_commit': '591c7d0119251699d33f908afe54de6f2cc77945',
              'freeze_rule': 'No semantic changes after this artifact before protected four-arm evaluation.',
          }
          text = json.dumps(manifest, indent=2, sort_keys=True) + '\n'
          (root/'FREEZE_MANIFEST.json').write_text(text)
          (root/'FREEZE_MANIFEST_SHA256.txt').write_text(hashlib.sha256(text.encode()).hexdigest()+'\n')
          print(text)
          PY

      - name: Upload final frozen acquisition artifact
        uses: actions/upload-artifact@v4
        with:
          name: cp3-acquisition-capability-final-v5
          path: cp3_freeze/
          retention-days: 90
          if-no-files-found: error
