name: Lean Kernel Arena parser fallback

on:
  push:
    branches: [agent/lean-kernel-arena-parser-fallback]

jobs:
  parser-fallback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Instrument fast parser fallback
        shell: bash
        run: |
          set -euo pipefail
          SOKO_REV=0fab8874080e379a774a9a27f7538d8a1ddd786b
          ARENA_ARTIFACT=8931227426
          OUT=results/parser-fallback
          rm -rf "$OUT" soko arena-tests artifact tests.zip
          mkdir -p "$OUT" arena-tests artifact
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/${ARENA_ARTIFACT}/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
          git clone https://github.com/intgrah/sokonanoda.git soko
          git -C soko checkout "$SOKO_REV"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('soko/src/parser.rs')
          s=p.read_text()
          start=s.index('    #[inline(never)]\n    fn run_over(&mut self, input: &[u8])')
          end=s.index('\n    fn finish(self)', start)
          f=s[start:end]
          f=f.replace('        let mut pos = 0;\n', '        let mut pos = 0;\n        let mut fast_lines: u64 = 0;\n        let mut fallback_lines: u64 = 0;\n', 1)
          f=f.replace('                Ok(next) => next,\n', '                Ok(next) => { fast_lines += 1; next },\n', 1)
          f=f.replace('                Err(FastError::Fallback) => match self.slow_line(input, pos) {\n', '                Err(FastError::Fallback) => {\n                    fallback_lines += 1;\n                    match self.slow_line(input, pos) {\n', 1)
          f=f.replace('                    Err(e) => break Err(e),\n                },\n', '                    Err(e) => break Err(e),\n                    }\n                },\n', 1)
          f=f.replace('        self.scratch_idxs = idxs;\n', '        eprintln!("PARSER_COUNTS fast={} fallback={}", fast_lines, fallback_lines);\n        self.scratch_idxs = idxs;\n', 1)
          s=s[:start]+f+s[end:]
          p.write_text(s)
          PY
          (cd soko && RUSTFLAGS='-C target-cpu=native' cargo build --release)
          cat > "$OUT/config.json" <<'JSON'
          {
            "use_stdin": true,
            "nat_extension": true,
            "string_extension": true,
            "unpermitted_axiom_hard_error": false,
            "unsafe_permit_all_axioms": true,
            "num_threads": 2,
            "parse_only": true
          }
          JSON
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess,re
          root=Path.cwd(); out=root/'results/parser-fallback'
          fs=list((root/'arena-tests'/'good').rglob('*.ndjson'))+list((root/'arena-tests'/'bad').rglob('*.ndjson'))
          fs=sorted(fs,key=lambda p:p.stat().st_size,reverse=True)[:24]
          fs=sorted(fs,key=lambda p:hashlib.sha256(str(p.relative_to(root/'arena-tests')).encode()).hexdigest())
          exe=root/'soko/target/release/sokonanoda'; cfg=out/'config.json'
          rows=[]; tf=tb=0
          pat=re.compile(r'PARSER_COUNTS fast=(\d+) fallback=(\d+)')
          for p in fs:
              with p.open('rb') as f:
                  r=subprocess.run([str(exe),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
              text=r.stderr.decode('utf-8','replace')
              m=pat.search(text)
              if not m: raise SystemExit(f'no parser counts for {p}: {text[:500]}')
              a,b=map(int,m.groups()); tf+=a; tb+=b
              rows.append({'path':str(p.relative_to(root/'arena-tests')),'bytes':p.stat().st_size,'fast_lines':a,'fallback_lines':b,'fallback_fraction':b/(a+b) if a+b else 0,'rc':r.returncode})
          summary={'fast_lines':tf,'fallback_lines':tb,'fallback_fraction':tb/(tf+tb) if tf+tb else 0,'rows':rows}
          (out/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-kernel-arena-parser-fallback
          path: results/parser-fallback/
