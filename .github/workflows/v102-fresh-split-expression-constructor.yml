name: V102 Fresh-Split Expression Constructor
on:
  push:
    branches: [v102-fresh-split-expression-constructor]
jobs:
  v102:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pytest pytest-timeout
      - name: Fetch frozen QuixBugs
        run: |
          git clone -q https://github.com/jkoppel/QuixBugs.git /tmp/QuixBugs
          cd /tmp/QuixBugs && git checkout -q 4257f44b0ff1181dedaedee6a447e133219fcebf
      - name: Run V102
        env:
          QUIXBUGS_ROOT: /tmp/QuixBugs
          OUT_DIR: results/v102
        run: python experiments/METALOGIC_V102_FRESH_SPLIT_EXPRESSION_CONSTRUCTOR.py
      - uses: actions/upload-artifact@v4
        with:
          name: v102-fresh-split-expression-constructor
          path: results/v102/RESULT.json
