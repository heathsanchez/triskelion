name: Metalogic External Algebra
on:
  push:
    paths:
      - '.github/workflows/metalogic-external-chunk-v30.yml'
      - 'experiments/METALOGIC_EXTERNAL_LAW_MINER_V32.py'
  workflow_dispatch:
jobs:
  v32:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run external law miner
        run: python experiments/METALOGIC_EXTERNAL_LAW_MINER_V32.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-external-law-miner-v32
          path: artifacts/external_law_miner_v32/
