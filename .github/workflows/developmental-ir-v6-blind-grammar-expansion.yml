name: Developmental IR V6 Blind Grammar Expansion

on:
  push:
    branches:
      - experiment/developmental-ir-v6-blind-grammar-expansion
    paths:
      - 'experiments/developmental_ir_v6_blind_grammar_expansion.py'
      - 'protocols/DEVELOPMENTAL_IR_V6_BLIND_GRAMMAR_EXPANSION_PRECOMMIT.md'
      - 'protocols/DEVELOPMENTAL_IR_V6_BLIND_GRAMMAR_EXPANSION_ADDENDUM.md'
      - '.github/workflows/developmental-ir-v6-blind-grammar-expansion.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: developmental-ir-v6-blind-grammar-expansion
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/developmental-ir-v6-blind-grammar-expansion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify prospective freeze ancestry
        run: |
          git merge-base --is-ancestor faf5bd25e674a03a688b41e142f7e3bf20e49358 HEAD
          git merge-base --is-ancestor 10ab9497cc96f3e918fec65c9434b274a4c97793 HEAD
          test -f protocols/DEVELOPMENTAL_IR_V6_BLIND_GRAMMAR_EXPANSION_PRECOMMIT.md
          test -f protocols/DEVELOPMENTAL_IR_V6_BLIND_GRAMMAR_EXPANSION_ADDENDUM.md
          test -f experiments/developmental_ir_v6_blind_grammar_expansion.py

      - name: Run blind grammar expansion
        run: |
          set -o pipefail
          PYTHONPATH=. python experiments/developmental_ir_v6_blind_grammar_expansion.py | tee /tmp/developmental-ir-v6-blind-grammar-expansion.log

      - name: Validate scientific result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('results/developmental_ir_v6_blind_grammar_expansion/result.json').read_text())
          assert p['protocol']=='DEVELOPMENTAL_IR_V6_BLIND_GRAMMAR_EXPANSION'
          assert p['precommit_commit']=='faf5bd25e674a03a688b41e142f7e3bf20e49358'
          assert p['addendum_commit']=='10ab9497cc96f3e918fec65c9434b274a4c97793'
          assert len(p['headline_gates'])==30
          assert p['verdict'] in {
              'PASS_DEVELOPMENTAL_IR_V6_BLIND_GRAMMAR_EXPANSION',
              'PARTIAL_DEVELOPMENTAL_IR_V6_BLIND_GRAMMAR_EXPANSION',
              'VALID_NEGATIVE_DEVELOPMENTAL_IR_V6_BLIND_GRAMMAR_EXPANSION',
          }
          print('SCIENTIFIC_VERDICT='+p['verdict'])
          print(json.dumps(p['language_counts'],indent=2,sort_keys=True))
          print(json.dumps(p['first_encounter'],indent=2,sort_keys=True))
          print(json.dumps(p['first_install'],indent=2,sort_keys=True))
          print(json.dumps(p['costs'],indent=2,sort_keys=True))
          print(json.dumps(p['learning'],indent=2,sort_keys=True))
          print(json.dumps(p['portability'],indent=2,sort_keys=True))
          print(json.dumps(p['headline_gates'],indent=2,sort_keys=True))
          PY

      - name: Commit authoritative result
        run: |
          git config user.name 'mathgraph-bot'
          git config user.email '32909488+heathsanchez@users.noreply.github.com'
          git add             results/developmental_ir_v6_blind_grammar_expansion/result.json             results/developmental_ir_v6_blind_grammar_expansion/summary.json
          git commit -m 'Record developmental IR V6 blind grammar expansion result' || exit 0
          git push origin HEAD:experiment/developmental-ir-v6-blind-grammar-expansion

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: developmental-ir-v6-blind-grammar-expansion-evidence
          path: |
            results/developmental_ir_v6_blind_grammar_expansion/result.json
            results/developmental_ir_v6_blind_grammar_expansion/summary.json
            /tmp/developmental-ir-v6-blind-grammar-expansion.log
          if-no-files-found: warn
