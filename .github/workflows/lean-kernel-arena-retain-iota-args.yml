name: Lean Kernel Arena retain iota args

on:
  push:
    branches: [agent/lean-kernel-arena-retain-iota-args]

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare recomputed and retained nested iota args
        shell: bash
        run: |
          set -euo pipefail
          SOKO_REV=0fab8874080e379a774a9a27f7538d8a1ddd786b
          ARENA_ARTIFACT=8931227426
          OUT=results/retain-iota-args
          rm -rf "$OUT" base retain arena-tests artifact tests.zip
          mkdir -p "$OUT" arena-tests artifact
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/${ARENA_ARTIFACT}/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
          git clone https://github.com/intgrah/sokonanoda.git base
          git -C base checkout "$SOKO_REV"
          cp -a base retain
          python3 - <<'PY'
          from pathlib import Path
          p=Path('retain/src/eval.rs'); s=p.read_text()
          s=s.replace("    Descend(V<'a>),","    Descend(V<'a>, SpineArgs<'a>),",1)
          s=s.replace("        let mut waiting: Vec<V<'t>> = Vec::new();","        let mut waiting: Vec<(V<'t>, SpineArgs<'t>)> = Vec::new();",1)
          s=s.replace("                ForceStep::Descend(major) => {\n                    waiting.push(cur);\n                    cur = major;\n                    continue;\n                }","                ForceStep::Descend(major, args) => {\n                    waiting.push((cur, args));\n                    cur = major;\n                    continue;\n                }",1)
          s=s.replace("                    Some(rec_val) => {\n                        let key = rec_val as *const Value<'t> as usize;\n                        match self.fire_value(depth, rec_val, cur) {","                    Some((rec_val, args)) => {\n                        let key = rec_val as *const Value<'t> as usize;\n                        match self.fire_value_with_args(depth, rec_val, &args, cur) {",1)
          s=s.replace("                    return ForceStep::Descend(major_h);","                    return ForceStep::Descend(major_h, args);",1)
          s=s.replace("                    return ForceStep::Descend(major_h);","                    return ForceStep::Descend(major_h, args);",1)
          marker="    fn fire_value(&mut self, depth: u32, rec_val: V<'t>, major: V<'t>) -> Option<V<'t>> {"
          helper="    fn fire_value_with_args(&mut self, depth: u32, rec_val: V<'t>, args: &[V<'t>], major: V<'t>) -> Option<V<'t>> {\n        match rec_val {\n            Value::Rigid { head: RigidHead::Recursor(name, levels), .. } => {\n                let rec = self.env.get_recursor(name)?;\n                if args.len() <= rec.major_idx() { return None; }\n                self.fire_recursor(depth, &rec, *levels, args, major)\n            }\n            Value::Rigid { head: RigidHead::QuotConst(name, _), .. } => self.fire_quot(depth, *name, args, major),\n            _ => None,\n        }\n    }\n\n"
          assert marker in s
          s=s.replace(marker,helper+marker,1)
          p.write_text(s)
          PY
          cat > base/config.json <<'JSON'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":2}
          JSON
          cp base/config.json retain/config.json
          (cd base && RUSTFLAGS='-C target-cpu=native' cargo build --release)
          (cd retain && RUSTFLAGS='-C target-cpu=native' cargo build --release)
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,time,json,statistics,random,hashlib
          root=Path.cwd(); out=root/'results/retain-iota-args'
          bins={'base':root/'base/target/release/sokonanoda','retain':root/'retain/target/release/sokonanoda'}
          cfgs={'base':root/'base/config.json','retain':root/'retain/config.json'}
          def status(rc): return 'accept' if rc==0 else ('decline' if rc==2 else 'reject')
          cases=[]
          for kind,exp in [('good','accept'),('bad','reject')]:
              for p in (root/'arena-tests'/kind).rglob('*.ndjson'): cases.append((p,exp))
          correctness={}
          for v,e in bins.items():
              bad=[]
              for p,exp in cases:
                  with p.open('rb') as f: rc=subprocess.run([str(e),str(cfgs[v])],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
                  if status(rc)!=exp: bad.append({'file':str(p.relative_to(root/'arena-tests')),'expected':exp,'got':status(rc),'rc':rc})
              correctness[v]={'correct':len(cases)-len(bad),'total':len(cases),'failures':bad}
          workload=sorted([p for p,_ in cases],key=lambda p:p.stat().st_size,reverse=True)[:24]
          workload=sorted(workload,key=lambda p:hashlib.sha256(str(p.relative_to(root/'arena-tests')).encode()).hexdigest())
          samples={v:[] for v in bins}
          for seed in range(18):
              order=list(bins); random.Random(seed).shuffle(order)
              for v in order:
                  t=time.perf_counter()
                  for p in workload:
                      with p.open('rb') as f: subprocess.run([str(bins[v]),str(cfgs[v])],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,check=False)
                  samples[v].append(time.perf_counter()-t)
          med={v:statistics.median(xs) for v,xs in samples.items()}
          summary={'correctness':correctness,'median_seconds':med,'samples_seconds':samples,'speedup_retain_vs_base':med['base']/med['retain']}
          (out/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)); print(json.dumps(summary,indent=2,sort_keys=True))
          if any(x['correct']!=x['total'] for x in correctness.values()): raise SystemExit('correctness regression')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-kernel-arena-retain-iota-args
          path: results/retain-iota-args/
