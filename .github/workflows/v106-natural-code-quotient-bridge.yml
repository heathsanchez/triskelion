name: V106 Natural Code Quotient Bridge
on:
  push:
    paths:
      - 'protocols/V106_NATURAL_CODE_QUOTIENT_BRIDGE_PRECOMMIT.md'
      - 'experiments/V106_NATURAL_CODE_QUOTIENT_BRIDGE.py'
      - '.github/workflows/v106-natural-code-quotient-bridge.yml'
  workflow_dispatch:

jobs:
  v106:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verifier dependencies
        run: python -m pip install pytest pytest-timeout
      - name: Run frozen natural-code quotient bridge
        run: python experiments/V106_NATURAL_CODE_QUOTIENT_BRIDGE.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v106-natural-code-quotient-bridge
          path: artifacts/v106_natural_code_quotient/
