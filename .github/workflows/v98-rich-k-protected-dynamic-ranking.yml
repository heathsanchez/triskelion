name: V98 Rich-K Protected Dynamic Ranking
on:
  push:
    branches: [v98-rich-k-protected-dynamic-ranking]
jobs:
  v98:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pytest pytest-timeout
      - name: Fetch frozen QuixBugs
        run: |
          git clone -q https://github.com/jkoppel/QuixBugs.git /tmp/QuixBugs
          cd /tmp/QuixBugs
          git checkout -q 4257f44b0ff1181dedaedee6a447e133219fcebf
      - name: Run V98
        env:
          QUIXBUGS_DIR: /tmp/QuixBugs
          OUT_DIR: results/v98
        run: python experiments/METALOGIC_V98_RICH_K_PROTECTED_DYNAMIC_RANKING.py
      - uses: actions/upload-artifact@v4
        with:
          name: v98-rich-k-protected-dynamic-ranking
          path: results/v98/RESULT.json
