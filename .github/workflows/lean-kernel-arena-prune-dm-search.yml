name: Lean Kernel Arena prune-DM search

on:
  push:
    branches: [agent/lean-kernel-arena-prune-dm-search]

jobs:
  prune-dm-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Sweep prune direct-map capacity
        shell: bash
        run: |
          set -euo pipefail
          SOKO_REV=0fab8874080e379a774a9a27f7538d8a1ddd786b
          ARENA_ARTIFACT=8931227426
          OUT=results/prune-dm-search
          rm -rf "$OUT" soko arena-tests artifact tests.zip
          mkdir -p "$OUT/bin" arena-tests artifact
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/${ARENA_ARTIFACT}/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
          git clone https://github.com/intgrah/sokonanoda.git soko
          git -C soko checkout "$SOKO_REV"
          cat > soko/config.json <<'JSON'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":2}
          JSON
          cp soko/src/util.rs /tmp/util.orig
          for bits in 8 10 12 14; do
            cp /tmp/util.orig soko/src/util.rs
            python3 - "$bits" <<'PY'
          from pathlib import Path
          import sys
          b=int(sys.argv[1]); p=Path('soko/src/util.rs'); s=p.read_text()
          s=s.replace('pub(crate) const PRUNE_DM_LEN: usize = 1 << 10;', f'pub(crate) const PRUNE_DM_LEN: usize = 1 << {b};',1)
          s=s.replace('pub(crate) const PRUNE_DM_SHIFT: u32 = 64 - 10;', f'pub(crate) const PRUNE_DM_SHIFT: u32 = 64 - {b};',1)
          s=s.replace('pub(crate) prune_dm: Box<[(usize, u64, Option<E<\'a>>); PRUNE_DM_LEN]>,', 'pub(crate) prune_dm: Box<[(usize, u64, Option<E<\'a>>); PRUNE_DM_LEN]>,',1)
          s=s.replace('prune_dm: Box::new([(0, 0, None); PRUNE_DM_LEN]),', 'prune_dm: vec![(0, 0, None); PRUNE_DM_LEN].into_boxed_slice().try_into().ok().unwrap(),',1)
          p.write_text(s)
          PY
            (cd soko && RUSTFLAGS='-C target-cpu=native' cargo build --release)
            cp soko/target/release/sokonanoda "$OUT/bin/dm-${bits}"
          done
          cp /tmp/util.orig soko/src/util.rs
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,time,json,statistics,random,hashlib
          root=Path.cwd(); out=root/'results/prune-dm-search'; cfg=root/'soko/config.json'
          vars=['8','10','12','14']; bins={v:out/'bin'/f'dm-{v}' for v in vars}
          def status(rc): return 'accept' if rc==0 else ('decline' if rc==2 else 'reject')
          cases=[]
          for kind,exp in [('good','accept'),('bad','reject')]:
              for p in (root/'arena-tests'/kind).rglob('*.ndjson'): cases.append((p,exp))
          correctness={}
          for v,e in bins.items():
              bad=[]
              for p,exp in cases:
                  with p.open('rb') as f: rc=subprocess.run([str(e),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
                  if status(rc)!=exp: bad.append({'file':str(p.relative_to(root/'arena-tests')),'expected':exp,'got':status(rc),'rc':rc})
              correctness[v]={'correct':len(cases)-len(bad),'total':len(cases),'failures':bad}
          fs=[p for p,_ in cases]
          workload=sorted(fs,key=lambda p:p.stat().st_size,reverse=True)[:24]
          workload=sorted(workload,key=lambda p:hashlib.sha256(str(p.relative_to(root/'arena-tests')).encode()).hexdigest())
          samples={v:[] for v in vars}
          for seed in range(10):
              order=vars.copy(); random.Random(seed).shuffle(order)
              for v in order:
                  t=time.perf_counter()
                  for p in workload:
                      with p.open('rb') as f: subprocess.run([str(bins[v]),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,check=False)
                  samples[v].append(time.perf_counter()-t)
          med={v:statistics.median(x) for v,x in samples.items()}; base=med['10']; winner=min(med,key=med.get)
          summary={'correctness':correctness,'median_seconds':med,'samples_seconds':samples,'speedup_vs_dm1024':{v:base/med[v] for v in vars},'winner_bits':winner,'winner_entries':1<<int(winner),'winner_speedup_vs_dm1024':base/med[winner]}
          (out/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)); print(json.dumps(summary,indent=2,sort_keys=True))
          if any(x['correct']!=x['total'] for x in correctness.values()): raise SystemExit('correctness regression')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-kernel-arena-prune-dm-search
          path: results/prune-dm-search/
