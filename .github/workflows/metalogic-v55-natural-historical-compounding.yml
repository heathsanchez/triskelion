name: Metalogic V55 Natural Historical Compounding
on:
  push:
    branches: [v55-natural-historical-compounding]
    paths:
      - '.github/workflows/metalogic-v55-natural-historical-compounding.yml'
      - 'experiments/METALOGIC_V55_NATURAL_HISTORICAL_COMPOUNDING.py'
      - 'protocols/V55_NATURAL_HISTORICAL_COMPOUNDING_PRECOMMIT.txt'
  workflow_dispatch:
jobs:
  v55:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze BugsInPy corpus
        run: |
          python -m pip install -q uv
          git clone -q https://github.com/soarsmu/BugsInPy.git /tmp/BugsInPy
          cd /tmp/BugsInPy && git checkout -q 11c5f1eea954a42132cfd06bf257766a7963e0fd
          chmod +x /tmp/BugsInPy/framework/bin/*
      - name: Show frozen protocol hashes
        run: sha256sum protocols/V55_NATURAL_HISTORICAL_COMPOUNDING_PRECOMMIT.txt experiments/METALOGIC_V55_NATURAL_HISTORICAL_COMPOUNDING.py
      - name: Run natural historical compounding gate
        run: python experiments/METALOGIC_V55_NATURAL_HISTORICAL_COMPOUNDING.py
      - name: Upload V55 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-v55-natural-historical-compounding
          path: artifacts/v55/
