name: V152 exploration-support separator

on:
  push:
    branches: ["v152-exploration-support-separator"]
    paths:
      - 'protocols/V152_EXPLORATION_SUPPORT_SEPARATOR_PRECOMMIT.md'
      - 'cp3/v152_exploration_provider.py'
      - 'cp3/v152_exploration_support_separator.py'
      - '.github/workflows/v152-exploration-support-separator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v152-exploration-support-separator
  cancel-in-progress: false

jobs:
  separator:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      RIVER_API_KEY: ${{ secrets.RIVER_API_KEY }}
      PYTHONDONTWRITEBYTECODE: "1"
      V145_TEMPLATE_ROOT: /tmp/v152_precompiled_templates
    steps:
      - uses: actions/checkout@v6

      - name: Freeze V152 provenance before outcomes
        run: |
          python -m py_compile cp3/v152_exploration_provider.py cp3/v152_exploration_support_separator.py
          python - <<'PY'
          import hashlib,pathlib
          paths=[
            'protocols/V152_EXPLORATION_SUPPORT_SEPARATOR_PRECOMMIT.md',
            'cp3/v152_exploration_provider.py',
            'cp3/v152_exploration_support_separator.py',
            'cp3/v151_capability_compilation_loss_separator.py',
            'cp3/v149_context_resolver.py',
            'cp3/structured_edit_protocol.py',
            'cp3/structured_edit_protocol_v2.py',
            'cp3/v145_natural_third_rung_causal.py',
            'cp3/v145_precompiled_runner.py',
            'cp3/bugsinpy_exact_runtime.py',
            'cp3/vendor/cp1/triskelion/providers.py']
          for p in paths:
            b=pathlib.Path(p).read_bytes(); print(p,hashlib.sha256(b).hexdigest())
          print('V152_FREEZE_VALID temperature=0.7')
          PY

      - name: Clone official BugsInPy
        run: git clone --depth 1 https://github.com/soarsmu/BugsInPy.git BugsInPy

      - name: Pull exact historical runtimes
        run: |
          docker pull 'python:3.7.3@sha256:9e0b4f32487ca1863b45383420b8db77990debae748e2e875d2f86fa9510d4a5'
          docker pull 'python:3.7.4@sha256:fc0a398e1987fb1e58909053c11630e06adb3df265fe693391779020b9253f5e'

      - name: Install proven provider dependencies
        run: python -m pip install --quiet 'river-client==0.6.1' 'transformers>=4.51,<5'

      - name: Run V152 matched separator
        run: |
          mkdir -p artifacts
          PYTHONPATH="$PWD/cp3:$PWD/cp3/vendor/cp1" python -B cp3/v152_exploration_support_separator.py \
            --bugsinpy "$PWD/BugsInPy" \
            --out "$PWD/artifacts/v152"

      - name: Show fail-closed V152 verdict
        if: always()
        run: |
          if [ -f artifacts/v152/V152_RESULT.json ]; then
            cat artifacts/v152/V152_RESULT.json
          else
            mkdir -p artifacts/v152
            echo '{"verdict":"R10_INCONCLUSIVE","reason":"V152 result artifact missing"}' > artifacts/v152/CONTROLLER_RESULT.json
            cat artifacts/v152/CONTROLLER_RESULT.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v152-exploration-support-separator
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
