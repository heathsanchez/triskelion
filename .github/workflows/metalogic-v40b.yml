name: Metalogic V40b Protected Miner
on:
  push:
    paths:
      - '.github/workflows/metalogic-v40b.yml'
      - 'experiments/METALOGIC_EXTERNAL_PROTECTED_MINER_V40B.py'
      - 'experiments/METALOGIC_SCOPE_UNIQUENESS_V40C.py'
      - 'experiments/METALOGIC_RELATIONAL_SCOPE_CONSTRUCTION_V41.py'
      - 'experiments/METALOGIC_OPAQUE_LABEL_AUDIT_V42.py'
      - 'experiments/METALOGIC_CATEGORY_INDUCTION_V43.py'
  workflow_dispatch:
jobs:
  v43:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run category induction gate
        run: python experiments/METALOGIC_CATEGORY_INDUCTION_V43.py
      - name: Upload V43 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-category-induction-v43
          path: artifacts/v43/
