name: Distinction Theory One-Shot V1

on:
  push:
    branches:
      - experiment/distinction-theory-one-shot-v1
    paths:
      - 'experiments/distinction_theory_one_shot_v1.py'
      - 'protocols/DISTINCTION_THEORY_ONE_SHOT_V1_PRECOMMIT.md'
      - '.github/workflows/distinction-theory-one-shot-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  one-shot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/distinction-theory-one-shot-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify prospective freeze and inputs
        run: |
          git merge-base --is-ancestor e522b0b1ffb9554c4834e8608620ff73c00fd3d3 HEAD
          test -f results/ternary_developmental_nucleus_census_v1/result.json

      - name: Run distinction theory one-shot
        run: |
          set -o pipefail
          python experiments/distinction_theory_one_shot_v1.py \
            results/ternary_developmental_nucleus_census_v1/result.json \
            results/distinction_theory_one_shot_v1 \
            | tee /tmp/distinction-theory-one-shot-v1.log

      - name: Validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('results/distinction_theory_one_shot_v1/result.json').read_text())
          assert p['protocol']=='DISTINCTION_THEORY_ONE_SHOT_V1'
          assert p['precommit_commit']=='e522b0b1ffb9554c4834e8608620ff73c00fd3d3'
          assert p['audit']['total']==256
          assert len(p['representations'])==3
          assert len(p['headline_gates'])==16
          print('SCIENTIFIC_VERDICT='+p['verdict'])
          print('CLASSIFICATION='+p['classification'])
          print('STRENGTH='+p['strength'])
          print(json.dumps({
            'representations':p['representations'],
            'D2_reconstructs_operation_orbit':p['D2_reconstructs_operation_orbit'],
            'audit':p['audit'],
            'gates':p['headline_gates'],
          },indent=2,sort_keys=True))
          PY

      - name: Commit authoritative result
        run: |
          git config user.name mathgraph-bot
          git config user.email 32909488+heathsanchez@users.noreply.github.com
          git add results/distinction_theory_one_shot_v1
          git commit -m 'Record distinction theory one-shot V1 result' || exit 0
          git push origin HEAD:experiment/distinction-theory-one-shot-v1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distinction-theory-one-shot-v1-evidence
          path: |
            results/distinction_theory_one_shot_v1
            /tmp/distinction-theory-one-shot-v1.log
          if-no-files-found: warn
