name: Metalogic V52 Historical Bug Ratchet
on:
  push:
    paths:
      - '.github/workflows/metalogic-v52-historical.yml'
      - 'experiments/METALOGIC_V52_HISTORICAL_BUG_RATCHET.py'
  workflow_dispatch:
jobs:
  v52:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv and BugsInPy corpus
        run: |
          python -m pip install -q uv
          git clone -q https://github.com/soarsmu/BugsInPy.git /tmp/BugsInPy
          cd /tmp/BugsInPy && git checkout -q 11c5f1eea954a42132cfd06bf257766a7963e0fd
          chmod +x /tmp/BugsInPy/framework/bin/*
      - name: Run historical operator ratchet
        run: python experiments/METALOGIC_V52_HISTORICAL_BUG_RATCHET.py
      - name: Upload V52 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-v52-historical
          path: artifacts/v52/
