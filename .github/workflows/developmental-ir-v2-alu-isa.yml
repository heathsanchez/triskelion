name: Developmental IR V2 ALU ISA

on:
  push:
    branches:
      - experiment/developmental-ir-v2-alu-isa
    paths:
      - 'experiments/developmental_ir_v2_alu_isa.py'
      - 'protocols/DEVELOPMENTAL_IR_V2_ALU_ISA_PRECOMMIT.md'
      - 'protocols/DEVELOPMENTAL_IR_V2_ALU_ISA_ADDENDUM.md'
      - '.github/workflows/developmental-ir-v2-alu-isa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: developmental-ir-v2-alu-isa
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/developmental-ir-v2-alu-isa
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify prospective freeze ancestry
        run: |
          git merge-base --is-ancestor f5f2ee06175257689abd53576de95cb114a7bdf1 HEAD
          git merge-base --is-ancestor 88dad81eea32b4c0676a50a9a42b311c5c731a7a HEAD
          test -f protocols/DEVELOPMENTAL_IR_V2_ALU_ISA_PRECOMMIT.md
          test -f protocols/DEVELOPMENTAL_IR_V2_ALU_ISA_ADDENDUM.md
          test -f experiments/developmental_ir_v2_alu_isa.py

      - name: Run exact emergent ALU ISA experiment
        run: |
          set -o pipefail
          PYTHONPATH=. python experiments/developmental_ir_v2_alu_isa.py | tee /tmp/developmental-ir-v2-alu-isa.log

      - name: Validate scientific result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('results/developmental_ir_v2_alu_isa/result.json').read_text())
          assert p['protocol']=='DEVELOPMENTAL_IR_V2_ALU_ISA'
          assert p['precommit_commit']=='f5f2ee06175257689abd53576de95cb114a7bdf1'
          assert p['addendum_commit']=='88dad81eea32b4c0676a50a9a42b311c5c731a7a'
          assert p['universe']['rows']==65536
          assert p['universe']['tasks']==6000
          assert len(p['headline_gates'])==18
          assert p['verdict'] in {
              'PASS_DEVELOPMENTAL_IR_V2_ALU_ISA',
              'PARTIAL_DEVELOPMENTAL_IR_V2_ALU_ISA',
              'VALID_NEGATIVE_DEVELOPMENTAL_IR_V2_ALU_ISA',
          }
          print('SCIENTIFIC_VERDICT='+p['verdict'])
          print(json.dumps(p['totals'],indent=2,sort_keys=True))
          print(json.dumps(p['learning'],indent=2,sort_keys=True))
          print(json.dumps(p['archive'],indent=2,sort_keys=True))
          print(json.dumps(p['controls'],indent=2,sort_keys=True))
          print(json.dumps(p['headline_gates'],indent=2,sort_keys=True))
          PY

      - name: Commit authoritative result
        run: |
          git config user.name 'mathgraph-bot'
          git config user.email '32909488+heathsanchez@users.noreply.github.com'
          git add             results/developmental_ir_v2_alu_isa/result.json             results/developmental_ir_v2_alu_isa/summary.json
          git commit -m 'Record developmental IR V2 ALU ISA result' || exit 0
          git push origin HEAD:experiment/developmental-ir-v2-alu-isa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: developmental-ir-v2-alu-isa-evidence
          path: |
            results/developmental_ir_v2_alu_isa/result.json
            results/developmental_ir_v2_alu_isa/summary.json
            /tmp/developmental-ir-v2-alu-isa.log
          if-no-files-found: warn
