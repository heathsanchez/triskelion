name: Distinction Transport Nucleus V1

on:
  push:
    branches:
      - experiment/distinction-transport-nucleus-v1
    paths:
      - 'experiments/distinction_transport_nucleus_v1.py'
      - 'protocols/DISTINCTION_TRANSPORT_NUCLEUS_V1_PRECOMMIT.md'
      - '.github/workflows/distinction-transport-nucleus-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/distinction-transport-nucleus-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify prospective freeze and inputs
        run: |
          git merge-base --is-ancestor 8d7fd842fad3546cf26bea7bc1d921c2f31fd821 HEAD
          test -f results/ternary_pointed_nucleus_census_v1/result.json
          test -f results/ternary_developmental_nucleus_census_v1/result.json

      - name: Run exact distinction transport census
        run: |
          set -o pipefail
          python experiments/distinction_transport_nucleus_v1.py \
            results/ternary_pointed_nucleus_census_v1/result.json \
            results/ternary_developmental_nucleus_census_v1/result.json \
            results/distinction_transport_nucleus_v1 \
            | tee /tmp/distinction-transport-nucleus-v1.log

      - name: Validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('results/distinction_transport_nucleus_v1/result.json').read_text())
          assert p['protocol']=='DISTINCTION_TRANSPORT_NUCLEUS_V1'
          assert p['precommit_commit']=='8d7fd842fad3546cf26bea7bc1d921c2f31fd821'
          assert p['audit']=={'total':256,'passed':256}
          assert len(p['pareto_keys'])==16
          assert len(p['headline_gates'])==16
          assert len(p['orbits'])==5130
          assert p['verdict'] in {
            'PASS_DISTINCTION_TRANSPORT_NUCLEUS_V1',
            'PARTIAL_DISTINCTION_TRANSPORT_NUCLEUS_V1',
            'VALID_NEGATIVE_DISTINCTION_TRANSPORT_NUCLEUS_V1',
          }
          print('SCIENTIFIC_VERDICT='+p['verdict'])
          print(json.dumps({
            'classification':p['classification'],
            'correlations':p['correlations'],
            'pareto_enrichment':p['pareto_enrichment'],
            'common':p['pareto_common_exact_properties'],
            'two_feature':p['two_feature_conjunction'],
            'top_recovery':p['DTC_top_recovery'],
            'reports':p['required_reports'],
            'gates':p['headline_gates'],
          },indent=2,sort_keys=True))
          PY

      - name: Commit authoritative result
        run: |
          git config user.name mathgraph-bot
          git config user.email 32909488+heathsanchez@users.noreply.github.com
          git add results/distinction_transport_nucleus_v1
          git commit -m 'Record distinction transport nucleus V1 result' || exit 0
          git push origin HEAD:experiment/distinction-transport-nucleus-v1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distinction-transport-nucleus-v1-evidence
          path: |
            results/distinction_transport_nucleus_v1
            /tmp/distinction-transport-nucleus-v1.log
          if-no-files-found: warn
