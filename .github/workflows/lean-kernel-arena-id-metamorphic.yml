name: Lean Kernel Arena ID metamorphic generalization

on:
  push:
    branches: [agent/lean-kernel-arena-growth]
  workflow_dispatch:

jobs:
  metamorphic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test arbitrary-ID generalization and negative controls
        shell: bash
        run: |
          set -euo pipefail
          NANODA_REV=418320295890faed83a96fd97907b12a3b6728c2
          git clone https://github.com/ammkrn/nanoda_lib.git nanoda_lib
          git -C nanoda_lib checkout "$NANODA_REV"
          cat > nanoda_lib/config.json <<'JSON'
          {
            "use_stdin": true,
            "nat_extension": true,
            "string_extension": true,
            "unpermitted_axiom_hard_error": false,
            "unsafe_permit_all_axioms": true,
            "num_threads": 4
          }
          JSON
          cd nanoda_lib && cargo build --release && cd ..

          mkdir -p metamorphic/positive metamorphic/negative lean-kernel-arena-id-metamorphic-results
          python3 - <<'PY'
          from pathlib import Path
          import json, random, hashlib
          out=Path('metamorphic'); manifest=[]
          meta={"meta":{"exporter":{"name":"handcrafted-metamorphic","version":"0.1.0"},"format":{"version":"3.1.0"},"lean":{"githash":"2fcce7258eeb6e324366bc25f9058293b04b7547","version":"4.29.1"}}}
          # Canonical semantic object: axiom foo : Sort 2, with one Name, two Levels, one Expr.
          for seed in range(256):
              r=random.Random(seed)
              # External IDs are arbitrary keys. Keep namespace-local uniqueness only.
              name_id=r.randrange(1,1_000_000)
              level_a=r.randrange(1,1_000_000)
              level_b=r.randrange(1,1_000_000)
              while level_b==level_a: level_b=r.randrange(1,1_000_000)
              expr_id=r.randrange(0,1_000_000)
              rows=[meta,
                    {"in":name_id,"str":{"pre":0,"str":"foo"}},
                    {"il":level_b,"succ":0},
                    {"il":level_a,"succ":level_b},
                    {"ie":expr_id,"sort":level_a},
                    {"axiom":{"isUnsafe":False,"levelParams":[],"name":name_id,"type":expr_id}}]
              p=out/'positive'/f'{seed:03d}.ndjson'; p.write_text('\n'.join(json.dumps(x,separators=(',',':')) for x in rows)+'\n')
              manifest.append({'kind':'positive','seed':seed,'path':str(p),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})

              # Negative A: dangling level reference from the expression.
              bad=[dict(x) for x in rows]
              bad[4]={"ie":expr_id,"sort":1_000_001+seed}
              q=out/'negative'/f'{seed:03d}-dangling-level.ndjson'; q.write_text('\n'.join(json.dumps(x,separators=(',',':')) for x in bad)+'\n')
              manifest.append({'kind':'negative','seed':seed,'path':str(q),'sha256':hashlib.sha256(q.read_bytes()).hexdigest()})

              # Negative B: duplicate external expression key bound to a second distinct expression.
              dup=rows[:-1]+[{"ie":expr_id,"bvar":0},rows[-1]]
              q=out/'negative'/f'{seed:03d}-duplicate-expr.ndjson'; q.write_text('\n'.join(json.dumps(x,separators=(',',':')) for x in dup)+'\n')
              manifest.append({'kind':'negative','seed':seed,'path':str(q),'sha256':hashlib.sha256(q.read_bytes()).hexdigest()})
          Path('lean-kernel-arena-id-metamorphic-results/manifest.json').write_text(json.dumps(manifest,indent=2))
          PY

          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json
          exe=Path('nanoda_lib/target/release/nanoda_bin'); cfg=Path('nanoda_lib/config.json')
          rows=[]
          for p in sorted(Path('metamorphic/positive').glob('*.ndjson')):
              with p.open('rb') as f: rc=subprocess.run([str(exe),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
              rows.append({'path':str(p),'rc':rc})
          Path('lean-kernel-arena-id-metamorphic-results/baseline-positive.json').write_text(json.dumps(rows,indent=2))
          print('BASELINE_POSITIVE_ACCEPT',sum(r['rc']==0 for r in rows),'OF',len(rows))
          PY

          # Extract and apply exactly the already-proven representation repair.
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/lean-kernel-arena-growth.yml').read_text().splitlines(); marker='Repair only the representation identified by T1'; start=end=None
          for i,line in enumerate(src):
              if marker in line:
                  for j in range(i+1,len(src)):
                      if "python3 - <<'PY'" in src[j]: start=j+1; break
                  break
          for j in range(start,len(src)):
              if src[j].strip()=='PY': end=j; break
          body='\n'.join(line[10:] if line.startswith('          ') else line for line in src[start:end])+'\n'
          Path('/tmp/apply_representation_patch.py').write_text(body)
          PY
          cd nanoda_lib && python3 /tmp/apply_representation_patch.py && cargo build --release && cd ..

          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json
          exe=Path('nanoda_lib/target/release/nanoda_bin'); cfg=Path('nanoda_lib/config.json')
          def run(paths):
              rows=[]
              for p in sorted(paths):
                  with p.open('rb') as f: rc=subprocess.run([str(exe),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
                  rows.append({'path':str(p),'rc':rc})
              return rows
          pos=run(Path('metamorphic/positive').glob('*.ndjson')); neg=run(Path('metamorphic/negative').glob('*.ndjson'))
          summary={'positive_total':len(pos),'positive_accepted':sum(r['rc']==0 for r in pos),
                   'negative_total':len(neg),'negative_rejected':sum(r['rc']!=0 for r in neg),
                   'all_positive_accept':all(r['rc']==0 for r in pos),'all_negative_reject':all(r['rc']!=0 for r in neg)}
          Path('lean-kernel-arena-id-metamorphic-results/patched-positive.json').write_text(json.dumps(pos,indent=2))
          Path('lean-kernel-arena-id-metamorphic-results/patched-negative.json').write_text(json.dumps(neg,indent=2))
          Path('lean-kernel-arena-id-metamorphic-results/summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          print(json.dumps(summary,indent=2,sort_keys=True))
          if not summary['all_positive_accept'] or not summary['all_negative_reject']: raise SystemExit('metamorphic gate failed')
          PY

          # Causal ablation on a deterministic 32-case subset.
          cd nanoda_lib && git checkout -- src/parser.rs && cargo build --release && cd ..
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json
          exe=Path('nanoda_lib/target/release/nanoda_bin'); cfg=Path('nanoda_lib/config.json')
          rows=[]
          for p in sorted(Path('metamorphic/positive').glob('*.ndjson'))[:32]:
              with p.open('rb') as f: rc=subprocess.run([str(exe),str(cfg)],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
              rows.append({'path':str(p),'rc':rc})
          failed=sum(r['rc']!=0 for r in rows)
          Path('lean-kernel-arena-id-metamorphic-results/ablated.json').write_text(json.dumps(rows,indent=2))
          print('ABLATION_FAILURES',failed,'OF',len(rows))
          if failed==0: raise SystemExit('ablation had no causal effect')
          PY

      - name: Upload metamorphic audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-kernel-arena-id-metamorphic-results
          path: lean-kernel-arena-id-metamorphic-results/
