name: Continuity Difference Petri Dish V1

on:
  push:
    branches:
      - experiment/continuity-difference-petri-dish-v1
    paths:
      - 'experiments/continuity_difference_petri_dish_v1.py'
      - 'protocols/CONTINUITY_DIFFERENCE_PETRI_DISH_V1_PRECOMMIT.md'
      - '.github/workflows/continuity-difference-petri-dish-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: continuity-difference-petri-dish-v1
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/continuity-difference-petri-dish-v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify prospective freeze ancestry
        run: |
          git merge-base --is-ancestor 8f08e098b3feff913e39b12c5537f9bea6dd2f5c HEAD
          test -f protocols/CONTINUITY_DIFFERENCE_PETRI_DISH_V1_PRECOMMIT.md
          test -f experiments/cross_world_nucleus_invariance_v1.py
          test -f experiments/continuity_difference_petri_dish_v1.py

      - name: Run frozen Petri dish
        run: |
          python experiments/continuity_difference_petri_dish_v1.py             | tee /tmp/continuity-difference-petri-dish-v1.log

      - name: Validate scientific result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(
              Path('results/continuity_difference_petri_dish_v1/result.json').read_text()
          )

          assert p['protocol'] == 'CONTINUITY_DIFFERENCE_PETRI_DISH_V1'
          assert p['precommit_commit'] == '8f08e098b3feff913e39b12c5537f9bea6dd2f5c'
          assert p['verdict'] in {
              'PASS_CONTINUITY_DIFFERENCE_REGENERATIVE_NUCLEUS_V1',
              'REDUCED_CONTINUITY_DIFFERENCE_NUCLEUS_V1',
              'PARTIAL_CONTINUITY_DIFFERENCE_SIGNAL_V1',
              'VALID_NEGATIVE_CONTINUITY_DIFFERENCE_V1',
          }
          assert set(p['headline']) == {
              'binary','ternary','symbolic','temporal','graph'
          }
          assert p['sweep']['worlds'] == 125
          assert len(p['headline_gates']) == 15

          print('SCIENTIFIC_VERDICT=' + p['verdict'])
          print(json.dumps(p['headline_gates'], indent=2, sort_keys=True))
          print(json.dumps(p['sweep'], indent=2, sort_keys=True))
          PY

      - name: Commit authoritative scientific result
        run: |
          git config user.name 'mathgraph-bot'
          git config user.email '32909488+heathsanchez@users.noreply.github.com'
          git add             results/continuity_difference_petri_dish_v1/result.json             results/continuity_difference_petri_dish_v1/sweep.json
          git commit -m 'Record continuity-difference Petri dish V1 result' || exit 0
          git push origin HEAD:experiment/continuity-difference-petri-dish-v1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuity-difference-petri-dish-v1-evidence
          path: |
            results/continuity_difference_petri_dish_v1/result.json
            results/continuity_difference_petri_dish_v1/sweep.json
            /tmp/continuity-difference-petri-dish-v1.log
          if-no-files-found: warn
