name: Metalogic V56 Close Remaining Gaps
on:
  push:
    paths:
      - '.github/workflows/metalogic-v56-close-gaps.yml'
      - 'experiments/METALOGIC_HISTORICAL_BLIND_EDIT_V56A.py'
      - 'experiments/METALOGIC_CONSTRUCTOR_COMPOUNDING_V56B.py'
      - 'experiments/METALOGIC_MODEL_VERIFIER_LAYER_V56C.py'
  workflow_dispatch:
jobs:
  historical-v56a:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Freeze historical corpus
        run: |
          python -m pip install -q uv
          git clone -q https://github.com/soarsmu/BugsInPy.git /tmp/BugsInPy
          cd /tmp/BugsInPy && git checkout -q 11c5f1eea954a42132cfd06bf257766a7963e0fd
          chmod +x framework/bin/*
      - name: Run blind historical edit ratchet
        run: python experiments/METALOGIC_HISTORICAL_BLIND_EDIT_V56A.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: v56a-historical, path: artifacts/v56a/}
  constructor-v56b:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Provision worlds
        run: |
          git clone -q https://github.com/django/django.git /tmp/v56_django
          cd /tmp/v56_django && git checkout -q c6be0bf3bb744d234947cefd6def9f31d9655800 && python -m pip install -q -e .
          git clone -q https://github.com/psf/requests.git /tmp/v56_requests
          cd /tmp/v56_requests && git checkout -q 8068356288978c4f54661ae6f95afe0e0831885e && python -m pip install -q -e . 'pytest<8'
      - name: Run robust constructor compounding
        run: python experiments/METALOGIC_CONSTRUCTOR_COMPOUNDING_V56B.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: v56b-constructor, path: artifacts/v56b/}
  model-v56c:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install model stack
        run: python -m pip install -q 'torch>=2.4,<3' 'transformers>=4.46,<5' accelerate sentencepiece
      - name: Run structurally verified model layer
        env: {TOKENIZERS_PARALLELISM: 'false'}
        run: python experiments/METALOGIC_MODEL_VERIFIER_LAYER_V56C.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: v56c-model, path: artifacts/v56c/}
