name: Metalogic Scope Revision
on:
  push:
    paths:
      - '.github/workflows/metalogic-scope-revision-v35.yml'
      - 'experiments/METALOGIC_SCOPE_REVISION_RATCHET_V35.py'
      - 'experiments/METALOGIC_EXTERNAL_SCOPE_REVISION_V37.py'
      - 'experiments/METALOGIC_BEHAVIORAL_SCOPE_LOOP_V39.py'
  workflow_dispatch:
jobs:
  v35:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run scope and revision ratchet
        run: python experiments/METALOGIC_SCOPE_REVISION_RATCHET_V35.py
      - name: Upload V35 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-scope-revision-v35
          path: artifacts/scope_revision_ratchet_v35/
  v37:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expand fixed external corpus only
        run: |
          cp experiments/METALOGIC_EXTERNAL_SCOPE_REVISION_V37.py /tmp/v37_expanded.py
          sed -i "/('httpx'/a\ ('pytest','https://github.com/pytest-dev/pytest.git','68308aa288e00ff84880572ed9b3590f6cd7d470')," /tmp/v37_expanded.py
          sed -i "/('pytest'/a\ ('pydantic','https://github.com/pydantic/pydantic.git','02c5c975fa9f1bf4f094834487786d3148987fee')," /tmp/v37_expanded.py
          sed -i "/('pydantic'/a\ ('django','https://github.com/django/django.git','c6be0bf3bb744d234947cefd6def9f31d9655800')," /tmp/v37_expanded.py
      - name: Run frozen V37b mechanism on expanded corpus
        run: python /tmp/v37_expanded.py
      - name: Upload V37 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-external-scope-revision-v37
          path: artifacts/external_scope_revision_v37/
  v39_single_loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provision fixed external worlds
        run: |
          git clone -q https://github.com/django/django.git /tmp/v39_django
          cd /tmp/v39_django && git checkout -q c6be0bf3bb744d234947cefd6def9f31d9655800 && python -m pip install -q -e .
          git clone -q https://github.com/psf/requests.git /tmp/v39_requests
          cd /tmp/v39_requests && git checkout -q 8068356288978c4f54661ae6f95afe0e0831885e && python -m pip install -q -e . pytest
          git clone -q https://github.com/pallets/click.git /tmp/v39_click
          cd /tmp/v39_click && git checkout -q 9c4dfdaebe0e6b2aabc566eb81f6f10eb5cd6ea1 && python -m pip install -q -e . pytest
      - name: Apply infrastructure timeout correction only
        run: sed -i "s/timeout=20)/timeout=45)/" experiments/METALOGIC_BEHAVIORAL_SCOPE_LOOP_V39.py
      - name: Run frozen behavioral verifier loop
        run: python experiments/METALOGIC_BEHAVIORAL_SCOPE_LOOP_V39.py
      - name: Upload V39 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-behavioral-scope-loop-v39
          path: artifacts/v39/
