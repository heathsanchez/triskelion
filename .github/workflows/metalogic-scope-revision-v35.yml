name: Metalogic Scope Revision
on:
  push:
    paths:
      - '.github/workflows/metalogic-scope-revision-v35.yml'
      - 'experiments/METALOGIC_SCOPE_REVISION_RATCHET_V35.py'
      - 'experiments/METALOGIC_EXTERNAL_SCOPE_REVISION_V37.py'
  workflow_dispatch:
jobs:
  v35:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run scope and revision ratchet
        run: python experiments/METALOGIC_SCOPE_REVISION_RATCHET_V35.py
      - name: Upload V35 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-scope-revision-v35
          path: artifacts/scope_revision_ratchet_v35/
  v37:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expand fixed external corpus only
        run: |
          cp experiments/METALOGIC_EXTERNAL_SCOPE_REVISION_V37.py /tmp/v37_expanded.py
          sed -i "/('httpx'/a\ ('pytest','https://github.com/pytest-dev/pytest.git','68308aa288e00ff84880572ed9b3590f6cd7d470')," /tmp/v37_expanded.py
          sed -i "/('pytest'/a\ ('pydantic','https://github.com/pydantic/pydantic.git','02c5c975fa9f1bf4f094834487786d3148987fee')," /tmp/v37_expanded.py
          sed -i "/('pydantic'/a\ ('django','https://github.com/django/django.git','c6be0bf3bb744d234947cefd6def9f31d9655800')," /tmp/v37_expanded.py
      - name: Run frozen V37b mechanism on expanded corpus
        run: python /tmp/v37_expanded.py
      - name: Upload V37 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-external-scope-revision-v37
          path: artifacts/external_scope_revision_v37/
  v38a:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone fixed Django and install
        run: |
          git clone -q https://github.com/django/django.git /tmp/django
          cd /tmp/django
          git checkout -q c6be0bf3bb744d234947cefd6def9f31d9655800
          python -m pip install -q -e .
      - name: Baseline repository test passes
        run: |
          cd /tmp/django
          python tests/runtests.py backends.test_utils.TestUtils.test_truncate_name --verbosity 0
      - name: Boundary mutation is rejected by repository test
        run: |
          sed -i 's/len(name) <= length/len(name) < length/' /tmp/django/django/db/backends/utils.py
          cd /tmp/django
          if python tests/runtests.py backends.test_utils.TestUtils.test_truncate_name --verbosity 0; then exit 1; else echo EXPECTED_MUTATION_REJECTED; fi
      - name: Retained repair restores repository-test correctness
        run: |
          sed -i 's/len(name) < length/len(name) <= length/' /tmp/django/django/db/backends/utils.py
          cd /tmp/django
          python tests/runtests.py backends.test_utils.TestUtils.test_truncate_name --verbosity 0
          echo PASS_SEMANTIC_BOUNDARY_V38A
  v38b_positive_transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone fixed Requests and install
        run: |
          git clone -q https://github.com/psf/requests.git /tmp/requests
          cd /tmp/requests
          git checkout -q 8068356288978c4f54661ae6f95afe0e0831885e
          python -m pip install -q -e . pytest
      - name: Baseline Requests semantic test passes
        run: cd /tmp/requests && pytest -q tests/test_utils.py -k test_iter_slices
      - name: Strict-boundary mutation is behaviorally rejected
        run: |
          sed -i 's/slice_length <= 0/slice_length < 0/' /tmp/requests/src/requests/utils.py
          cd /tmp/requests
          if timeout 10s pytest -q tests/test_utils.py -k test_iter_slices; then exit 1; else echo EXPECTED_REQUESTS_MUTATION_REJECTED; fi
      - name: IF-test boundary repair transfers semantically
        run: |
          sed -i 's/slice_length < 0/slice_length <= 0/' /tmp/requests/src/requests/utils.py
          cd /tmp/requests
          pytest -q tests/test_utils.py -k test_iter_slices
          echo PASS_V38B_SOURCE_DISTINCT_POSITIVE_TRANSFER
  v38b_protected_click:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone fixed Click and install
        run: |
          git clone -q https://github.com/pallets/click.git /tmp/click
          cd /tmp/click
          git checkout -q 9c4dfdaebe0e6b2aabc566eb81f6f10eb5cd6ea1
          python -m pip install -q -e . pytest
      - name: Baseline Click protected behavior passes
        run: cd /tmp/click && pytest -q tests/test_options.py::test_counting
      - name: Fossilized strict-to-inclusive rule breaks protected semantics
        run: |
          sed -i 's/operator.le if self.min_open else operator.lt/operator.le if self.min_open else operator.le/' /tmp/click/src/click/types.py
          cd /tmp/click
          if pytest -q tests/test_options.py::test_counting; then exit 1; else echo EXPECTED_FOSSILIZATION_REJECTED; fi
      - name: Scoped rule preserves protected semantics
        run: |
          sed -i 's/operator.le if self.min_open else operator.le/operator.le if self.min_open else operator.lt/' /tmp/click/src/click/types.py
          cd /tmp/click
          pytest -q tests/test_options.py::test_counting
          echo PASS_V38B_PROTECTED_BEHAVIOR
  v38b_later_contradiction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone fixed Rich and install
        run: |
          git clone -q https://github.com/Textualize/rich.git /tmp/rich
          cd /tmp/rich
          git checkout -q 9d8f9a372cc5916fd4781fec207ced7ddac2f08f
          python -m pip install -q -e . pytest
      - name: Baseline Rich tests pass
        run: cd /tmp/rich && pytest -q tests/test_measure.py tests/test_console.py
      - name: Later strict IF-test counterevidence challenges retained scope
        run: |
          sed -i '0,/_max_width < 1/s//_max_width <= 1/' /tmp/rich/rich/measure.py
          cd /tmp/rich
          if pytest -q tests/test_measure.py tests/test_console.py; then echo NO_BEHAVIORAL_CONTRADICTION_FOUND; exit 2; else echo BEHAVIORAL_CONTRADICTION_FOUND_REVOKE; fi
