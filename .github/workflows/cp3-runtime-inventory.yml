name: CP3 runtime source inventory

on:
  push:
    branches: [cp3-recovery-20260815]
    paths:
      - '.github/workflows/cp3-runtime-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
      - name: Checkout sealed CP1 runtime source branch
        uses: actions/checkout@v4
        with:
          ref: private/verified-capability-runtime-cp1
          path: cp1source
      - name: Unpack sealed runtime and export exact CP1 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cp1runtime cp3_inventory cp1_export/triskelion cp1_export/experiments/river_checkpoint_1
          unzip -q cp1source/private_runtime/TRISKELION_VERIFIED_CAPABILITY_RUNTIME_CHECKPOINT_1_READY.zip -d cp1runtime
          find cp1runtime -type f | sort > cp3_inventory/files.txt
          cp cp1runtime/triskelion/*.py cp1_export/triskelion/
          cp cp1runtime/experiments/river_checkpoint_1/run.py cp1_export/experiments/river_checkpoint_1/
          cp cp1runtime/experiments/river_checkpoint_1/PROTOCOL.md cp1_export/experiments/river_checkpoint_1/
          for f in BENCHMARK_PROTOCOL.md PRODUCT_API.md CAPABILITY_REGISTRY.json pyproject.toml; do
            [ ! -f "cp1runtime/$f" ] || cp "cp1runtime/$f" cp1_export/
          done
          find cp1_export -type f -print0 | sort -z | xargs -0 sha256sum > cp1_export/SHA256SUMS.txt
          printf 'source_branch=%s\nsource_commit=%s\nzip_blob=%s\n' \
            'private/verified-capability-runtime-cp1' \
            '591c7d0119251699d33f908afe54de6f2cc77945' \
            '6f753051fbc8e3066f3e9ce9028cb4c62139642f' > cp1_export/PROVENANCE.txt
      - name: Upload runtime inventory
        uses: actions/upload-artifact@v4
        with:
          name: cp3-runtime-inventory
          path: cp3_inventory/
          retention-days: 90
      - name: Upload exact sealed runtime source
        uses: actions/upload-artifact@v4
        with:
          name: cp1-sealed-runtime-source
          path: cp1_export/
          retention-days: 90
          if-no-files-found: error
