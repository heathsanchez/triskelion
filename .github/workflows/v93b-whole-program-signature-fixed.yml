name: V93b Whole Program Signature Fixed
on:
  push:
    branches: [v93b-whole-program-signature-fixed]
jobs:
  v93b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pytest pytest-timeout
      - name: Fetch frozen QuixBugs
        run: |
          git clone -q https://github.com/jkoppel/QuixBugs /tmp/QuixBugs
          cd /tmp/QuixBugs
          git checkout -q 4257f44b0ff1181dedaedee6a447e133219fcebf
      - name: Run V93b
        run: QUIXBUGS_DIR=/tmp/QuixBugs OUT_DIR=results/v93b python experiments/METALOGIC_V93B_WHOLE_PROGRAM_SIGNATURE_FIXED.py
      - uses: actions/upload-artifact@v4
        with:
          name: v93b-whole-program-signature-fixed
          path: results/v93b/RESULT.json
