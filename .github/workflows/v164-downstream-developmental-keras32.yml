name: V164 Downstream Developmental keras32

on:
  push:
    branches: [v158-unified-developmental-runtime]
    paths:
      - 'protocols/V164_DOWNSTREAM_DEVELOPMENTAL_KERAS32_PRECOMMIT.md'
      - 'cp3/v164_downstream_developmental_keras32.py'
      - '.github/workflows/v164-downstream-developmental-keras32.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RIVER_API_KEY: ${{ secrets.RIVER_API_KEY }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Freeze V164 provenance before outcomes
        run: |
          git rev-parse HEAD
          python -m py_compile cp3/v164_downstream_developmental_keras32.py
          sha256sum protocols/V164_DOWNSTREAM_DEVELOPMENTAL_KERAS32_PRECOMMIT.md cp3/v164_downstream_developmental_keras32.py cp3/v159_safe_persistent_runner.py cp3/v159_natural_longitudinal_live.py cp3_frozen/acquisition/CAPABILITY.json cp3_frozen/acquisition/RAW_MEMORY.txt
      - name: Install frozen provider dependency
        run: python -m pip install --quiet 'river-client==0.6.1'
      - name: Fail-fast River transport gate
        run: |
          test -n "$RIVER_API_KEY"
          timeout --signal=TERM --kill-after=5s 30s python - <<'PY'
          import os
          import river_client as river
          model='Qwen/Qwen3.5-9B'
          client=river.Client(api_key=os.environ['RIVER_API_KEY'])
          if not client.health_check(): raise SystemExit('River health check failed before V164')
          if model not in list(client.get_capabilities()): raise SystemExit(f'frozen model unavailable: {model}')
          print('river_health True'); print('frozen_model_available True')
          PY
      - name: Clone frozen BugsInPy snapshot
        run: |
          git clone --depth 1 https://github.com/soarsmu/BugsInPy.git BugsInPy
          test "$(git -C BugsInPy rev-parse HEAD)" = "11c5f1eea954a42132cfd06bf257766a7963e0fd"
      - name: Pull exact keras historical runtime
        run: docker pull 'python:3.6.0@sha256:2b41a6b852f0f9b81c789b936baeea2dd9f2e99f5b1f7cfb72acff4811f3a6e7' || true
      - name: Run V164
        run: |
          mkdir -p artifacts
          PYTHONPATH="$PWD:$PWD/cp3:$PWD/cp3/vendor/cp1" python -B cp3/v164_downstream_developmental_keras32.py --bugsinpy "$PWD/BugsInPy" --out "$PWD/artifacts/v164"
      - name: Show V164 verdict
        if: always()
        run: |
          if [ -f artifacts/v164/V164_RESULT.json ]; then
            python - <<'PY'
          import json
          r=json.load(open('artifacts/v164/V164_RESULT.json'))
          print('V164 VERDICT', r.get('verdict'))
          print(json.dumps(r.get('state_audit'), indent=2, sort_keys=True))
          print(json.dumps(r.get('summary'), indent=2, sort_keys=True))
          print(json.dumps(r.get('mechanism'), indent=2, sort_keys=True))
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v164-downstream-developmental-keras32
          path: artifacts/v164/
          if-no-files-found: warn
