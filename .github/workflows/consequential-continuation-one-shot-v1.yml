name: Consequential Continuation One-Shot V1

on:
  push:
    branches:
      - experiment/consequential-continuation-one-shot-v1
    paths:
      - 'experiments/consequential_continuation_one_shot_v1.py'
      - 'protocols/CONSEQUENTIAL_CONTINUATION_ONE_SHOT_V1_PRECOMMIT.md'
      - '.github/workflows/consequential-continuation-one-shot-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  one-shot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/consequential-continuation-one-shot-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify prospective freeze and inputs
        run: |
          git merge-base --is-ancestor 28019f2cb7864ac0b755d44114bb5b765580980e HEAD
          test -f results/ternary_developmental_nucleus_census_v1/result.json

      - name: Run consequential continuation one-shot
        run: |
          set -o pipefail
          python experiments/consequential_continuation_one_shot_v1.py \
            results/ternary_developmental_nucleus_census_v1/result.json \
            results/consequential_continuation_one_shot_v1 \
            | tee /tmp/consequential-continuation-one-shot-v1.log

      - name: Validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('results/consequential_continuation_one_shot_v1/result.json').read_text())
          assert p['protocol']=='CONSEQUENTIAL_CONTINUATION_ONE_SHOT_V1'
          assert p['precommit_commit']=='28019f2cb7864ac0b755d44114bb5b765580980e'
          assert p['audit']['total']==256
          assert len(p['representations'])==4
          assert len(p['headline_gates'])==16
          print('SCIENTIFIC_VERDICT='+p['verdict'])
          print('CLASSIFICATION='+p['classification'])
          print('STRENGTH='+p['strength'])
          print('STRONG_INTERPRETATION='+str(p['strong_interpretation_supported']))
          print(json.dumps({
            'representations':p['representations'],
            'audit':p['audit'],
            'gates':p['headline_gates'],
          },indent=2,sort_keys=True))
          PY

      - name: Commit authoritative result
        run: |
          git config user.name mathgraph-bot
          git config user.email 32909488+heathsanchez@users.noreply.github.com
          git add results/consequential_continuation_one_shot_v1
          git commit -m 'Record consequential continuation one-shot V1 result' || exit 0
          git push origin HEAD:experiment/consequential-continuation-one-shot-v1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consequential-continuation-one-shot-v1-evidence
          path: |
            results/consequential_continuation_one_shot_v1
            /tmp/consequential-continuation-one-shot-v1.log
          if-no-files-found: warn
