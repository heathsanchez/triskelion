name: V156 format-matched raw-T1 semantic separator

on:
  push:
    branches: ["v156-format-matched-raw-t1-semantic-separator"]
    paths:
      - 'protocols/V156_FORMAT_MATCHED_RAW_T1_SEMANTIC_SEPARATOR_PRECOMMIT.md'
      - 'cp3/v156_format_matched_raw_t1_semantic_separator.py'
      - '.github/workflows/v156-format-matched-raw-t1-semantic-separator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  separator:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      RIVER_API_KEY: ${{ secrets.RIVER_API_KEY }}
      PYTHONDONTWRITEBYTECODE: "1"
      V145_TEMPLATE_ROOT: /tmp/v156_precompiled_templates
    steps:
      - uses: actions/checkout@v6

      - name: Freeze provenance before outcomes
        run: |
          python -m py_compile cp3/v156_format_matched_raw_t1_semantic_separator.py
          sha256sum protocols/V156_FORMAT_MATCHED_RAW_T1_SEMANTIC_SEPARATOR_PRECOMMIT.md cp3/v156_format_matched_raw_t1_semantic_separator.py .github/workflows/v156-format-matched-raw-t1-semantic-separator.yml

      - name: Clone official BugsInPy
        run: git clone --depth 1 https://github.com/soarsmu/BugsInPy.git BugsInPy

      - name: Pull exact historical runtimes
        run: |
          docker pull 'python:3.7.3@sha256:9e0b4f32487ca1863b45383420b8db77990debae748e2e875d2f86fa9510d4a5'
          docker pull 'python:3.7.4@sha256:fc0a398e1987fb1e58909053c11630e06adb3df265fe693391779020b9253f5e'

      - name: Install frozen provider dependency
        run: python -m pip install --quiet 'river-client==0.6.1'

      - name: Run V156 separator
        run: |
          mkdir -p artifacts
          PYTHONPATH="$PWD/cp3:$PWD/cp3/vendor/cp1" python -B cp3/v156_format_matched_raw_t1_semantic_separator.py \
            --bugsinpy "$PWD/BugsInPy" \
            --out "$PWD/artifacts/v156"

      - name: Show V156 verdict
        if: always()
        run: |
          if [ -f artifacts/v156/V156_RESULT.json ]; then
            python - <<'PY'
          import json
          r=json.load(open('artifacts/v156/V156_RESULT.json'))
          print('V156 VERDICT',r.get('verdict'))
          print(json.dumps(r.get('v156_control'),indent=2,sort_keys=True))
          print(json.dumps(r.get('v156_primary'),indent=2,sort_keys=True))
          print({a:v.get('success_n') for a,v in r.get('rival_execution_capability',{}).items()})
          PY
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v156-format-matched-raw-t1-semantic-separator
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
