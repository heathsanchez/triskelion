name: V158 Unified Developmental Runtime

on:
  push:
    branches:
      - v158-unified-developmental-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --quiet pytest
      - name: Compile runtime
        run: python -m py_compile developmental_runtime/state.py developmental_runtime/longitudinal.py scripts/run_v158_unified_runtime_selftest.py
      - name: Run runtime tests
        run: python -m pytest -q tests/test_developmental_runtime.py tests/test_longitudinal_gate.py
      - name: Run causal replay self-test
        run: PYTHONPATH="$PWD" python scripts/run_v158_unified_runtime_selftest.py
      - name: Show result
        run: cat artifacts/v158/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: v158-unified-developmental-runtime
          path: artifacts/v158/
          if-no-files-found: error
          retention-days: 90
