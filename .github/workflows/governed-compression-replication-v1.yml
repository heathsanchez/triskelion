name: Governed Compression Replication V1
on:
  push:
    branches: [agent/governed-compression-replication-v1]
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce valid negative
        shell: bash
        run: |
          set +e
          python experiments/governed_compression_replication_v1.py
          rc=$?
          set -e
          test "$rc" -eq 2
          grep -q 'VALID_NEGATIVE_GOVERNED_COMPRESSION_REPLICATION_V1' results/governed_compression_replication_v1/summary.json
