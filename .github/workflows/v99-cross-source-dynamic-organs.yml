name: V99 Cross-Source Dynamic Organs
on:
  push:
    branches: [v99-cross-source-dynamic-organs]
jobs:
  v99:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pytest pytest-timeout
      - name: Fetch frozen QuixBugs
        run: |
          git clone -q https://github.com/jkoppel/QuixBugs /tmp/QuixBugs
          cd /tmp/QuixBugs
          git checkout -q 4257f44b0ff1181dedaedee6a447e133219fcebf
      - name: Run V99
        run: QUIXBUGS_DIR=/tmp/QuixBugs OUT_DIR=results/v99 python experiments/METALOGIC_V99_CROSS_SOURCE_DYNAMIC_ORGANS.py
      - uses: actions/upload-artifact@v4
        with:
          name: v99-cross-source-dynamic-organs
          path: results/v99/RESULT.json
