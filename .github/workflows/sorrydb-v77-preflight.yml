name: SorryDB V77 Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sorrydb-v77-preflight.yml'
      - 'experiments/METALOGIC_SORRYDB_V77_PREFLIGHT.py'

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RIVER_API_KEY: ${{ secrets.RIVER_API_KEY }}
      SORRYDB_ROOT: vendor/SorryDB
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned SorryDB
        uses: actions/checkout@v4
        with:
          repository: SorryDB/SorryDB
          ref: 83bd1976b2c0891dfd6dc997cd61956df7005a7f
          path: vendor/SorryDB

      - name: Verify pinned SorryDB files
        run: |
          cd vendor/SorryDB
          test "$(git rev-parse HEAD)" = "83bd1976b2c0891dfd6dc997cd61956df7005a7f"
          test "$(git hash-object sorrydb/utils/verify.py)" = "00e3101c7bba30777dbd849fcda5f228c1712a32"
          test "$(git hash-object tests/test_verify.py)" = "0915f9e5bcc150b8d8cc124cf17f1ffe964bac99"

      - name: Install Lean/elan
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          lake-package-directory: vendor/SorryDB/tests/mock_lean_repository

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install frozen preflight dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'river-client==0.6.1' 'protobuf>=6.31.1,<7' \
            pytest==8.3.5 lean-interact==0.10.5 gitpython==3.1.44 \
            pydantic-settings==2.10.1 requests==2.32.5 python-dotenv==1.1.0 \
            langchain-core==1.1.3 langchain-community==0.4.1 \
            tavily-python==0.7.12 wikipedia==1.4.0

      - name: Require River secret
        run: test -n "$RIVER_API_KEY"

      - name: Reproduce official SorryDB verifier gate
        working-directory: vendor/SorryDB
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_verify.py::test_verify_proofs

      - name: Run V77 end-to-end preflight
        run: python experiments/METALOGIC_SORRYDB_V77_PREFLIGHT.py

      - name: Upload preflight artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sorrydb-v77-preflight
          path: artifacts/sorrydb_v77_preflight/
