name: V159 carrier structure entropy separator

on:
  workflow_dispatch:
  push:
    branches:
      - v159-carrier-structure-entropy-separator
    paths:
      - 'protocols/V159_CARRIER_STRUCTURE_ENTROPY_SEPARATOR_PRECOMMIT.md'
      - 'cp3/v159_carrier_structure_entropy_separator.py'
      - '.github/workflows/v159-carrier-structure-entropy-separator.yml'

jobs:
  v159:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RIVER_API_KEY: ${{ secrets.RIVER_API_KEY }}
      RIVER_BASE_URL: ${{ secrets.RIVER_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Obtain frozen BugsInPy corpus
        run: |
          git clone --depth 1 https://github.com/soarsmu/BugsInPy.git /tmp/BugsInPy
      - name: Run frozen V159 separator
        run: |
          cd cp3
          python v159_carrier_structure_entropy_separator.py \
            --bugsinpy /tmp/BugsInPy \
            --out "$GITHUB_WORKSPACE/v159_out"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v159-carrier-structure-entropy-separator
          path: v159_out/
          if-no-files-found: error

# Launch commit after protocol/apparatus freeze; no scientific parameter changed.
