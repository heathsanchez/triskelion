name: Metalogic Wake Sleep Staircase V6
on:
  push:
    paths:
      - 'experiments/METALOGIC_WAKE_SLEEP_STAIRCASE_V6.py'
      - '.github/workflows/metalogic-wake-sleep-v6.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wake-sleep-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RIVER_API_KEY: ${{ secrets.RIVER_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: python -m pip install 'river-client==0.6.1' 'protobuf>=6.31.1,<7' transformers
      - name: Require River secret
        run: test -n "$RIVER_API_KEY"
      - name: Run wake-sleep V6
        run: python experiments/METALOGIC_WAKE_SLEEP_STAIRCASE_V6.py
      - name: Upload scientific artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metalogic-wake-sleep-staircase-v6
          path: artifacts/wake_sleep_staircase_v6/
          if-no-files-found: warn
