name: Lean Kernel Arena infer-key search

on:
  push:
    branches: [agent/lean-kernel-arena-infer-key-search]

jobs:
  infer-key-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare pruned and full inference environment keys
        shell: bash
        run: |
          set -euo pipefail
          SOKO_REV=0fab8874080e379a774a9a27f7538d8a1ddd786b
          ARENA_ARTIFACT=8931227426
          OUT=results/infer-key-search
          rm -rf "$OUT" base fullenv arena-tests artifact tests.zip
          mkdir -p "$OUT" arena-tests artifact
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leanprover/lean-kernel-arena/actions/artifacts/${ARENA_ARTIFACT}/zip" -o tests.zip
          unzip -q tests.zip -d artifact
          tar -xzf artifact/lean-arena-tests.tar.gz -C arena-tests
          git clone https://github.com/intgrah/sokonanoda.git base
          git -C base checkout "$SOKO_REV"
          cp -a base fullenv
          python3 - <<'PY'
          from pathlib import Path
          p=Path('fullenv/src/infer.rs'); s=p.read_text()
          old="let key = (self.key_env(env, e) as *const value::Env<'t> as usize, e);"
          new="let infer_env = if self.ctx.num_loose_bvars(e) == 0 { self.key_env(env, e) } else { env };\n        let key = (infer_env as *const value::Env<'t> as usize, e);"
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          cat > base/config.json <<'JSON'
          {"use_stdin":true,"nat_extension":true,"string_extension":true,"unpermitted_axiom_hard_error":false,"unsafe_permit_all_axioms":true,"num_threads":2}
          JSON
          cp base/config.json fullenv/config.json
          (cd base && RUSTFLAGS='-C target-cpu=native' cargo build --release)
          (cd fullenv && RUSTFLAGS='-C target-cpu=native' cargo build --release)
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,time,json,statistics,random,hashlib
          root=Path.cwd(); out=root/'results/infer-key-search'
          bins={'pruned':root/'base/target/release/sokonanoda','fullenv':root/'fullenv/target/release/sokonanoda'}
          cfgs={'pruned':root/'base/config.json','fullenv':root/'fullenv/config.json'}
          def status(rc): return 'accept' if rc==0 else ('decline' if rc==2 else 'reject')
          cases=[]
          for kind,exp in [('good','accept'),('bad','reject')]:
              for p in (root/'arena-tests'/kind).rglob('*.ndjson'): cases.append((p,exp))
          correctness={}
          for v in bins:
              bad=[]
              for p,exp in cases:
                  with p.open('rb') as f:
                      rc=subprocess.run([str(bins[v]),str(cfgs[v])],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode
                  if status(rc)!=exp: bad.append({'file':str(p.relative_to(root/'arena-tests')),'expected':exp,'got':status(rc),'rc':rc})
              correctness[v]={'correct':len(cases)-len(bad),'total':len(cases),'failures':bad}
          fs=[p for p,_ in cases]
          workload=sorted(fs,key=lambda p:p.stat().st_size,reverse=True)[:24]
          workload=sorted(workload,key=lambda p:hashlib.sha256(str(p.relative_to(root/'arena-tests')).encode()).hexdigest())
          samples={v:[] for v in bins}
          for seed in range(14):
              order=list(bins); random.Random(seed).shuffle(order)
              for v in order:
                  t=time.perf_counter()
                  for p in workload:
                      with p.open('rb') as f:
                          subprocess.run([str(bins[v]),str(cfgs[v])],stdin=f,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,check=False)
                  samples[v].append(time.perf_counter()-t)
          med={v:statistics.median(xs) for v,xs in samples.items()}
          summary={'correctness':correctness,'samples_seconds':samples,'median_seconds':med,'speedup_fullenv_vs_pruned':med['pruned']/med['fullenv']}
          (out/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          print(json.dumps(summary,indent=2,sort_keys=True))
          if any(x['correct']!=x['total'] for x in correctness.values()): raise SystemExit('correctness regression')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-kernel-arena-infer-key-search
          path: results/infer-key-search/
