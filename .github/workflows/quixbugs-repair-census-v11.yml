name: QuixBugs Repair Census V11
on:
  push:
    paths:
      - '.github/workflows/quixbugs-repair-census-v11.yml'
      - 'experiments/QUIXBUGS_REPAIR_CENSUS_V11.py'
  workflow_dispatch:
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen census
        run: python experiments/QUIXBUGS_REPAIR_CENSUS_V11.py
      - name: Upload census artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quixbugs-repair-census-v11
          path: artifacts/quixbugs_census_v11/
